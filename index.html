<style id="app-css">:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#17203A; --muted:#5D6782; --line:#D8DEE8;
  --brand:#2246C8; --brand-ink:#FFFFFF; --brand-soft:#E3E9FB;
  --hl:#FFE45C; --hl-ink:#3D3300; --cancel:#C4352B; --cancel-soft:#FBE6E4;
  --test:#2246C8; --test-soft:#E3E9FB; --exam:#7A3ECF; --exam-soft:#EFE6FB;
  --radius:18px; --radius-sm:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131D; --surface:#1A2030; --surface-2:#212839; --ink:#E9EDF6; --muted:#9AA3B9; --line:#2D3549;
    --brand:#7F9CFF; --brand-ink:#0F131D; --brand-soft:#232D4D;
    --hl:#E9CB3B; --hl-ink:#231D00; --cancel:#FF7B70; --cancel-soft:#3A2224;
    --test:#7F9CFF; --test-soft:#232D4D; --exam:#BC98FF; --exam-soft:#2F2445;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131D; --surface:#1A2030; --surface-2:#212839; --ink:#E9EDF6; --muted:#9AA3B9; --line:#2D3549;
  --brand:#7F9CFF; --brand-ink:#0F131D; --brand-soft:#232D4D;
  --hl:#E9CB3B; --hl-ink:#231D00; --cancel:#FF7B70; --cancel-soft:#3A2224;
  --test:#7F9CFF; --test-soft:#232D4D; --exam:#BC98FF; --exam-soft:#2F2445;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 120px}
.topbar{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.brand{font-family:"Secular One","Rubik",system-ui,sans-serif;font-size:20px;flex:1}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 16px;font-weight:600}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;width:48px;height:48px;display:inline-grid;place-items:center;font-size:22px;line-height:1}
[dir="rtl"] .flip{transform:scaleX(-1)}
.dayhead{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.dayhead .t{flex:1;min-width:0}
.wd{font-family:"Secular One","Rubik",system-ui,sans-serif;font-size:40px;line-height:1.05;margin:0}
.dt{color:var(--muted);font-size:17px}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;position:relative}
.chip b{font-size:18px;font-weight:600}
.chip small{font-size:12px;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip.on small{color:inherit;opacity:.85}
.chip.today:not(.on){border-color:var(--brand);border-width:2px}
.chip .dot{position:absolute;top:6px;inset-inline-end:7px;width:7px;height:7px;border-radius:50%;background:var(--cancel)}
.notice{background:var(--surface);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;border:1px solid var(--line);font-size:15px}
.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lesson{display:flex;gap:14px;background:var(--surface);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--line);border-inline-start:6px solid var(--line)}
.lesson .num{font-family:"Secular One","Rubik",system-ui,sans-serif;font-size:30px;line-height:1;min-width:26px;text-align:center;color:var(--muted);padding-top:2px}
.lesson .body{flex:1;min-width:0}
.lesson .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.lesson .subj{font-size:20px;font-weight:600}
.lesson .time{color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;direction:ltr}
.lesson .r2{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin-top:2px}
.room s{opacity:.7}
.room mark{background:var(--hl);color:var(--hl-ink);border-radius:6px;padding:1px 7px;font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:14px;font-weight:600;border-radius:8px;padding:3px 9px}
.tag.cancel{background:var(--cancel-soft);color:var(--cancel)}
.tag.room{background:var(--hl);color:var(--hl-ink)}
.tag.test{background:var(--test-soft);color:var(--test)}
.tag.exam{background:var(--exam-soft);color:var(--exam)}
.lesson.is-cancel{border-inline-start-color:var(--cancel);background:var(--surface-2)}
.lesson.is-cancel .subj{text-decoration:line-through;text-decoration-color:var(--cancel);text-decoration-thickness:2px;color:var(--muted)}
.lesson.is-cancel .num{text-decoration:line-through;text-decoration-color:var(--cancel)}
.lesson.is-room{border-inline-start-color:var(--hl)}
.lesson.is-test{border-inline-start-color:var(--test)}
.lesson.is-exam{border-inline-start-color:var(--exam)}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty .big{font-family:"Secular One","Rubik",system-ui,sans-serif;font-size:26px;color:var(--ink);margin-bottom:6px}
.foot{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.link{background:none;border:none;color:var(--brand);font-weight:600;min-height:44px;padding:0 10px;text-decoration:underline;text-underline-offset:3px}
h2{font-family:"Secular One","Rubik",system-ui,sans-serif;font-size:30px;line-height:1.15;margin:10px 0 6px;font-weight:400}
h3{font-size:19px;margin:22px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:var(--radius);min-height:64px;padding:12px 16px;font-size:19px;font-weight:600;text-align:start;display:block;width:100%}
.grid3 .choice{text-align:center;font-size:22px;min-height:76px}
.choice small{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.choice.on{border-color:var(--brand);background:var(--brand-soft)}
.stack{display:flex;flex-direction:column;gap:10px}
.primary{background:var(--brand);color:var(--brand-ink);border:none;border-radius:16px;min-height:56px;padding:0 22px;font-weight:700;font-size:18px;width:100%}
.primary[disabled]{opacity:.45;cursor:default}
.secondary{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:48px;padding:0 16px;font-weight:600}
.danger{background:var(--cancel-soft);color:var(--cancel);border:none;border-radius:14px;min-height:48px;padding:0 16px;font-weight:600}
.steps{color:var(--muted);font-size:15px;margin-top:6px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:15px;font-weight:600;color:var(--muted)}
.input,select.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:50px;padding:0 14px;width:100%;font-size:17px}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 14px;padding-inline:16px;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 16px;white-space:nowrap;font-weight:600}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.elist{display:flex;flex-direction:column;gap:10px}
.eitem .head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.eitem .head b{font-size:18px}
.eitem .meta{color:var(--muted);font-size:15px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.acts button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:15px;padding:0 4px}
.acts .a-cancel{color:var(--cancel)} .acts .a-test{color:var(--test)} .acts .a-exam{color:var(--exam)}
.acts .a-room{background:var(--hl);color:var(--hl-ink);border-color:transparent}
.tag .x{background:none;border:none;font-weight:700;margin-inline-start:4px;padding:0 4px;min-width:28px;min-height:28px;color:inherit}
.rowbtn{display:flex;width:100%;align-items:center;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:56px;padding:10px 14px}
.rowbtn .n{font-family:"Secular One","Rubik",system-ui,sans-serif;font-size:22px;min-width:22px;color:var(--muted)}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn small{display:block;color:var(--muted);font-size:14px}
.subjblock{margin-bottom:12px}
.subjblock .rowbtn{margin-bottom:6px}
.indent{padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}
.pubbar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(20,30,60,.08)}
.pubbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.pubbar .msg{flex:1;font-size:15px;font-weight:600}
.pubbar .primary{width:auto}
.overlay{position:fixed;inset:0;background:rgba(10,14,25,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto}
.sheet h3{margin-top:0}
.sheet .btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sheet .btns .primary{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:30;max-width:calc(100% - 32px);font-weight:600;font-size:15px;text-align:center}
.toast.bad{background:var(--cancel);color:#fff}
.muted{color:var(--muted)}
.small{font-size:14px}
@media (max-width:360px){.wd{font-size:34px}.acts{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:no-preference){.lesson,.chip,.choice{transition:background-color .15s,border-color .15s}}
.langs{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px;gap:2px}
.lang{border:none;background:none;border-radius:999px;min-width:44px;min-height:40px;padding:0 10px;font-weight:600;color:var(--muted)}
.lang.on{background:var(--ink);color:var(--bg)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid4 .choice{text-align:center;font-size:24px;min-height:68px;padding:0;font-variant-numeric:tabular-nums}
.choice[disabled]{opacity:.3;cursor:default}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.letters .choice{text-align:center;font-size:22px}
.classname{font-family:"Secular One","Rubik",system-ui,sans-serif;font-size:64px;line-height:1;text-align:center;margin:8px 0 18px;display:flex;justify-content:center;gap:4px}
.classname .ph{color:var(--line)}
.lesson.free{background:transparent;border-style:dashed;border-inline-start:1px dashed var(--line);padding-top:10px;padding-bottom:10px}
.lesson.free .subj{font-size:17px;font-weight:500;color:var(--muted)}
.lesson.free .num{font-size:22px;opacity:.6}
.rowbtn.freebtn{background:transparent;border-style:dashed;color:var(--muted)}
.rowbtn .plus{font-size:24px;font-weight:600;color:var(--brand);padding-inline:6px}
.choice.multi{position:relative;padding-inline-start:52px}
.choice.multi::before{content:"";position:absolute;inset-inline-start:16px;top:50%;width:22px;height:22px;margin-top:-11px;border:2px solid var(--line);border-radius:7px;background:var(--surface)}
.choice.multi.on::before{background:var(--brand);border-color:var(--brand)}
.choice.multi.on::after{content:"";position:absolute;inset-inline-start:24px;top:50%;width:6px;height:12px;margin-top:-8px;border:solid var(--brand-ink);border-width:0 3px 3px 0;transform:rotate(45deg)}
.check{display:flex;gap:10px;align-items:center;min-height:48px;font-weight:600;margin-bottom:10px}
.check input{width:22px;height:22px}
.installbtn{min-height:52px;padding:0 22px;font-size:17px}
.brand{display:flex;align-items:center;gap:10px}
.logo{flex:none;border-radius:9px}
.segs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg{border:none;background:none;border-radius:10px;min-height:44px;font-weight:600;color:var(--muted);font-size:15px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.on{background:var(--ink);color:var(--bg)}
.tip{background:var(--hl);color:var(--hl-ink);border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:14px}
.isteps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:10px}
.isteps li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.inum{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
.itext{flex:1;min-width:0;font-size:16px}
.iico{flex:none;color:var(--brand);display:grid;place-items:center}
.searchbox{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:6px 0 10px;margin-bottom:4px}
[hidden]{display:none!important}
.pushbtn{width:auto}
.pushbtn.on{color:var(--brand)}
</style>

function t(k){return T[prefs.lang][k]||T.he[k]||k;}
function nm(o){if(!o)return '';return o[prefs.lang]||o.he||o.en||'';}
function todayISO(){var d=new Date();return iso(d);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function wday(s){return parse(s).getDay();}
function schoolDay(s){var w=wday(s);return w>=5?addDays(s,7-w):s;}
function stepDay(s,n){do{s=addDays(s,n);}while(wday(s)>=5);return s;}
function fmtDate(s,opts){try{return new Intl.DateTimeFormat(LOC[prefs.lang],opts||{day:'numeric',month:'long'}).format(parse(s));}catch(e){return s;}}
function byId(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null;}
function periodTime(st,n){var p=byId(st.periods.map(function(x){return {id:x.n,start:x.start,end:x.end};}),n);return p?p.start+'–'+p.end:'';}
function subjectsWithGroups(st){return st.subjects.filter(function(s){return st.groups.some(function(g){return g.subjectId===s.id;});});}
function groupFits(g,cid){if(g.exceptClasses&&g.exceptClasses.indexOf(cid)>=0)return false;return !g.classId||g.classId===cid;}
function groupsFor(st,sid,cid){return st.groups.filter(function(g){return g.subjectId===sid&&groupFits(g,cid);});}
function subjectsFor(st,cid){return st.subjects.filter(function(s){return groupsFor(st,s.id,cid).length>0;});}
function audLabel(st,a){
  if(!a)return '';
  if(a.type==='class'){var c=byId(st.classes,a.id);return c?nm(c):'?';}
  var g=byId(st.groups,a.id);if(!g)return '?';var s=byId(st.subjects,g.subjectId);return (s?nm(s)+' ':'')+nm(g)+(g.teacher?' ('+g.teacher+')':'');
}
function audKey(a){return a.type+':'+a.id;}
function keyAud(k){var i=k.indexOf(':');return {type:k.slice(0,i),id:k.slice(i+1)};}

function prefsValid(){
  if(!prefs.classId||!byId(STATE.classes,prefs.classId))return false;
  var gs=prefs.groups||{};
  return subjectsFor(STATE,prefs.classId).every(function(s){
    if(s.multi)return true;
    var v=gs[s.id];if(Array.isArray(v))v=v[0];var g=byId(STATE.groups,v);return g&&g.subjectId===s.id&&groupFits(g,prefs.classId);});
}

function gradeOf(k){for(var i=0;i<GRADES.length;i++)if(GRADES[i].k===k)return GRADES[i];return null;}
function gradeLabel(g){return g.he;}
function gradeIdx(k){var g=gradeOf(k);return g?GRADES.indexOf(g):99;}
function sortClasses(st){st.classes.sort(function(a,b){return gradeIdx(a.letter)-gradeIdx(b.letter)||(a.num||99)-(b.num||99);});}
function findClass(st,letter,num){for(var i=0;i<st.classes.length;i++){var c=st.classes[i];if(c.letter===letter&&c.num===num)return c;}return null;}
function applyLang(){document.documentElement.lang=prefs.lang;document.documentElement.dir=prefs.lang==='he'?'rtl':'ltr';document.title=t('app');}

function changesFor(st,date,lessonId){return st.changes.filter(function(c){return c.date===date&&c.lessonId===lessonId;});}
function studentLessons(date){
  var wd=wday(date),st=STATE,gids=[];var gs=prefs.groups||{};
  for(var k in gs){var v=gs[k];if(Array.isArray(v))gids=gids.concat(v);else if(v)gids.push(v);}
  gids=gids.filter(function(id){var g=byId(st.groups,id);return g&&groupFits(g,prefs.classId);});
  return st.lessons.filter(function(l){return l.day===wd&&((l.aud.type==='class'&&l.aud.id===prefs.classId)||(l.aud.type==='group'&&gids.indexOf(l.aud.id)>=0));})
    .sort(function(a,b){return a.period-b.period;})
    .map(function(l){return {l:l,ch:changesFor(st,date,l.id)};});
}

function normQ(x){return String(x||'').toLowerCase().replace(/[״"'׳`.,()\-–\/]/g,' ').replace(/\s+/g,' ').trim();}
function groupSubjects(st,g){var out=[];st.lessons.forEach(function(l){if(l.aud.type==='group'&&l.aud.id===g.id){var sb=byId(st.subjects,l.subjectId);if(sb){var k=sb.he+' '+(sb.en||'')+' '+(sb.ru||'');if(out.indexOf(k)<0)out.push(k);}}});return out;}

function weekLabel(d,today){
  var w=Math.round((parse(addDays(d,-wday(d)))-parse(addDays(today,-wday(today))))/(7*864e5));
  if(w===0)return '';if(w===1)return t('nextWeek');if(w===-1)return t('lastWeek');
  return w>0?t('inWeeks').replace('#',w):t('weeksAgo').replace('#',-w);
}
function lessonCard(l,ch){
  var s=byId(STATE.subjects,l.subjectId),cls=[],tags='',roomHtml=esc(l.room||'');
  ch.forEach(function(c){
    cls.push('is-'+c.type);
    if(c.type==='room'){roomHtml=(l.room?'<s>'+esc(l.room)+'</s> ':'')+'<mark>'+esc(c.room||'')+'</mark>';tags+='<span class="tag room">'+esc(t('roomChanged'))+(c.note?': '+esc(c.note):'')+'</span>';}
    else tags+='<span class="tag '+c.type+'">'+esc(t(c.type==='cancel'?'cancelled':c.type))+(c.note?': '+esc(c.note):'')+'</span>';
  });
  var hue=0,hn=String(s?s.he:'');for(var hi=0;hi<hn.length;hi++)hue=(hue*31+hn.charCodeAt(hi))%997;hue=Math.round((hue*137.508)%360);
  return '<li class="lesson '+cls.join(' ')+'" style="--hue:'+hue+'"><div class="num">'+l.period+'</div><div class="body">'+
    '<div class="r1"><span class="subj">'+esc(nm(s))+'</span><span class="time">'+esc(periodTime(STATE,l.period))+'</span></div>'+
    '<div class="r2">'+(l.teacher?'<span>'+esc(l.teacher)+'</span>':'')+(l.room||ch.some(function(c){return c.type==='room';})?'<span class="room">'+(/^חדר/.test(l.room||'')?'':esc(t('room'))+' ')+roomHtml+'</span>':'')+'</div>'+
    (tags?'<div class="tags">'+tags+'</div>':'')+'</div></li>';
}

function buildDocument(state){
  var css=document.getElementById('app-css').textContent,js=document.getElementById('app-js').textContent,S='script';
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html lang="he" dir="rtl">\n<head>\n'+HEAD+'<style id="app-css">'+css+'</'+'style>\n</head>\n<body>\n<div id="root"></div>\n<'+S+' type="application/json" id="app-state">'+json+'</'+S+'>\n<'+S+' id="app-js">'+js+'</'+S+'>\n</body>\n</html>\n';
}
var artifactP=null;
function getArtifact(){if(!artifactP){try{artifactP=(window.claude&&window.claude.use)?window.claude.use('artifact'):Promise.resolve(null);}catch(e){artifactP=Promise.resolve(null);}}return artifactP;}
var API=(function(){var u=String(window.SCHEDULE_API||'').trim();return /^(https:\/\/|http:\/\/localhost)/.test(u)?u.replace(/\/+$/,''):'';})();
function b64uBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function loadRemote(){
  if(!API)return;
  fetch(API+'/data',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d||!Array.isArray(d.lessons)||d.updatedAt===STATE.updatedAt)return;
    STATE=d;
    if(ui.screen==='editor'&&!dirty)draft=clone(STATE);
    if(ui.screen==='day'&&!prefsValid())startSetup();
    render();syncPush();
  }).catch(function(){});
}
function publishRemote(){
  var code=sGet('sessionStorage','sched.code');
  if(!code){toast(t('badServerCode'),true);return;}
  ui.busy=true;render();
  fetch(API+'/data',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Code':code},body:JSON.stringify({state:draft,base:STATE.updatedAt||null})})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {s:r.status,j:j};});})
  .then(function(x){
    ui.busy=false;
    if(x.s===200){draft.updatedAt=x.j.updatedAt;STATE=clone(draft);dirty=false;toast(t('published'));return;}
    if(x.s===409){return fetch(API+'/data',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){STATE=d;draft=clone(d);dirty=false;toast(t('conflict'),true);});}
    if(x.s===401){toast(t('badServerCode'),true);render();return;}
    toast(t('publishFailed'),true);
  }).catch(function(){ui.busy=false;toast(t('publishFailed'),true);});
}
function pushOn(){return sGet('localStorage','sched.push')==='on';}
function myGroupIds(){var gs=prefs.groups||{},ids=[];for(var k in gs){var v=gs[k];if(Array.isArray(v))ids=ids.concat(v);else if(v)ids.push(v);}return ids;}
// «отпечаток» подписки: адрес телефона + класс + группы + язык
function subSig(sub){return [sub.endpoint,prefs.classId,myGroupIds().slice().sort().join(','),prefs.lang].join('|');}
function sendSub(sub,force){
  var sig=subSig(sub);
  // если ничего не поменялось — не отправляем (бережём лимит записей на сервере)
  if(!force&&sGet('localStorage','sched.pushsig')===sig)return Promise.resolve();
  return fetch(API+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subscription:sub.toJSON?sub.toJSON():sub,classId:prefs.classId,groups:myGroupIds(),lang:prefs.lang})})
  .then(function(r){if(!r.ok)throw new Error('subscribe');sSet('localStorage','sched.pushsig',sig);});
}
function swReady(){return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});}
function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    if(platform()==='ios'&&!isStandalone()){ui.installOpen=true;render();toast(t('pushNeedInstall'),true);}
    else toast(t('pushUnsupported'),true);
    return;
  }
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){toast(t('pushDenied'),true);return;}
    return Promise.all([swReady(),fetch(API+'/vapid').then(function(r){return r.json();})]).then(function(a){
      var reg=a[0],key=a[1].key;
      return reg.pushManager.getSubscription().then(function(old){return old||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(key)});});
    }).then(function(sub){return sendSub(sub,true);}).then(function(){sSet('localStorage','sched.push','on');toast(t('pushOn'));render();});
  }).catch(function(){toast(t('pushFailed'),true);});
}
function disablePush(){
  var done=function(){sDel('localStorage','sched.push');sDel('localStorage','sched.pushsig');toast(t('pushOff'));render();};
  if(!('serviceWorker' in navigator)){done();return;}
  navigator.serviceWorker.getRegistration().then(function(reg){return reg&&reg.pushManager.getSubscription();}).then(function(s){
    if(!s)return;
    fetch(API+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).catch(function(){});
    return s.unsubscribe();
  }).catch(function(){}).then(done);
}
function syncPush(){
  if(!API||!pushOn()||!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistration().then(function(reg){return reg&&reg.pushManager.getSubscription();}).then(function(s){if(s)return sendSub(s);}).catch(function(){});
}
function publish(){
  if(API){publishRemote();return;}
  if(ui.busy)return;ui.busy=true;render();
  getArtifact().then(function(art){
    if(!art){ui.busy=false;toast(t('noPublish'),true);return;}
    draft.updatedAt=new Date().toISOString();
    saveEd();sSet('sessionStorage','sched.pending',draft.updatedAt);
    return art.publish(buildDocument(draft)).then(function(){
      /* the page reloads to the new version */
    },function(err){
      var code=err&&err.code;ui.busy=false;
      if(code==='conflict'){return;}
      sDel('sessionStorage','sched.pending');
      if(['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(code)>=0){ui.readOnly=true;toast(t('notWriter'),true);}
      else if(code==='rate_limited')toast(t('rateLimited'),true);
      else if(code==='too_large')toast(t('tooLarge'),true);
      else toast(t('publishFailed'),true);
    });
  });
}
function saveEd(){sSet('sessionStorage','sched.editor',{etab:ui.etab,eDate:ui.eDate,eAud:ui.eAud,wDay:ui.wDay,wAud:ui.wAud});}
function sha(s){
  try{return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return x.toString(16).padStart(2,'0');}).join('');});}
  catch(e){return Promise.resolve('');}
}
function toast(text,bad){ui.toast={text:text,bad:!!bad};render();clearTimeout(toast.tm);toast.tm=setTimeout(function(){ui.toast=null;render();},bad?6000:3500);}

function firstStep(){return STATE.classes.length===1?1:0;}
function startSetup(){ui.screen='setup';ui.setupStep=firstStep();ui.tmpLetter=null;ui.tmpClass=prefs.classId||null;ui.tmpGroups=Object.assign({},prefs.groups||{});
  if(firstStep()===1){ui.tmpClass=STATE.classes[0].id;
    if(!subjectsFor(STATE,ui.tmpClass).length){prefs.classId=ui.tmpClass;prefs.groups={};sSet('localStorage','sched.prefs',prefs);ui.screen='day';}}}

root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  if(a==='overlay'){if(e.target===el){ui.sheet=null;ui.delArm=false;ui.installOpen=false;render();}return;}
  switch(a){
    case 'setLang':prefs.lang=el.getAttribute('data-l');sSet('localStorage','sched.prefs',prefs);render();syncPush();break;
    case 'day':ui.date=stepDay(ui.date,+el.getAttribute('data-n'));render();break;
    case 'goto':ui.date=el.getAttribute('data-d');render();break;
    case 'pickClass':ui.tmpClass=id;render();break;
    case 'pickLetter':ui.tmpLetter=el.getAttribute('data-l');if(ui.tmpClass){var pc=byId(STATE.classes,ui.tmpClass);if(pc&&pc.letter!==ui.tmpLetter)ui.tmpClass=null;}render();break;
    case 'pickGroup':var sid=el.getAttribute('data-sub'),subj=byId(STATE.subjects,sid);
      if(subj&&subj.multi){var arr=Array.isArray(ui.tmpGroups[sid])?ui.tmpGroups[sid].slice():[];var ix=arr.indexOf(id);
        if(ix>=0)arr.splice(ix,1);
        else{var pg=byId(STATE.groups,id);
          if(pg&&pg.free)arr=[id];
          else{arr=arr.filter(function(x){var gg=byId(STATE.groups,x);return !(gg&&gg.free);});arr.push(id);}}
        ui.tmpGroups[sid]=arr;}
      else ui.tmpGroups[sid]=id;
      render();break;
    case 'setupBack':ui.setupStep--;ui.gq='';render();break;
    case 'setupNext':
      var total=1+subjectsFor(STATE,ui.tmpClass).length;
      if(ui.setupStep<total-1){ui.setupStep++;ui.gq='';render();window.scrollTo(0,0);}
      else{prefs.classId=ui.tmpClass;prefs.groups=ui.tmpGroups;sSet('localStorage','sched.prefs',prefs);syncPush();ui.screen='day';ui.date=schoolDay(todayISO());render();window.scrollTo(0,0);}
      break;
    case 'install':
      if(installEvt){var ev=installEvt;installEvt=null;try{ev.prompt();}catch(er){ui.installOpen=true;render();}}
      else{ui.installOpen=true;render();}
      break;
    case 'pushOn':enablePush();break;
    case 'pushOff':disablePush();break;
    case 'syncAll':dirty=true;publish();break;
    case 'closeInstall':ui.installOpen=false;render();break;
    case 'insPlat':ui.insPlat=el.getAttribute('data-p');render();break;
    case 'resetMine':startSetup();render();window.scrollTo(0,0);break;
    case 'editorLogin':ui.loginErr=false;ui.screen='login';render();var c=document.getElementById('code');if(c)c.focus();break;
    case 'home':ui.screen=prefsValid()?'day':'setup';if(ui.screen==='setup')startSetup();render();break;
    case 'login':doLogin();break;
    case 'exitEditor':sDel('sessionStorage','sched.editor');sDel('sessionStorage','sched.code');ui.screen=prefsValid()?'day':'setup';if(ui.screen==='setup')startSetup();draft=null;dirty=false;ui.sheet=null;render();break;
    case 'etab':ui.etab=el.getAttribute('data-tab');saveEd();render();window.scrollTo(0,0);break;
    case 'eday':ui.eDate=stepDay(ui.eDate,+el.getAttribute('data-n'));saveEd();render();break;
    case 'wday':ui.wDay=+el.getAttribute('data-n');saveEd();render();break;
    case 'addChange':
      var type=el.getAttribute('data-type');
      if(type==='cancel'){draft.changes=draft.changes.filter(function(c){return !(c.date===ui.eDate&&c.lessonId===id&&c.type==='cancel');});draft.changes.push({id:uid(),date:ui.eDate,lessonId:id,type:'cancel'});dirty=true;render();}
      else{ui.sheet={kind:'change',type:type,lessonId:id};render();}
      break;
    case 'rmChange':draft.changes=draft.changes.filter(function(c){return c.id!==id;});dirty=true;render();break;
    case 'newLesson':var ka=keyAud(ui.wAud),g=ka.type==='group'?byId(draft.groups,ka.id):null;ui.sheet={kind:'lesson',id:null,defSub:g?g.subjectId:null,defP:+el.getAttribute('data-p')||1};render();break;
    case 'editLesson':ui.sheet={kind:'lesson',id:id};render();break;
    case 'editClass':ui.sheet={kind:'class',id:id||null};render();break;
    case 'editSubject':ui.sheet={kind:'subject',id:id||null};render();break;
    case 'editGroup':ui.sheet={kind:'group',id:id||null,sub:el.getAttribute('data-sub')};render();break;
    case 'closeSheet':ui.sheet=null;ui.delArm=false;render();break;
    case 'sheetSave':sheetSave();break;
    case 'sheetDel':sheetDel();break;
    case 'saveGrade':draft.gradeName={he:val('gnHe'),en:val('gnEn'),ru:val('gnRu')};dirty=true;render();break;
    case 'saveTimes':draft.periods.forEach(function(p,i){p.start=val('ps'+i)||p.start;p.end=val('pe'+i)||p.end;});dirty=true;render();break;
    case 'addPeriod':var last=draft.periods[draft.periods.length-1];draft.periods.push({n:last?last.n+1:1,start:last?last.end:'08:00',end:last?last.end:'08:45'});dirty=true;render();break;
    case 'rmPeriod':if(draft.periods.length>1){var n=draft.periods.pop().n;var gone=draft.lessons.filter(function(l){return l.period===n;}).map(function(l){return l.id;});draft.lessons=draft.lessons.filter(function(l){return l.period!==n;});draft.changes=draft.changes.filter(function(c){return gone.indexOf(c.lessonId)<0;});dirty=true;render();}break;
    case 'changeCode':var nc=val('newCode');if(nc.length<4){document.getElementById('newCode').focus();return;}sha(nc).then(function(hh){if(!hh)return;draft.codeHash=hh;dirty=true;toast(t('codeChanged'));});break;
    case 'discard':draft=clone(STATE);dirty=false;render();break;
    case 'publish':publish();break;
  }
});
root.addEventListener('change',function(e){
  var el=e.target,k=el.getAttribute('data-change');if(!k)return;
  if(k==='edate'&&el.value){ui.eDate=schoolDay(el.value);}
  else if(k==='eaud'){ui.eAud=el.value;}
  else if(k==='waud'){ui.wAud=el.value;}
  saveEd();render();
});
root.addEventListener('input',function(e){if(e.target&&e.target.id==='gsearch')filterGroups(e.target.value);});
root.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='code'){doLogin();}});
function doLogin(){
  var v=val('code');
  sha(v).then(function(h){
    if(h&&h===STATE.codeHash){sSet('sessionStorage','sched.editor',{etab:ui.etab});sSet('sessionStorage','sched.code',v);ui.screen='editor';draft=clone(STATE);dirty=false;render();window.scrollTo(0,0);}
    else{ui.loginErr=true;render();var c=document.getElementById('code');if(c)c.focus();}
  });
}
/* swipe between days */
var tx=null,ty=null;
root.addEventListener('touchstart',function(e){if(ui.screen!=='day')return;tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
root.addEventListener('touchend',function(e){
  if(ui.screen!=='day'||tx==null)return;
  var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){var fwd=prefs.lang==='he'?dx>0:dx<0;ui.date=stepDay(ui.date,fwd?1:-1);render();}
},{passive:true});

/* ---------- start ---------- */
var pend=sGet('sessionStorage','sched.pending');
if(ed){ui.screen='editor';draft=clone(STATE);}
else if(prefsValid()){ui.screen='day';}
else startSetup();
if(pend){sDel('sessionStorage','sched.pending');ui.toast=null;setTimeout(function(){toast(pend===STATE.updatedAt?t('published'):t('conflict'),pend!==STATE.updatedAt);},50);}
render();
