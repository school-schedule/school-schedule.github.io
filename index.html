<style id="app-css">/* Стиль «как приложения iPhone»: системный шрифт, сгруппированные списки, системные цвета iOS */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --surface-2:#F2F2F7; --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.2);
  --ink:#000000; --muted:rgba(60,60,67,.6); --line:rgba(60,60,67,.29); --bar:rgba(249,249,249,.86);
  --brand:#007AFF; --brand-ink:#FFFFFF; --brand-soft:rgba(0,122,255,.12);
  --hl:#FFCC00; --hl-ink:#000000; --cancel:#FF3B30; --cancel-soft:rgba(255,59,48,.12);
  --test:#FF9500; --test-soft:rgba(255,149,0,.14); --exam:#AF52DE; --exam-soft:rgba(175,82,222,.14);
  --today:#FF3B30; --radius:12px; --radius-sm:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.32);
    --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.65); --bar:rgba(22,22,24,.82);
    --brand:#0A84FF; --brand-ink:#FFFFFF; --brand-soft:rgba(10,132,255,.2);
    --hl:#FFD60A; --hl-ink:#000000; --cancel:#FF453A; --cancel-soft:rgba(255,69,58,.2);
    --test:#FF9F0A; --test-soft:rgba(255,159,10,.2); --exam:#BF5AF2; --exam-soft:rgba(191,90,242,.22); --today:#FF453A;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.32);
  --ink:#FFFFFF; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.65); --bar:rgba(22,22,24,.82);
  --brand:#0A84FF; --brand-ink:#FFFFFF; --brand-soft:rgba(10,132,255,.2);
  --hl:#FFD60A; --hl-ink:#000000; --cancel:#FF453A; --cancel-soft:rgba(255,69,58,.2);
  --test:#FF9F0A; --test-soft:rgba(255,159,10,.2); --exam:#BF5AF2; --exam-soft:rgba(191,90,242,.22); --today:#FF453A;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Hebrew","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.35;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}

/* Верхняя панель — полупрозрачная, как навигация в iOS */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;margin:0 -16px;padding:8px 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.brand{flex:1;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600}
.logo{flex:none;border-radius:8px}
.pill,.icon-btn{border:none;background:var(--fill);color:var(--brand);font-weight:600}
.pill{border-radius:999px;min-height:36px;padding:0 14px;font-size:15px}
.icon-btn{border-radius:999px;width:36px;height:36px;display:inline-grid;place-items:center;font-size:18px;line-height:1}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* Большой заголовок дня */
.dayhead{display:flex;align-items:flex-end;gap:10px;margin:14px 0 10px}
.dayhead .t{flex:1;min-width:0}
.wd{font-size:34px;font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:0}
.dt{color:var(--muted);font-size:15px;margin-top:2px}

/* Неделя — как строка дней в «Календаре» */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:18px}
.chip{border:none;background:none;border-radius:999px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0;position:relative}
.chip b{font-size:17px;font-weight:600;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;order:2}
.chip small{font-size:11px;font-weight:600;color:var(--muted);order:1}
.chip.today b{color:var(--today)}
.chip.on b{background:var(--ink);color:var(--surface)}
.chip.on.today b{background:var(--today);color:#fff}
.chip.on small{color:var(--ink)}
.chip .dot{position:absolute;bottom:2px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--cancel)}

.notice{background:var(--surface);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;font-size:15px;color:var(--muted)}

/* Уроки — один сгруппированный список с тонкими разделителями */
.lessons{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:var(--radius);overflow:hidden}
.lesson{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;position:relative;background:var(--surface)}
.lesson + .lesson::before{content:"";position:absolute;top:0;inset-inline-start:56px;inset-inline-end:0;border-top:.5px solid var(--line)}
.lesson .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--ink);display:grid;place-items:center;font-size:15px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.lesson .body{flex:1;min-width:0}
.lesson .r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lesson .subj{font-size:17px;font-weight:600;min-width:0}
.lesson .time{flex:none;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;direction:ltr}
.lesson .r2{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;margin-top:1px}
.room s{opacity:.7}
.room mark{background:var(--hl);color:var(--hl-ink);border-radius:5px;padding:0 6px;font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px}
.tag.cancel{background:var(--cancel-soft);color:var(--cancel)}
.tag.room{background:var(--hl);color:var(--hl-ink)}
.tag.test{background:var(--test-soft);color:var(--test)}
.tag.exam{background:var(--exam-soft);color:var(--exam)}
.lesson.is-cancel .num{background:var(--cancel);color:#fff}
.lesson.is-cancel .subj{text-decoration:line-through;text-decoration-color:var(--cancel);color:var(--muted)}
.lesson.is-room .num{background:var(--hl);color:var(--hl-ink)}
.lesson.is-test .num{background:var(--test);color:#fff}
.lesson.is-exam .num{background:var(--exam);color:#fff}
.lesson.free{padding-top:9px;padding-bottom:9px}
.lesson.free .num{background:none;border:1px dashed var(--line);color:var(--muted)}
.lesson.free .subj{font-size:15px;font-weight:400;color:var(--muted)}

.empty{text-align:center;padding:56px 16px;color:var(--muted)}
.empty .big{font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px}
.foot{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.link{background:none;border:none;color:var(--brand);font-weight:400;min-height:44px;padding:0 10px}

/* Заголовки экранов */
h2{font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:18px 0 6px}
h3{font-size:13px;font-weight:400;color:var(--muted);margin:24px 16px 7px}
.sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.muted{color:var(--muted)}
.small{font-size:13px}
.steps{color:var(--muted);font-size:13px;margin-top:6px}

/* Выбор — список с галочкой справа, как в «Настройках» */
.stack{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:var(--radius);overflow:hidden}
.choice{border:none;background:var(--surface);border-radius:0;min-height:48px;padding:12px 48px 12px 16px;font-size:17px;font-weight:400;text-align:start;display:block;width:100%;position:relative}
[dir="rtl"] .choice{padding:12px 16px 12px 48px}
.stack .choice + .choice{background:linear-gradient(var(--line),var(--line)) right top/calc(100% - 16px) .5px no-repeat,var(--surface)}
[dir="rtl"] .stack .choice + .choice{background-position:left top}
.stack .choice + .choice:active{background-color:var(--fill)}
.choice small{display:block;font-size:15px;color:var(--muted)}
.choice:active{background:var(--fill)}
.choice.on::after{content:"";position:absolute;inset-inline-end:20px;top:50%;width:6px;height:12px;margin-top:-8px;border:solid var(--brand);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.choice[disabled]{opacity:.3;cursor:default}
/* Множественный выбор — кружки, как в «Напоминаниях» */
.choice.multi{padding-inline-start:52px}
.choice.multi::after{content:"";position:absolute;inset-inline-start:16px;inset-inline-end:auto;top:50%;width:22px;height:22px;margin-top:-11px;border:1.5px solid var(--line);border-radius:50%;background:none;transform:none}
.choice.multi.on::after{background:var(--brand);border-color:var(--brand)}
.choice.multi.on > :first-child,.choice.multi.on{color:var(--ink)}
.choice.multi.on::before{content:"";position:absolute;inset-inline-start:24px;top:50%;width:5px;height:10px;margin-top:-7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);z-index:1;border-top:none}
/* Плитки (классы, номера) */
.grid3,.grid4,.letters{display:grid;gap:8px}
.grid3{grid-template-columns:repeat(3,1fr)}
.grid4{grid-template-columns:repeat(4,1fr)}
.letters{grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.grid3 .choice,.grid4 .choice,.letters .choice{border-radius:var(--radius);text-align:center;padding:0;min-height:60px;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.grid3 .choice.on,.grid4 .choice.on,.letters .choice.on{background:var(--brand);color:var(--brand-ink)}
.grid3 .choice.on::after,.grid4 .choice.on::after,.letters .choice.on::after{display:none}
.classname{font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1;text-align:center;margin:8px 0 18px;display:flex;justify-content:center;gap:4px}
.classname .ph{color:var(--fill-2)}

/* Кнопки */
.primary{background:var(--brand);color:var(--brand-ink);border:none;border-radius:var(--radius);min-height:50px;padding:0 20px;font-weight:600;font-size:17px;width:100%}
.primary:active{opacity:.8}
.primary[disabled]{opacity:.35;cursor:default}
.secondary{background:var(--fill);color:var(--brand);border:none;border-radius:var(--radius);min-height:44px;padding:0 16px;font-weight:600}
.danger{background:var(--cancel-soft);color:var(--cancel);border:none;border-radius:var(--radius);min-height:44px;padding:0 16px;font-weight:600}
.installbtn{min-height:50px;padding:0 22px;font-size:17px}
.pushbtn{width:auto}
.pushbtn.on{color:var(--brand)}

/* Поля ввода */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted);padding-inline:4px}
.input,select.input{border:none;background:var(--surface);border-radius:var(--radius-sm);min-height:44px;padding:0 14px;width:100%;font-size:17px}
#gsearch.input{background:var(--fill);min-height:38px}
.row{display:flex;gap:8px;align-items:center}
.row > .grow{flex:1;min-width:0}
.searchbox{position:sticky;top:52px;z-index:2;background:var(--bg);padding:6px 0 10px;margin-bottom:4px}

/* Сегментированные переключатели */
.tabs,.segs,.langs{background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.tabs{display:flex;overflow-x:auto;margin:0 0 14px;scrollbar-width:none}
.segs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px}
.langs{display:inline-flex}
.tab,.seg,.lang{border:none;background:none;border-radius:7px;min-height:32px;padding:0 12px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.seg{overflow:hidden;text-overflow:ellipsis}
.lang{min-width:44px}
.tab.on,.seg.on,.lang.on{background:var(--surface);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}

/* Карточки и строки редактора */
.card,.rowbtn,.isteps li{background:var(--surface);border:none;border-radius:var(--radius)}
.card{padding:12px 16px}
.elist{display:flex;flex-direction:column;gap:10px}
.eitem .head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.eitem .head b{font-size:17px}
.eitem .meta{color:var(--muted);font-size:15px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.acts button{min-height:40px;border-radius:var(--radius-sm);border:none;background:var(--fill);font-weight:600;font-size:13px;padding:0 4px;color:var(--brand)}
.acts .a-cancel{color:var(--cancel)} .acts .a-test{color:var(--test)} .acts .a-exam{color:var(--exam)}
.acts .a-room{background:var(--hl);color:var(--hl-ink)}
.tag .x{background:none;border:none;font-weight:700;margin-inline-start:4px;padding:0 4px;min-width:28px;min-height:28px;color:inherit}
.rowbtn{display:flex;width:100%;align-items:center;gap:12px;text-align:start;min-height:48px;padding:10px 16px}
.rowbtn .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:15px;font-weight:600}
.rowbtn .grow{flex:1;min-width:0}
.rowbtn small{display:block;color:var(--muted);font-size:13px}
.rowbtn.freebtn{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.rowbtn .plus{font-size:22px;color:var(--brand);padding-inline:6px}
.subjblock{margin-bottom:12px}
.subjblock .rowbtn{margin-bottom:6px}
.indent{padding-inline-start:18px;display:flex;flex-direction:column;gap:6px}
/* Статистика в редакторе */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat b{display:block;font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.stattab{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:10px 6px;align-items:baseline;font-variant-numeric:tabular-nums}
.stattab span{text-align:center}
.stattab .th{font-size:12px;color:var(--muted)}
.stattab .th:first-child{text-align:start}
.check{display:flex;gap:10px;align-items:center;min-height:44px;margin-bottom:10px}
.check input{width:22px;height:22px;accent-color:var(--brand)}

/* Нижняя панель публикации */
.pubbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);z-index:10}
.pubbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.pubbar .msg{flex:1;font-size:15px;font-weight:600}
.pubbar .primary{width:auto}

/* Нижний лист (sheet) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:12px 12px 0 0;padding:22px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;position:relative}
.sheet::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--fill-2)}
.sheet h3{margin-top:0;font-size:20px;font-weight:700;color:var(--ink);margin-inline:0}
.sheet .btns{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.sheet .btns .primary{flex:1}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(100%)}to{transform:none}}}

/* Всплывающее сообщение — как системный баннер */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));background:var(--bar);color:var(--ink);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:12px 18px;border-radius:16px;z-index:30;max-width:calc(100% - 32px);font-weight:600;font-size:15px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.toast.bad{background:var(--cancel);color:#fff}

/* Подсказки и инструкция установки */
.tip{background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:12px 16px;font-size:15px;margin-bottom:14px;border-inline-start:4px solid var(--hl)}
.isteps{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.isteps li{display:flex;align-items:center;gap:12px;padding:12px 16px}
.inum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:600;font-size:15px}
.itext{flex:1;min-width:0;font-size:15px}
.iico{flex:none;color:var(--brand);display:grid;place-items:center}

[hidden]{display:none!important}
@media (max-width:360px){.wd{font-size:30px}.acts{grid-template-columns:repeat(2,1fr)}}

/* ---------- общая «тактильность»: кнопки слегка вжимаются при нажатии ---------- */
.choice,.primary,.secondary,.chip,.icon-btn,.pill,.acts button{transition:transform 140ms cubic-bezier(.23,1,.32,1)}
.choice:active,.primary:active,.secondary:active,.chip:active,.icon-btn:active,.pill:active,.acts button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.choice:active,.primary:active,.secondary:active,.chip:active,.icon-btn:active,.pill:active{transform:none}}


/* ===== Палитры 70/25/5: фон / карточки / акцент ===== */
html[data-look="p1"]{--P-bg:#121212;--P-card:#F5F5F5;--P-card-ink:#121212;--P-card-muted:#6B6B70;--P-acc:#386BFF;--P-acc-ink:#FFFFFF;--P-ink:#F5F5F5;--P-muted:#8A8A8E;--P-line:rgba(18,18,18,.12)}
html[data-look="p2"]{--P-bg:#171717;--P-card:#292929;--P-card-ink:#F2F2F2;--P-card-muted:#A3A3A3;--P-acc:#C6FF00;--P-acc-ink:#171717;--P-ink:#F2F2F2;--P-muted:#8C8C8C;--P-line:rgba(255,255,255,.08)}
html[data-look="p3"]{--P-bg:#121212;--P-card:#F4F0E8;--P-card-ink:#121212;--P-card-muted:#77716A;--P-acc:#FF6B35;--P-acc-ink:#FFFFFF;--P-ink:#F4F0E8;--P-muted:#8F8A82;--P-line:rgba(18,18,18,.12)}
html[data-look="p4"]{--P-bg:#161616;--P-card:#E5E5E5;--P-card-ink:#161616;--P-card-muted:#6E6E73;--P-acc:#8B5CF6;--P-acc-ink:#FFFFFF;--P-ink:#E5E5E5;--P-muted:#8A8A8E;--P-line:rgba(22,22,22,.12)}
html:root[data-look^="p"]:not([data-x]){--bg:var(--P-bg);--surface:var(--P-card);--ink:var(--P-ink);--muted:var(--P-muted);--line:rgba(255,255,255,.1);--bar:color-mix(in srgb,var(--P-bg) 88%,transparent);--brand:var(--P-acc);--brand-ink:var(--P-acc-ink);--fill:rgba(255,255,255,.08);--fill-2:rgba(255,255,255,.16);--hl:var(--P-acc);--hl-ink:var(--P-acc-ink);--today:var(--P-acc);--cancel:var(--P-card-muted);--cancel-soft:transparent;--test:var(--P-acc);--test-soft:transparent;--exam:var(--P-acc);--exam-soft:transparent}
/* внутри карточек — тёмный текст на светлом (или светлый на сером) */
html[data-look^="p"] .lesson:not(.free),html[data-look^="p"] .notice,html[data-look^="p"] .stack,html[data-look^="p"] .card,html[data-look^="p"] .rowbtn,html[data-look^="p"] .grid3 .choice,html[data-look^="p"] .grid4 .choice{--ink:var(--P-card-ink);--muted:var(--P-card-muted);--line:var(--P-line);--fill:var(--P-line);color:var(--P-card-ink)}
html[data-look^="p"] .lessons{background:none;border-radius:0;overflow:visible;display:flex;flex-direction:column;gap:8px}
html[data-look^="p"] .lesson{border-radius:18px;padding:14px 16px;background:var(--P-card)}
html[data-look^="p"] .lesson + .lesson::before{display:none}
html[data-look^="p"] .lesson .num{background:var(--P-card-ink);color:var(--P-card)}
html[data-look^="p"] .lesson.free{background:none;padding:4px 16px}
html[data-look^="p"] .lesson.free .num{background:none;border:1px solid rgba(255,255,255,.14);color:var(--P-muted)}
html[data-look^="p"] .lesson.free .subj,html[data-look^="p"] .lesson.free .time{color:var(--P-muted)}
html[data-look^="p"] .lesson.is-room .num,html[data-look^="p"] .lesson.is-test .num,html[data-look^="p"] .lesson.is-exam .num{background:var(--P-acc);color:var(--P-acc-ink)}
html[data-look^="p"] .lesson.is-cancel{opacity:.55}
html[data-look^="p"] .lesson.is-cancel .num{background:none;border:1.5px solid var(--P-card-ink);color:var(--P-card-ink)}
html[data-look^="p"] .lesson.is-cancel .subj{text-decoration-color:var(--P-card-ink)}
html[data-look^="p"] .tag{border-radius:999px;background:var(--P-acc)!important;color:var(--P-acc-ink)!important}
html[data-look^="p"] .tag.cancel{background:var(--P-card-ink)!important;color:var(--P-card)!important}
html[data-look^="p"] .room mark{background:var(--P-acc);color:var(--P-acc-ink)}
html[data-look^="p"] .chip.on b{background:var(--P-card);color:var(--P-card-ink)}
html[data-look^="p"] .chip.on.today b{background:var(--P-acc);color:var(--P-acc-ink)}
html[data-look^="p"] .chip.today b{color:var(--P-acc)}
html[data-look^="p"] .chip .dot{background:var(--P-acc)}
html[data-look^="p"] .notice{background:var(--P-card);border-radius:14px}
html[data-look^="p"] .tab.on,html[data-look^="p"] .seg.on,html[data-look^="p"] .lang.on{background:var(--P-card);color:var(--P-card-ink)}
html[data-look^="p"] .icon-btn,html[data-look^="p"] .pill{color:var(--P-ink)}
html[data-look^="p"] .primary{background:var(--P-acc);color:var(--P-acc-ink)}
html[data-look^="p"] .stack{border-radius:18px}
html[data-look^="p"] .choice.on::after{border-color:var(--P-acc)}
html[data-look^="p"] .grid3 .choice.on,html[data-look^="p"] .grid4 .choice.on{background:var(--P-acc);color:var(--P-acc-ink)}
html[data-look^="p"] .link{color:var(--P-acc)}
html[data-look="p2"] .lesson.free .num{border-color:rgba(255,255,255,.12)}

/* ===== Лайм: шрифт Rubik, логотип в цветах палитры ===== */
html[data-look="p2"] body{font-family:"Rubik",system-ui,-apple-system,sans-serif;letter-spacing:0}
html[data-look="p2"] .wd,html[data-look="p2"] h2{font-family:"Rubik",system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}


/* цифры — тем же Rubik, но «табличные»: все одной ширины, время выравнивается */
html[data-look="p2"] .time,html[data-look="p2"] .lesson .num,html[data-look="p2"] .grid3 .choice,html[data-look="p2"] .grid4 .choice,html[data-look="p2"] .classname{font-family:"Rubik",system-ui,sans-serif;font-variant-numeric:tabular-nums}
html[data-look="p2"] .lesson .num{font-weight:600}
html[data-look="p2"] .primary{border-radius:14px;font-weight:600}
html[data-look="p2"] .secondary,html[data-look="p2"] .installbtn{background:#292929;color:#F2F2F2}

/* ===== Кнопки с фоном вместо «просто надписи» ===== */
/* дни недели: у каждого дня своя плашка */
html[data-look="p2"] .strip{gap:8px}
html[data-look="p2"] .chip{min-height:64px;border-radius:16px;background:#292929;gap:0}
html[data-look="p2"] .chip b{width:auto;height:auto;background:none!important;color:var(--P-card-ink);font-size:18px;order:2}
html[data-look="p2"] .chip small{order:1;color:var(--P-card-muted)}
html[data-look="p2"] .chip.today b{color:var(--P-acc)}
html[data-look="p2"] .chip.on{background:#F2F2F2}
html[data-look="p2"] .chip.on b,html[data-look="p2"] .chip.on small{color:#171717}
html[data-look="p2"] .chip.on.today{background:var(--P-acc)}
html[data-look="p2"] .chip.on.today b,html[data-look="p2"] .chip.on.today small{color:var(--P-acc-ink)}
html[data-look="p2"] .chip .dot{bottom:6px}
html[data-look="p2"] .chip.on .dot{background:#171717}
/* ссылки-надписи → настоящие кнопки */
html[data-look="p2"] .link{background:#292929;color:var(--P-card-ink);border-radius:14px;min-height:48px;padding:0 20px;font-weight:500}
html[data-look="p2"] .foot{gap:10px}
html[data-look="p2"] .foot .link,html[data-look="p2"] .foot .installbtn{width:100%;max-width:340px}
html[data-look="p2"] .icon-btn{background:#292929;color:var(--P-card-ink);width:44px;height:44px;border-radius:14px}
html[data-look="p2"] .pill{background:#292929;color:var(--P-card-ink);border-radius:12px}
/* ближайшие контрольные: заголовок дня над карточками */
.dhead{font-size:15px;font-weight:600;color:var(--muted);margin:18px 4px 8px}
.dhead:first-of-type{margin-top:4px}
textarea.input{min-height:110px;padding:12px 14px;resize:vertical;font:inherit;line-height:1.4}
.report{padding:14px 16px;margin-bottom:8px}
.report .meta{color:var(--muted);font-size:13px;margin-bottom:4px}
.report p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
html[data-look^="p"] .report .danger{background:var(--P-bg);border-radius:14px}
/* выходной по событию из שחף */
.chip.off{opacity:.45}
.empty .ev{font-size:17px}
/* нижняя панель вкладок (как в Telegram / TikTok) */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;max-width:520px;margin:0 auto;height:68px;border-radius:34px;background:#0D0D0D;border:1px solid rgba(255,255,255,.07);box-shadow:0 12px 32px rgba(0,0,0,.55);overflow:hidden}
.tabbar[hidden]{display:none}
.tabbar .in{position:relative;display:flex;height:100%;padding:0 6px}
/* дорожка круга — совпадает с кнопками (отступы как у .in) */
.tabbar .track{position:absolute;top:0;bottom:0;left:6px;right:6px;pointer-events:none}
.tabbar button{flex:1;position:relative;z-index:1;border:none;background:none;color:#A3A3A3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:11px;font-weight:600;padding:12px 0 6px;transition:color .3s}
.tabbar button.on{color:#C6FF00}
.tabbar .ico{display:block;height:24px}
.tabbar .ico svg{display:block}
.tabbar .badge{position:absolute;top:7px;inset-inline-start:calc(50% + 5px);min-width:18px;height:18px;border-radius:9px;padding:0 5px;background:#C6FF00;color:#171717;font-size:11px;line-height:18px;text-align:center}
.tabbar .badge:empty{display:none}
/* светящийся круг под активной иконкой: переезжает с пружинкой */
.tabbar .orb{position:absolute;top:0;height:100%;width:calc(100% / var(--n,3));inset-inline-start:calc(var(--i,0) * 100% / var(--n,3));transition:inset-inline-start .55s cubic-bezier(.34,1.35,.64,1);pointer-events:none}
.tabbar .orb i{position:absolute;top:4px;left:50%;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:radial-gradient(circle,rgba(198,255,0,.28),rgba(198,255,0,.06) 70%);box-shadow:inset 0 0 0 1.5px #C6FF00,0 0 14px rgba(198,255,0,.45)}
.tabbar .ico.pop{animation:navpop .5s cubic-bezier(.34,1.5,.64,1)}
@keyframes navpop{0%{transform:none}40%{transform:translateY(-9px) scale(1.15)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.tabbar .orb{transition:none}.tabbar .ico.pop{animation:none}}
.morehead{margin:14px 0 4px}
/* текущий урок — рамка цвета акцента, следующий — подпись «далее» */
.lesson.is-now{box-shadow:inset 0 0 0 2px var(--today)}
html[data-look^="p"] .lesson.is-now{box-shadow:inset 0 0 0 2px var(--P-acc)}
html[data-look^="p"] .lesson.free.is-now{border-radius:18px;padding:8px 16px}
html[data-look^="p"] .tag.ev{background:var(--P-bg)!important;color:var(--P-card-ink)!important}
html[data-look^="p"] .tag.next{background:none!important;color:var(--P-card-muted)!important;box-shadow:inset 0 0 0 1px currentColor}

/* ===== Стиль «неон-капсулы» (как нижняя панель): переключатели, выбор, появление ===== */
[data-slide]{position:relative}
[data-slide] > :not(.slider){position:relative;z-index:1}
.slider{position:absolute;left:0;top:0;z-index:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle,rgba(198,255,0,.2),rgba(198,255,0,.04) 75%);box-shadow:inset 0 0 0 1.5px #C6FF00,0 0 14px rgba(198,255,0,.4);transition:transform .5s cubic-bezier(.34,1.3,.64,1),width .5s cubic-bezier(.34,1.3,.64,1),height .5s cubic-bezier(.34,1.3,.64,1)}
/* капсулы переключателей */
html[data-look="p2"] .langs,html[data-look="p2"] .tabs,html[data-look="p2"] .segs{background:#0D0D0D;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:4px;gap:4px}
html[data-look="p2"] .langs{border-radius:999px;padding:3px;gap:2px}
html[data-look="p2"] .lang,html[data-look="p2"] .tab,html[data-look="p2"] .seg{border-radius:12px;color:#A3A3A3;transition:color .3s}
html[data-look="p2"] .lang{border-radius:999px;min-width:38px;padding:0 9px}
html[data-look="p2"] .lang.on,html[data-look="p2"] .tab.on,html[data-look="p2"] .seg.on{background:none;box-shadow:none;color:#C6FF00}
/* дни недели: одна капсула, выбранный день — в светящемся кольце */
html[data-look="p2"] .strip{background:#0D0D0D;border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:6px;gap:4px}
html[data-look="p2"] .strip .slider{border-radius:16px}
html[data-look="p2"] .chip,html[data-look="p2"] .chip.on,html[data-look="p2"] .chip.on.today{background:none;min-height:58px;border-radius:16px}
html[data-look="p2"] .chip b{color:#A3A3A3;transition:color .3s}
html[data-look="p2"] .chip.today b,html[data-look="p2"] .chip.on.today b{color:#C6FF00}
html[data-look="p2"] .chip.on b{color:#F2F2F2}
html[data-look="p2"] .chip.on.today b{color:#C6FF00}
html[data-look="p2"] .chip .dot,html[data-look="p2"] .chip.on .dot{background:#C6FF00;box-shadow:0 0 6px rgba(198,255,0,.8)}
/* текущий урок и «Сейчас» светятся */
html[data-look^="p"] .lesson.is-now{box-shadow:inset 0 0 0 1.5px #C6FF00,0 0 18px rgba(198,255,0,.28)}
html[data-look^="p"] .tag.now{box-shadow:0 0 10px rgba(198,255,0,.55)}
/* выбор класса и групп: лаймовый контур со свечением вместо заливки */
html[data-look^="p"] .grid3 .choice.on,html[data-look^="p"] .grid4 .choice.on,html[data-look="p2"] .letters .choice.on{background:radial-gradient(circle,rgba(198,255,0,.18),rgba(198,255,0,.04) 75%);color:#C6FF00;box-shadow:inset 0 0 0 1.5px #C6FF00,0 0 14px rgba(198,255,0,.35)}
html[data-look="p2"] .stack .choice.on{box-shadow:inset 0 0 0 1.5px #C6FF00;border-radius:14px;background:rgba(198,255,0,.06)}
html[data-look="p2"] .primary{box-shadow:0 0 18px rgba(198,255,0,.25)}
/* тосты — капсула */
html[data-look="p2"] .toast{background:#0D0D0D;border:1px solid rgba(255,255,255,.08);border-radius:22px;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* анимации: экран, карточки по очереди, листы и тосты с пружинкой */
@media (prefers-reduced-motion:no-preference){
.wrap.enter .lessons > li,.wrap.enter .card,.wrap.enter .stack,.wrap.enter .grid4,.wrap.enter .foot > *{animation:cardin .5s cubic-bezier(.34,1.25,.64,1) both}
.wrap.enter .notice,.wrap.enter .dhead,.wrap.enter h2,.wrap.enter .sub,.wrap.enter .empty{animation:fadein .35s ease both}
.wrap.enter .lessons > li:nth-child(2),.wrap.enter .foot > :nth-child(2){animation-delay:30ms}
.wrap.enter .lessons > li:nth-child(3),.wrap.enter .foot > :nth-child(3){animation-delay:60ms}
.wrap.enter .lessons > li:nth-child(4),.wrap.enter .foot > :nth-child(4){animation-delay:90ms}
.wrap.enter .lessons > li:nth-child(5),.wrap.enter .foot > :nth-child(5){animation-delay:120ms}
.wrap.enter .lessons > li:nth-child(6),.wrap.enter .foot > :nth-child(6){animation-delay:150ms}
.wrap.enter .lessons > li:nth-child(7),.wrap.enter .foot > :nth-child(7){animation-delay:180ms}
.wrap.enter .lessons > li:nth-child(8){animation-delay:210ms}
.wrap.enter .lessons > li:nth-child(9){animation-delay:240ms}
.wrap.enter .lessons > li:nth-child(10){animation-delay:270ms}
.wrap.enter .lessons > li:nth-child(n+11){animation-delay:300ms}
.sheet{animation:up .45s cubic-bezier(.34,1.15,.64,1)}
.overlay{animation:fadein .25s ease}
.toast{animation:toastin .45s cubic-bezier(.34,1.4,.64,1)}
}
@keyframes cardin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-16px) scale(.92)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.slider{transition:none}}

/* ===== Друзья, кто свободен, найти учителя ===== */
.wide{width:100%;margin:10px 0}
.center{text-align:center}
.sec{font-size:17px;font-weight:700;margin:24px 4px 10px}
.mycode{text-align:center;padding:16px}
.codebig{font-size:34px;font-weight:700;letter-spacing:.18em;direction:ltr;color:#C6FF00;text-shadow:0 0 16px rgba(198,255,0,.5);margin:6px 0 12px;font-variant-numeric:tabular-nums}
.mycode .primary{max-width:240px}
.mycode p{margin:10px 0 0}
.pal{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:12px 14px;margin-bottom:8px;color:inherit;font:inherit}
.pal .grow{flex:1;min-width:0}
.pal small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pal small.acc{color:#C6FF00}
.pal svg{flex:none;color:var(--muted)}
.ava{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#C6FF00;box-shadow:inset 0 0 0 1.5px #C6FF00,0 0 10px rgba(198,255,0,.3)}
.cmpday{margin-top:0}
.cmpday .t{font-size:15px}
.cmp{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:stretch;margin-bottom:10px}
.cmp .hd{font-size:13px;font-weight:600;color:var(--muted);padding:0 4px}
.cmp .n{display:grid;place-items:center;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cmp .n.same,.cmp .n.both{color:#C6FF00}
.cmp .c{background:#101010;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;min-height:50px;font-size:14px;min-width:0;overflow-wrap:anywhere}
.cmp .c b{display:block;font-weight:600}
.cmp .c small{display:block;color:var(--muted);font-size:12px}
.cmp .c.free{color:var(--muted);display:flex;align-items:center}
.cmp .c.same{box-shadow:inset 0 0 0 1.5px #C6FF00,0 0 12px rgba(198,255,0,.25)}
.cmp .c.both{border:1.5px dashed rgba(198,255,0,.6);color:#C6FF00}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:4px 0 14px}
.lg::before{content:"";display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-inline-end:6px}
.lg.same::before{box-shadow:inset 0 0 0 1.5px #C6FF00}
.lg.both::before{border:1.5px dashed #C6FF00}
.crowd{padding:14px 16px}
.crowdbig{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.crowdbig b{font-size:40px;line-height:1;color:#C6FF00;text-shadow:0 0 16px rgba(198,255,0,.45);font-variant-numeric:tabular-nums}
.crowdbig span{color:var(--muted);font-size:14px}
.bars{display:flex;flex-direction:column;gap:5px;margin:8px 0 10px}
.bar{display:grid;grid-template-columns:22px 1fr 32px;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar .bt{height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .bt i{display:block;height:100%;border-radius:4px;background:rgba(198,255,0,.55)}
.bar.on{color:#C6FF00}
.bar.on .bt i{background:#C6FF00;box-shadow:0 0 8px rgba(198,255,0,.7)}
.bar .bv{text-align:end}
#tlist{margin-top:8px}
#tlist:not(:has(.choice:not([hidden]))){display:none}
.tcard{margin-top:10px;padding:14px 16px}
.tnow{color:#C6FF00;margin:6px 0 10px;font-weight:600}
.trow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.trow .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.trow .grow{flex:1;min-width:0}
.trow .r{color:var(--muted)}
.trow.on .n{color:#C6FF00;box-shadow:inset 0 0 0 1.5px #C6FF00,0 0 8px rgba(198,255,0,.5)}
.trow.cx{opacity:.45;text-decoration:line-through}
.code6{letter-spacing:.2em;text-transform:uppercase;font-weight:700}
/* ===== Итоги месяца (как истории) ===== */
.recapbanner{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:12px;padding:14px 16px;border-radius:20px;border:1px solid rgba(198,255,0,.5);background:radial-gradient(circle at 15% 50%,rgba(198,255,0,.18),rgba(198,255,0,.03) 70%),#101010;color:#C6FF00;font-weight:700;font-size:16px;text-align:start;box-shadow:0 0 18px rgba(198,255,0,.2)}
.recapbanner span{font-size:22px}
.recap{position:fixed;inset:0;z-index:30;background:#070707;color:#F2F2F2;overflow:hidden;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.rglow{position:absolute;inset:-30%;background:radial-gradient(circle at 30% 30%,rgba(198,255,0,.22),transparent 45%),radial-gradient(circle at 75% 75%,rgba(198,255,0,.14),transparent 40%);pointer-events:none}
.rbars{position:relative;display:flex;gap:4px;z-index:3}
.rbars span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.18)}
.rbars span.done,.rbars span.on{background:#C6FF00;box-shadow:0 0 6px rgba(198,255,0,.6)}
.rclose{position:absolute;top:calc(24px + env(safe-area-inset-top,0px));inset-inline-end:14px;z-index:4;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.4);color:#F2F2F2;font-size:16px}
.rtap{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.rtap.prev{left:0}.rtap.next{right:0}
.rslide{position:relative;z-index:3;pointer-events:none;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 10px}
.rbig{font-size:96px;font-weight:800;line-height:1;color:#C6FF00;text-shadow:0 0 30px rgba(198,255,0,.55);font-variant-numeric:tabular-nums}
.rbig.word{font-size:44px;line-height:1.15;overflow-wrap:anywhere}
.rtitle{font-size:24px;font-weight:700;max-width:320px}
.rsub{font-size:17px;color:#A3A3A3;max-width:320px}
.rhint{margin-top:30px;font-size:13px;color:#8C8C8C}
.rbtns{position:relative;z-index:3;pointer-events:auto;display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:28px}
@media (prefers-reduced-motion:no-preference){
.rslide > *{animation:cardin .6s cubic-bezier(.34,1.3,.64,1) both}
.rslide > :nth-child(2){animation-delay:.08s}.rslide > :nth-child(3){animation-delay:.16s}.rslide > :nth-child(4){animation-delay:.24s}
.rbig{animation:recappop .7s cubic-bezier(.34,1.6,.64,1) both!important}
.rglow{animation:rglow 8s ease-in-out infinite alternate}
}
@keyframes recappop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes rglow{from{transform:translate(0,0)}to{transform:translate(8%,6%)}}
/* ===== Отсчёт до конца урока и перемены ===== */
.cd{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;font-weight:600;color:#C6FF00;font-variant-numeric:tabular-nums}
.cd b{flex:1;position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.cd b i{position:absolute;top:0;bottom:0;inset-inline-start:0;width:0;border-radius:3px;background:#C6FF00;box-shadow:0 0 8px rgba(198,255,0,.7);transition:width 1s linear}
.cd span{flex:none;min-width:84px;text-align:end}
.lesson.brk{display:block;background:none!important;border:1px dashed rgba(198,255,0,.45)!important;border-radius:20px;padding:10px 16px}
.lesson.brk .bk{font-size:15px;font-weight:600;color:#F2F2F2}
.lesson.brk .cd{margin-top:6px}
.lesson .nx,.lesson.brk .nx{margin-top:6px;font-size:13px;color:#A3A3A3}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}

function canSkip(s){return s&&!s.multi&&(s.id==='cat_math'||s.id==='cat_eng'||s.id==='cat_mt');}

function migratePrefs(){
  var gs=prefs.groups;if(!gs||gs.cat_mt||!byId(STATE.subjects,'cat_mt')||!Array.isArray(gs.cat_b))return;
  // у кого был этот предмет — пусть сами выберут свой день (их спросят только этот шаг)
  if(gs.cat_b.indexOf('g51')>=0||gs.cat_b.indexOf('g42')>=0)return;

function prefsValid(){

  var gs=prefs.groups||{};

    if(s.multi)return true;
    var v=gs[s.id];if(Array.isArray(v))v=v[0];if(v==='__none'&&canSkip(s))return true;var g=byId(STATE.groups,v);return g&&g.subjectId===s.id&&groupFits(g,prefs.classId);});
}
var GRADES=[{k:'ז',he:'ז׳',n:7},{k:'ח',he:'ח׳',n:8},{k:'ט',he:'ט׳',n:9},{k:'י',he:'י׳',n:10},{k:'יא',he:'י״א',n:11},{k:'יב',he:'י״ב',n:12}];
function gradeOf(k){for(var i=0;i<GRADES.length;i++)if(GRADES[i].k===k)return GRADES[i];return null;}
function gradeLabel(g){return g.he;}
function gradeIdx(k){var g=gradeOf(k);return g?GRADES.indexOf(g):99;}
function sortClasses(st){st.classes.sort(function(a,b){return gradeIdx(a.letter)-gradeIdx(b.letter)||(a.num||99)-(b.num||99);});}
function findClass(st,letter,num){for(var i=0;i<st.classes.length;i++){var c=st.classes[i];if(c.letter===letter&&c.num===num)return c;}return null;}
function applyLang(){document.documentElement.lang=prefs.lang;document.documentElement.dir=prefs.lang==='he'?'rtl':'ltr';document.title=t('app');}

function changesFor(st,date,lessonId){return st.changes.filter(function(c){return c.date===date&&c.lessonId===lessonId;});}
// события из שחף (вкладка «אירועים»): для всей параллели или для отдельных классов
// событие для одной группы («בקבוצה של …») показываем, только если этот учитель ведёт у ученика уроки
function normT(s){return String(s||'').replace(/[״"'׳`\-–]/g,' ').replace(/\s+/g,' ').trim();}
function myTeachers(){var k=prefs.classId+'|'+JSON.stringify(prefs.groups)+'|'+STATE.updatedAt;if(myTeachers.k===k)return myTeachers.v;
  var set={},sun=addDays(todayISO(),-wday(todayISO()));for(var i=0;i<5;i++)studentLessons(addDays(sun,i)).forEach(function(x){set[normT(x.l.teacher)]=1;});
  myTeachers.k=k;myTeachers.v=set;return set;}
function eventsFor(date){return (STATE.events||[]).filter(function(e){return e.date===date&&(!e.cls||e.cls.indexOf(prefs.classId)>=0)&&(!e.teacher||myTeachers()[normT(e.teacher)]);});}
function dayOff(date){var e=eventsFor(date).filter(function(x){return x.off&&!x.from;});return e.length?e[0]:null;}
// уроки события (HTML): диапазон номеров всегда слева направо, иначе в иврите «4–1»
function evWhen(e){if(!e.from)return '';return esc(e.from===e.to?t('period'):t('periodsRange'))+' <bdi dir="ltr">'+esc(e.from===e.to?e.from:e.from+'–'+e.to)+'</bdi>';}
function studentLessons(date){
  var gids=[];var gs=prefs.groups||{};
  for(var k in gs){var v=gs[k];if(Array.isArray(v))gids=gids.concat(v);else if(v)gids.push(v);}
  return lessonsFor(date,prefs.classId,gids);
}
// уроки на дату для любого выбора: класс + группы (мой, друга, из сводки «кто свободен»)
function lessonsFor(date,cid,gids){
  var wd=wday(date),st=STATE;
  gids=(gids||[]).filter(function(id){var g=byId(st.groups,id);return g&&groupFits(g,cid);});
  return st.lessons.filter(function(l){return l.day===wd&&((l.aud.type==='class'&&l.aud.id===cid)||(l.aud.type==='group'&&gids.indexOf(l.aud.id)>=0));})
    .sort(function(a,b){return a.period-b.period;})
    .map(function(l){return {l:l,ch:changesFor(st,date,l.id)};});
}
// занятые уроки (без отменённых): {номер урока: запись}, первый и последний урок дня
function busyOf(items){var b={},first=0,last=0;items.forEach(function(x){if(x.ch.some(function(c){return c.type==='cancel';}))return;b[x.l.period]=x;if(!first||x.l.period<first)first=x.l.period;if(x.l.period>last)last=x.l.period;});return {b:b,first:first,last:last};}
// какой урок идёт сейчас (now) или будет следующим
function curPeriod(){var m=nowMins(),r=null;STATE.periods.forEach(function(x){if(!r&&mins(x.start)<=m&&m<mins(x.end))r={n:x.n,now:true};});
  if(!r)STATE.periods.forEach(function(x){if(!r&&mins(x.start)>m)r={n:x.n,now:false};});return r;}

// дней подряд, когда открывали приложение; пятница и суббота стрик не обрывают
function streak(){var s=sGet('localStorage','sched.streak');return s&&s.last&&s.n?s:null;}
function bumpStreak(){
  var d=todayISO(),s=streak();
  if(s&&s.last===d)return;
  var cont=false;
  if(s&&s.last<d){var x=addDays(s.last,1);while(x<d&&wday(x)>=5)x=addDays(x,1);cont=x===d;}
  var n=cont?s.n+1:1;
  sSet('localStorage','sched.streak',{last:d,n:n,best:Math.max(n,s&&s.best||0)});
  // для итогов месяца: сколько дней открывали и лучший стрик в этом месяце
  var op=sGet('localStorage','sched.opens')||{},ym=d.slice(0,7),m=op[ym]||{d:0,b:0};m.d++;m.b=Math.max(m.b,n);op[ym]=m;sSet('localStorage','sched.opens',op);
  bumpStreak.fresh=true;

function streakPill(){

function normQ(x){return String(x||'').toLowerCase().replace(/[״"'׳`.,()\-–\/]/g,' ').replace(/\s+/g,' ').trim();}
function groupSubjects(st,g){var out=[];st.lessons.forEach(function(l){if(l.aud.type==='group'&&l.aud.id===g.id){var sb=byId(st.subjects,l.subjectId);if(sb){var k=sb.he+' '+(sb.en||'')+' '+(sb.ru||'');if(out.indexOf(k)<0)out.push(k);}}});return out;}
function filterGroups(q){ui.gq=q;var nq=normQ(q),n=0;

  var none=document.getElementById('gnone');if(none)none.hidden=n>0;}
function renderSetup(){

// итоги прошлого месяца — считаются в телефоне по расписанию и изменениям
// итоги — только с октября 2026 (раньше приложения не было): кнопка и плашка появятся 1 ноября
var RECAP_FROM='2026-10';
function recapOn(){return prevMonth()>=RECAP_FROM;}
function prevMonth(){var d=parse(todayISO());d.setDate(1);d.setMonth(d.getMonth()-1);return iso(d).slice(0,7);}
function monthName(ym){try{return new Intl.DateTimeFormat(LOC[prefs.lang],{month:'long'}).format(parse(ym+'-01'));}catch(e){return ym;}}
function recapData(ym){
  var r={ym:ym,lessons:0,min:0,cancel:0,cancelBy:{},tests:0,rooms:{},subs:{}},d=ym+'-01',end=todayISO();
  for(;d.slice(0,7)===ym&&d<end;d=addDays(d,1)){
    if(wday(d)>=5||dayOff(d))continue;
    studentLessons(d).forEach(function(x){
      var sb=nm(byId(STATE.subjects,x.l.subjectId));
      x.ch.forEach(function(c){if(c.type==='test'||c.type==='exam')r.tests++;});
      if(x.ch.some(function(c){return c.type==='cancel';})){r.cancel++;r.cancelBy[sb]=(r.cancelBy[sb]||0)+1;return;}
      r.lessons++;var p=null;STATE.periods.forEach(function(q){if(q.n===x.l.period)p=q;});if(p)r.min+=mins(p.end)-mins(p.start);
      var rm=roomOf(x);if(rm)r.rooms[rm]=(r.rooms[rm]||0)+1;r.subs[sb]=(r.subs[sb]||0)+1;});
  }
  var top=function(o){var k=null;for(var x in o)if(k===null||o[x]>o[k])k=x;return k;};
  r.cancelTop=top(r.cancelBy);r.room=top(r.rooms);r.sub=top(r.subs);
  var op=(sGet('localStorage','sched.opens')||{})[ym]||{d:0,b:0};r.days=op.d;r.best=op.b;
  return r;
}

  S.push({big:r.lessons,title:t('recapLessons'),sub:t('recapHours').replace('{h}',Math.round(r.min/60))});
  S.push(r.cancel?{big:r.cancel,title:t('recapCancel'),sub:r.cancelTop?t('recapCancelTop').replace('{s}',r.cancelTop):''}:{big:'0',title:t('recapNoCancel'),sub:''});
  S.push(r.tests?{big:r.tests,title:t('recapTests'),sub:''}:{big:'😎',title:t('recapNoTests'),sub:''});
  if(r.room)S.push({big:r.room,title:t('recapRoom'),sub:t('recapRoomN').replace('{n}',r.rooms[r.room]),word:1});
  if(r.sub)S.push({big:r.sub,title:t('recapSubject'),sub:t('recapSubjectN').replace('{n}',r.subs[r.sub]),word:1});

// ключ переписки — случайный, хранится только в телефоне; сервер видит класс и сообщения, без имён
function chatKey(){var k=sGet('localStorage','sched.chat');if(typeof k==='string'&&/^[0-9a-f]{32}$/.test(k))return k;
  var a=new Uint8Array(16),i;try{crypto.getRandomValues(a);}catch(e){for(i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);}
  k='';for(i=0;i<16;i++)k+=(a[i]<16?'0':'')+a[i].toString(16);sSet('localStorage','sched.chat',k);return sGet('localStorage','sched.chat')===k?k:null;}
function chatOn(){return !!sGet('localStorage','sched.chatOn');}
// загрузить переписку; mark — отметить ответы прочитанными (когда чат открыт)
function chatLoad(mark){
  if(!API||!chatOn()){ui.chat={msgs:[],loaded:true};return;}
  var k=chatKey();if(!k||chatLoad.busy)return;chatLoad.busy=true;
  fetch(API+'/chat/get',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,mark:!!mark})})
  .then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j||!Array.isArray(j.msgs))return;
    var old=ui.chat&&ui.chat.msgs?ui.chat.msgs.length:-1;ui.chat={msgs:j.msgs,loaded:true};ui.chatUnread=j.unread||0;
    if(ui.screen==='chat'){if(old!==j.msgs.length){render();chatBottom();}}else syncNav();
  },function(){}).then(function(){chatLoad.busy=false;});
}
function chatBottom(){setTimeout(function(){window.scrollTo(0,document.body.scrollHeight);},0);}

function chatSend(){
  var text=String(ui.chatDraft||'').trim(),k=chatKey();if(!text||ui.chatBusy||!k)return;

  else if(ui.chatCtx){var p=+ui.chatCtx,l=null;studentLessons(d).forEach(function(x){if(!l&&x.l.period===p)l=x.l;});ctx={date:d,period:p,lessonId:l?l.id:''};}
  ui.chatBusy=true;render();
  fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,text:text,classId:prefs.classId||'',ctx:ctx})})
  .then(function(r){return r.status;},function(){return 0;}).then(function(st){
    ui.chatBusy=false;

  });

function sheetSave(){

function sheetDel(){

  else if(sh.kind==='group'){st.groups=st.groups.filter(function(g){return g.id!==sh.id;});rmLessons=st.lessons.filter(function(l){return l.aud.type==='group'&&l.aud.id===sh.id;}).map(function(l){return l.id;});}
  else if(sh.kind==='subject'){
    var gids=st.groups.filter(function(g){return g.subjectId===sh.id;}).map(function(g){return g.id;});
    st.subjects=st.subjects.filter(function(s){return s.id!==sh.id;});st.groups=st.groups.filter(function(g){return g.subjectId!==sh.id;});
    rmLessons=st.lessons.filter(function(l){return l.subjectId===sh.id||(l.aud.type==='group'&&gids.indexOf(l.aud.id)>=0);}).map(function(l){return l.id;});
  }
  st.lessons=st.lessons.filter(function(l){return rmLessons.indexOf(l.id)<0;});
  st.changes=st.changes.filter(function(c){return rmLessons.indexOf(c.lessonId)<0;});
  ui.sheet=null;ui.delArm=false;dirty=true;render();
}

/* ---------- publish ---------- */
var API=(function(){var u=String(window.SCHEDULE_API||'').trim();return /^(https:\/\/|http:\/\/localhost)/.test(u)?u.replace(/\/+$/,''):'';})();
function b64uBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function loadRemote(){
  if(!API)return;
  fetch(API+'/data',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d||!Array.isArray(d.lessons)||d.updatedAt===STATE.updatedAt)return;
    STATE=d;sSet('localStorage','sched.data',d);
    if(ui.screen==='editor'&&!dirty)draft=clone(STATE);
    if(ui.screen==='day'&&!prefsValid())startSetup();
    render();syncPush();
  }).catch(function(){});
}
function publishRemote(){
  var code=sGet('sessionStorage','sched.code');
  if(!code){toast(t('badServerCode'),true);return;}
  ui.busy=true;render();
  fetch(API+'/data',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Code':encodeURIComponent(code)},body:JSON.stringify({state:draft,base:STATE.updatedAt||null})})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {s:r.status,j:j};});})
  .then(function(x){
    ui.busy=false;
    if(x.s===200){draft.updatedAt=x.j.updatedAt;STATE=clone(draft);dirty=false;toast(t('published'));return;}
    if(x.s===409){return fetch(API+'/data',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){STATE=d;draft=clone(d);dirty=false;toast(t('conflict'),true);});}
    if(x.s===429){toast(t('locked').replace('{m}',Math.ceil(((x.j&&x.j.retryAfter)||900)/60)),true);render();return;}
    if(x.s===401){toast(t('badServerCode'),true);render();return;}
    toast(t('publishFailed'),true);
  }).catch(function(){ui.busy=false;toast(t('publishFailed'),true);});
}
// код в заголовке кодируем: браузер не отправит заголовок с ивритом или кириллицей (статус 0)
function backupsCall(path,method,body){
  var code=sGet('sessionStorage','sched.code');
  return fetch(API+path,{method:method,headers:{'Content-Type':'application/json','X-Editor-Code':encodeURIComponent(code||'')},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){return {s:r.status,j:j};});})
  .catch(function(){return {s:0,j:{}};});
}
function backupErr(x){toast(x.s===429?t('locked').replace('{m}',15):x.s===401?t('badServerCode'):t('publishFailed'),true);}
// стрелка «назад/вперёд»: на иврите «назад» смотрит вправо, «вперёд» — влево
function chev(n){var rtl=prefs.lang==='he',right=(n>0)!==rtl;
  return '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true" style="display:block"><path d="'+(right?'M7.5 4l6 6-6 6':'M12.5 4l-6 6 6 6')+'" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';}
function pushOn(){return sGet('localStorage','sched.push')==='on';}
function myGroupIds(){var gs=prefs.groups||{},ids=[];for(var k in gs){var v=gs[k];if(Array.isArray(v))ids=ids.concat(v);else if(v)ids.push(v);}return ids.filter(function(x){return x!=='__none';});}
// «отпечаток» подписки: адрес телефона + класс + группы + язык
function subSig(sub){return [sub.endpoint,prefs.classId,myGroupIds().slice().sort().join(','),prefs.lang].join('|');}
function sendSub(sub,force){
  var sig=subSig(sub);
  // если ничего не поменялось — не отправляем (бережём лимит записей на сервере)
  if(!force&&sGet('localStorage','sched.pushsig')===sig)return Promise.resolve();
  return fetch(API+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({subscription:sub.toJSON?sub.toJSON():sub,classId:prefs.classId,groups:myGroupIds(),lang:prefs.lang})})
  .then(function(r){if(!r.ok)throw new Error('subscribe');sSet('localStorage','sched.pushsig',sig);});
}
function swReady(){return navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;});}
function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){
    if(platform()==='ios'&&!isStandalone()){ui.installOpen=true;render();toast(t('pushNeedInstall'),true);}
    else toast(t('pushUnsupported'),true);
    return;
  }
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){toast(t('pushDenied'),true);return;}
    return Promise.all([swReady(),fetch(API+'/vapid').then(function(r){return r.json();})]).then(function(a){
      var reg=a[0],key=a[1].key;
      return reg.pushManager.getSubscription().then(function(old){return old||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(key)});});
    }).then(function(sub){return sendSub(sub,true);}).then(function(){sSet('localStorage','sched.push','on');toast(t('pushOn'));render();});
  }).catch(function(){toast(t('pushFailed'),true);});
}
function disablePush(){
  var done=function(){sDel('localStorage','sched.push');sDel('localStorage','sched.pushsig');toast(t('pushOff'));render();};
  if(!('serviceWorker' in navigator)){done();return;}
  navigator.serviceWorker.getRegistration().then(function(reg){return reg&&reg.pushManager.getSubscription();}).then(function(s){
    if(!s)return;
    fetch(API+'/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({endpoint:s.endpoint})}).catch(function(){});
    return s.unsubscribe();
  }).catch(function(){}).then(done);
}
function syncPush(){
  if(!API||!pushOn()||!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistration().then(function(reg){return reg&&reg.pushManager.getSubscription();}).then(function(s){if(s)return sendSub(s);}).catch(function(){});
}
// анонимный счётчик: случайный id устройства (создаётся один раз) и класс, раз в день
function deviceId(){
  var id=sGet('localStorage','sched.device');
  if(typeof id==='string'&&/^[0-9a-f]{32}$/.test(id))return id;
  var a=new Uint8Array(16),i;
  try{crypto.getRandomValues(a);}catch(e){for(i=0;i<16;i++)a[i]=Math.floor(Math.random()*256);}
  id='';for(i=0;i<16;i++)id+=(a[i]<16?'0':'')+a[i].toString(16);
  sSet('localStorage','sched.device',id);
  // хранилище недоступно (частный режим) — не считаем, иначе каждое открытие было бы «новым» устройством
  return sGet('localStorage','sched.device')===id?id:null;
}
function pingStats(){
  try{
    if(!API||pingStats.busy||!prefsValid())return;
    // только с нашего сайта (или с локального wrangler dev при проверке)
    if(location.hostname!=='school-schedule.github.io'&&!/^http:\/\/localhost/.test(API))return;
    var day=todayISO()+'|'+prefs.classId+'|'+myGroupIds().sort().join(','),id;
    if(sGet('localStorage','sched.ping')===day||!(id=deviceId()))return;
    pingStats.busy=true;
    fetch(API+'/hi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,classId:prefs.classId||'',groups:myGroupIds()})})
    // сервер ответил (даже отказом) — сегодня больше не отправляем; нет сети — попробуем при следующем открытии
    .then(function(){sSet('localStorage','sched.ping',day);},function(){})
    .then(function(){pingStats.busy=false;});
  }catch(e){pingStats.busy=false;}
}

/* ---------- render ---------- */
function render(){
  applyLang();
  var h='<div class="wrap">';
  if(ui.screen==='setup')h+=renderSetup();
  else if(ui.screen==='login')h+=renderLogin();
  else if(ui.screen==='editor')h+=renderEditor();
  else if(ui.screen==='tests')h+=renderTests();

// светящаяся подсветка в переключателях (дни, языки, вкладки редактора): render() пересоздаёт
// разметку, поэтому ставим подсветку на старое место и сразу переносим на новое — браузер анимирует.
// Анимируется только переключатель, который нажали (slideAll.only), остальные встают на место сразу.
var SLIDE={};
function slideAll(){
  root.querySelectorAll('[data-slide]').forEach(function(c){
    // при смене направления (иврит ↔ EN/RU) подсветка встаёт сразу, без пролёта через весь ряд
    var sl=c.querySelector('.slider'),on=c.querySelector('.on'),k=c.getAttribute('data-slide')+'|'+document.documentElement.dir;
    if(!sl)return;
    if(!on){sl.style.opacity='0';delete SLIDE[k];return;}
    var r={x:on.offsetLeft,y:on.offsetTop,w:on.offsetWidth,h:on.offsetHeight},p=SLIDE[k];
    var put=function(q){sl.style.transform='translate('+q.x+'px,'+q.y+'px)';sl.style.width=q.w+'px';sl.style.height=q.h+'px';};
    var go=p&&c.getAttribute('data-slide')===slideAll.only&&(p.x!==r.x||p.y!==r.y||p.w!==r.w);
    sl.style.transition='none';
    if(go){put(p);void sl.offsetWidth;sl.style.transition='';}
    put(r);SLIDE[k]=r;
    if(!go){void sl.offsetWidth;sl.style.transition='';}
    // ряд вкладок редактора прокручивается: выбранная вкладка всегда на виду
    if(c.scrollWidth>c.clientWidth){var L=on.offsetLeft,R=L+on.offsetWidth;if(L<c.scrollLeft||R>c.scrollLeft+c.clientWidth)c.scrollLeft=L-(c.clientWidth-on.offsetWidth)/2;}
  });
}
