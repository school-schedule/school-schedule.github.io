<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#171717">
<meta name="robots" content="noindex">
<title>Skedy Admin</title>
<link rel="icon" href="../icon-192.png">
<script src="../config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-css">
/* Skedy Admin: расписание всей школы (неделя класса / учителя / кабинета, обзор параллели). Палитра p2 («лайм») */
:root{--bg:#171717;--card:#101010;--cell:#1C1C1C;--line:rgba(255,255,255,.08);--ink:#F2F2F2;--muted:#A3A3A3;--acc:#C6FF00;--acc-ink:#171717}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
bdi{unicode-bidi:isolate}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:22px;font-weight:700;white-space:nowrap}.brand i{color:var(--acc);font-style:normal}
.brand small{color:var(--muted);font-weight:500;font-size:15px;margin-inline-start:6px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{padding:8px 16px;border-radius:999px;min-height:40px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.langs{margin-inline-start:auto;display:flex;gap:4px}
.langs button{padding:6px 10px;border-radius:10px;color:var(--muted);min-height:40px}.langs button.on{color:var(--acc);font-weight:600}
.app{display:flex;align-items:flex-start;gap:16px;padding:16px}
.side{width:260px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:sticky;top:12px}
.side input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#0D0D0D;border:0;border-bottom:1px solid var(--line);padding:12px 14px;outline:none}
.side input:focus{box-shadow:inset 0 -2px 0 var(--acc)}
.items{max-height:calc(100vh - 150px);overflow:auto}
.items button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);min-height:44px;align-items:center}
.items button:hover{background:#1a1a1a}.items button.on{background:var(--acc);color:var(--acc-ink)}
.items button small{color:var(--muted);font-size:13px;flex:none}.items button.on small{color:var(--acc-ink)}
.items .gh{padding:8px 14px 4px;color:var(--acc);font-size:13px;font-weight:600}
.main{flex:1;min-width:0}
h1{font-size:26px;margin:2px 0 4px}.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table.grid{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
.grid th,.grid td{border:1px solid var(--line);vertical-align:top;padding:0}
.grid thead th{background:#0D0D0D;padding:8px;font-weight:600;font-size:14px;position:sticky;top:0;z-index:1}
.grid th.pn{width:64px;text-align:center;font-weight:600;padding:6px 4px;background:#0D0D0D}
.grid th.pn small{display:block;color:var(--muted);font-weight:400;font-size:11px;line-height:1.3}
.grid.wide{min-width:1100px}.grid.wide th.cn{width:70px}
.cellb{display:block;width:100%;height:100%;min-height:58px;text-align:start;padding:6px 7px;font-size:13px;line-height:1.3}
.cellb:hover{background:#202020}.cellb.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.ls{margin-bottom:5px}.ls:last-child{margin-bottom:0}
.ls b{display:block;font-weight:600;color:var(--ink)}
.ls span{display:block;color:var(--muted)}
.ls .lk{color:var(--acc)}
.ls b .x{display:inline;color:var(--acc);font-weight:500}
.panel{margin:12px 0;background:var(--card);border:1px solid var(--acc);border-radius:18px;padding:12px 14px}
.panel h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{color:var(--muted);font-size:22px;min-width:44px;min-height:40px}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.go{color:var(--acc);text-decoration:underline;text-underline-offset:3px;text-align:start;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);min-height:40px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.note{color:var(--muted);font-size:13px;margin:14px 2px;line-height:1.5}
.state{padding:60px 16px;text-align:center;color:var(--muted)}
@media (max-width:820px){.app{flex-direction:column;align-items:stretch;padding:12px}.main{width:100%}.side{width:100%;position:static}.items{max-height:34vh}.langs{margin-inline-start:0}}
</style>
</head>
<body>
<div id="root"><div class="state">…</div></div>
<script id="app-js">
(function(){
'use strict';
/* ---------- storage helpers ---------- */
function sGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function sSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* ---------- texts ---------- */
var T={
 he:{title:'מערכת שעות',classes:'כיתות',teachers:'מורים',rooms:'חדרים',grade:'שכבה',search:'חיפוש',hrs:'ש׳',
  days:['יום א׳','יום ב׳','יום ג׳','יום ד׳','יום ה׳'],loading:'טוען את המערכת של כל בית הספר…',failed:'לא הצלחנו לטעון. בדקו את האינטרנט ונסו שוב.',
  retry:'לנסות שוב',groups:'קבוצות',pick:'בחרו מהרשימה',lessons:'שיעורים בשבוע',noLessons:'אין שיעורים',
  subject:'מקצוע',teacher:'מורה',room:'חדר',cls:'כיתות',layer:'שכבת ',period:'שיעור',close:'סגירה',
  note:'צפייה בלבד. המערכת הקבועה של כל בית הספר מתוך שח״ף, עודכנה ב־{d}. עריכה – בקרוב.'},
 en:{title:'Timetable',classes:'Classes',teachers:'Teachers',rooms:'Rooms',grade:'Grade',search:'Search',hrs:'h',
  days:['Sun','Mon','Tue','Wed','Thu'],loading:'Loading the whole school timetable…',failed:'Could not load. Check the internet and try again.',
  retry:'Try again',groups:'groups',pick:'Pick from the list',lessons:'lessons a week',noLessons:'No lessons',
  subject:'Subject',teacher:'Teacher',room:'Room',cls:'Classes',layer:'Grade ',period:'Period',close:'Close',
  note:'View only. The regular timetable of the whole school from Shahaf, updated {d}. Editing is coming soon.'},
 ru:{title:'Расписание школы',classes:'Классы',teachers:'Учителя',rooms:'Кабинеты',grade:'Параллель',search:'Поиск',hrs:'ч',
  days:['Вс','Пн','Вт','Ср','Чт'],loading:'Загружаю расписание всей школы…',failed:'Не удалось загрузить. Проверь интернет и попробуй ещё раз.',
  retry:'Ещё раз',groups:'групп',pick:'Выбери в списке',lessons:'уроков в неделю',noLessons:'Уроков нет',
  subject:'Предмет',teacher:'Учитель',room:'Кабинет',cls:'Классы',layer:'Параллель ',period:'Урок',close:'Закрыть',
  note:'Только просмотр. Постоянное расписание всей школы из שח״ף, обновлено {d}. Редактирование — скоро.'}
};
var prefs=sGet('skedyA.prefs')||{};
if(!T[prefs.lang])prefs.lang='he';
if(['class','teacher','room','grade'].indexOf(prefs.mode)<0)prefs.mode='class';
prefs.sel=prefs.sel||{};
function gName(g){return t('layer')+(prefs.lang==='he'?(GL[g]||g):g);}
function t(k){return T[prefs.lang][k]!=null?T[prefs.lang][k]:T.he[k];}
function save(){sSet('skedyA.prefs',prefs);}

/* ---------- data ---------- */
var API=(function(){var u=String(window.SCHEDULE_API||'').trim();return /^(https:\/\/|http:\/\/localhost)/.test(u)?u.replace(/\/+$/,''):'';})();
var DEF_P=[['07:45','08:30'],['08:30','09:15'],['09:35','10:20'],['10:20','11:00'],['11:10','11:55'],['11:55','12:35'],['12:45','13:30'],['13:30','14:10'],['14:15','14:55'],['15:00','15:40'],['15:40','16:20']]
  .map(function(x,i){return {n:i+1,start:x[0],end:x[1]};});
var D={ok:false,failed:false,cls:[],les:[],byC:{},byT:{},byR:{},updated:'',periods:DEF_P,subj:{},skedy:[]};
var ui={q:'',slot:null,gradeDay:0};
var GL={7:'ז׳',8:'ח׳',9:'ט׳',10:'י׳',11:'י״א',12:'י״ב'};
function getJ(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});}
function load(){
  D.failed=false;render();
  getJ('../teacher/classes/index.json').then(function(ix){
    D.cls=ix.classes||[];D.updated=ix.updated||'';
    return Promise.all(D.cls.map(function(c){return getJ('../teacher/classes/'+c.k+'.json').then(function(j){return [c.k,j];});}));
  }).then(function(all){build(all);D.ok=true;render();}).catch(function(){D.failed=true;render();});
  getJ('../teacher/subjects.json').then(function(j){D.subj=j||{};if(D.ok)render();}).catch(function(){});
  if(API)fetch(API+'/data',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.periods&&j.periods.length)D.periods=j.periods;if(j&&j.subjects)D.skedy=j.subjects;if(D.ok)render();}).catch(function(){});
}
// один урок у нескольких классов (тот же день, урок, предмет, кабинет, учитель) — одна запись со списком классов
function build(all){
  var m={};D.les=[];D.byC={};D.byT={};D.byR={};
  all.forEach(function(x){var k=x[0],j=x[1];(j.l||[]).forEach(function(a){
    var s=j.s[a[2]]||'',r=j.r[a[3]]||'',te=j.t[a[4]]||'',key=[a[0],a[1],s,r,te].join('|'),L=m[key];
    if(!L){L=m[key]={d:a[0],p:a[1],s:s,r:r,t:te,c:[]};D.les.push(L);if(te)(D.byT[te]=D.byT[te]||[]).push(L);if(r)(D.byR[r]=D.byR[r]||[]).push(L);}
    L.c.push(k);(D.byC[k]=D.byC[k]||[]).push(L);
  });});
}
function cName(k){for(var i=0;i<D.cls.length;i++)if(D.cls[i].k===k)return D.cls[i].he;return k;}
// «י״א2, י״א5»; больше трёх классов одной параллели — «שכבת י״א»
function audLabel(cs){var by={},out=[];cs.forEach(function(k){var g=k.split('-')[0];(by[g]=by[g]||[]).push(k);});
  Object.keys(by).sort(function(a,b){return a-b;}).forEach(function(g){var l=by[g];
    out.push(l.length>3?gName(g):l.sort(function(a,b){return a.split('-')[1]-b.split('-')[1];}).map(cName).join(', '));});
  return out.join(', ');}
function trS(he){if(!he||prefs.lang==='he')return he;for(var i=0;i<D.skedy.length;i++)if(D.skedy[i].he===he&&D.skedy[i][prefs.lang])return D.skedy[i][prefs.lang];
  return D.subj[he]&&D.subj[he][prefs.lang]||he;}
function slots(list){var s={};(list||[]).forEach(function(L){s[L.d+'|'+L.p]=1;});return Object.keys(s).length;}
function listFor(mode,k){return (mode==='class'?D.byC:mode==='teacher'?D.byT:D.byR)[k]||[];}
function at(list,d,p){return list.filter(function(L){return L.d===d&&L.p===p;});}
function maxP(){var m=0;D.les.forEach(function(L){if(L.p>m)m=L.p;});D.periods.forEach(function(p){if(p.n>m)m=p.n;});return m;}
function per(n){for(var i=0;i<D.periods.length;i++)if(D.periods[i].n===n)return D.periods[i];return null;}

/* ---------- render ---------- */
function header(){
  var h='<div class="top"><div class="brand">sk<i>.</i><small>'+esc(t('title'))+'</small></div><div class="tabs">';
  [['class','classes'],['teacher','teachers'],['room','rooms'],['grade','grade']].forEach(function(x){
    h+='<button class="'+(prefs.mode===x[0]?'on':'')+'" data-act="mode" data-v="'+x[0]+'">'+esc(t(x[1]))+'</button>';});
  h+='</div><div class="langs">';
  [['he','עב'],['en','EN'],['ru','RU']].forEach(function(x){h+='<button class="'+(prefs.lang===x[0]?'on':'')+'" data-act="lang" data-v="'+x[0]+'">'+x[1]+'</button>';});
  return h+'</div></div>';
}
function sideItems(){
  var q=ui.q.trim().toLowerCase(),cur=prefs.sel[prefs.mode],h='',keys;
  var item=function(k,label,n){if(q&&String(label).toLowerCase().indexOf(q)<0)return '';
    return '<button class="'+(k===cur?'on':'')+'" data-act="pick" data-v="'+esc(k)+'"><bdi>'+esc(label)+'</bdi><small>'+n+' '+esc(t('hrs'))+'</small></button>';};
  if(prefs.mode==='class'){var g=null;D.cls.forEach(function(c){var it=item(c.k,c.he,slots(D.byC[c.k]));
    if(it&&c.g!==g){g=c.g;h+='<div class="gh">'+esc(gName(g))+'</div>';}h+=it;});return h;}
  keys=Object.keys(prefs.mode==='teacher'?D.byT:D.byR).sort(function(a,b){return a.localeCompare(b,'he');});
  keys.forEach(function(k){h+=item(k,k,slots(listFor(prefs.mode,k)));});return h;
}
function lessonHtml(L,mode,full){
  var h='<div class="ls"><b>'+esc(trS(L.s))+'</b>';
  if(mode!=='teacher'&&L.t)h+='<span><bdi>'+esc(L.t)+'</bdi></span>';
  if(mode!=='class'||L.c.length>1)h+='<span class="'+(mode==='class'?'lk':'')+'"><bdi>'+esc(audLabel(L.c))+'</bdi></span>';
  if(mode!=='room'&&L.r)h+='<span><bdi>'+esc(L.r)+'</bdi></span>';
  return h+'</div>';
}
// в клетке много групп (мегамот, הקבצות): по строке на предмет (×N — сколько групп) и общее число групп; подробности — по нажатию
function cellHtml(ls,mode){
  if(ls.length<=(mode==='grade'?1:2))return ls.map(function(L){return lessonHtml(L,mode);}).join('');
  var by={},order=[];ls.forEach(function(L){if(!by[L.s]){by[L.s]=0;order.push(L.s);}by[L.s]++;});
  return '<div class="ls">'+order.map(function(s){return '<b>'+esc(trS(s))+(by[s]>1?' <span class="x">×'+by[s]+'</span>':'')+'</b>';}).join('')+
    '<span class="lk">'+ls.length+' '+esc(t('groups'))+'</span></div>';
}
function weekGrid(list,mode){
  var h='<div class="scroll"><table class="grid"><thead><tr><th class="pn"></th>';
  for(var d=0;d<5;d++)h+='<th>'+esc(t('days')[d])+'</th>';
  h+='</tr></thead><tbody>';
  for(var p=1,mp=maxP();p<=mp;p++){var pr=per(p);
    h+='<tr><th class="pn">'+p+(pr?'<small>'+esc(pr.start)+'<br>'+esc(pr.end)+'</small>':'')+'</th>';
    for(d=0;d<5;d++){var ls=at(list,d,p),sel=ui.slot&&ui.slot.d===d&&ui.slot.p===p;
      h+='<td><button class="cellb'+(sel?' sel':'')+'" data-act="slot" data-d="'+d+'" data-p="'+p+'">'+cellHtml(ls,mode)+'</button></td>';}
    h+='</tr>';}
  return h+'</tbody></table></div>';
}
function panel(list,mode){
  if(!ui.slot)return '';var ls=at(list,ui.slot.d,ui.slot.p);if(!ls.length)return '';
  ls=ls.slice().sort(function(a,b){return a.s.localeCompare(b.s,'he')||a.t.localeCompare(b.t,'he');});
  var h='<div class="panel"><h3><span>'+esc(t('days')[ui.slot.d])+' · '+esc(t('period'))+' '+ui.slot.p+'</span><button data-act="unslot" aria-label="'+esc(t('close'))+'">×</button></h3>';
  h+='<div class="row muted"><b>'+esc(t('subject'))+'</b><b>'+esc(t('teacher'))+'</b><b>'+esc(t('room'))+'</b><b>'+esc(t('cls'))+'</b></div>';
  ls.forEach(function(L){
    h+='<div class="row"><span>'+esc(trS(L.s))+'</span>'+
      '<span>'+(L.t?'<button class="go" data-act="jump" data-m="teacher" data-v="'+esc(L.t)+'"><bdi>'+esc(L.t)+'</bdi></button>':'')+'</span>'+
      '<span>'+(L.r?'<button class="go" data-act="jump" data-m="room" data-v="'+esc(L.r)+'"><bdi>'+esc(L.r)+'</bdi></button>':'')+'</span><span>'+
      L.c.slice().sort(function(a,b){return a.split('-')[0]-b.split('-')[0]||a.split('-')[1]-b.split('-')[1];}).map(function(k){return '<button class="go" data-act="jump" data-m="class" data-v="'+esc(k)+'"><bdi>'+esc(cName(k))+'</bdi></button>';}).join(', ')+'</span></div>';});
  return h+'</div>';
}
function gradeView(){
  var g=prefs.sel.grade||10,h='<div class="chips">';
  Object.keys(GL).forEach(function(x){h+='<button class="'+(+x===+g?'on':'')+'" data-act="pick" data-v="'+x+'">'+esc(prefs.lang==='he'?GL[x]:x)+'</button>';});
  h+='</div><div class="chips">';
  for(var d=0;d<5;d++)h+='<button class="'+(d===ui.gradeDay?'on':'')+'" data-act="gday" data-v="'+d+'">'+esc(t('days')[d])+'</button>';
  h+='</div><div class="scroll"><table class="grid wide"><thead><tr><th class="pn cn"></th>';
  var mp=maxP();
  for(var p=1;p<=mp;p++){var pr=per(p);h+='<th class="pn">'+p+(pr?'<small>'+esc(pr.start)+'</small>':'')+'</th>';}
  h+='</tr></thead><tbody>';
  D.cls.filter(function(c){return +c.g===+g;}).forEach(function(c){
    h+='<tr><th class="pn"><button class="go" data-act="jump" data-m="class" data-v="'+esc(c.k)+'"><bdi>'+esc(c.he)+'</bdi></button></th>';
    for(p=1;p<=mp;p++){var ls=at(D.byC[c.k]||[],ui.gradeDay,p);
      h+='<td><button class="cellb" data-act="gcell" data-k="'+esc(c.k)+'" data-p="'+p+'">'+cellHtml(ls,'grade')+'</button></td>';}
    h+='</tr>';});
  return h+'</tbody></table></div>';
}
function mainHtml(){
  if(prefs.mode==='grade')return '<h1>'+esc(t('layer')+GL[prefs.sel.grade||10])+'</h1><p class="sub">'+esc(t('days')[ui.gradeDay])+'</p>'+gradeView();
  var k=prefs.sel[prefs.mode],list=listFor(prefs.mode,k);
  if(!k||!list.length)return '<div class="state">'+esc(k?t('noLessons'):t('pick'))+'</div>';
  var title=prefs.mode==='class'?cName(k):k;
  return '<h1><bdi>'+esc(title)+'</bdi></h1><p class="sub">'+slots(list)+' '+esc(t('lessons'))+'</p>'+panel(list,prefs.mode)+weekGrid(list,prefs.mode);
}
function render(){
  var html=document.documentElement;html.lang=prefs.lang;html.dir=prefs.lang==='he'?'rtl':'ltr';
  document.title='Skedy Admin · '+t('title');
  var h=header();
  if(!D.ok)h+='<div class="state">'+esc(D.failed?t('failed'):t('loading'))+(D.failed?'<p><button class="go" data-act="retry">'+esc(t('retry'))+'</button></p>':'')+'</div>';
  else{
    h+='<div class="app">';
    if(prefs.mode!=='grade')h+='<div class="side"><input id="q" type="search" placeholder="'+esc(t('search'))+'" value="'+esc(ui.q)+'" autocomplete="off"><div class="items">'+sideItems()+'</div></div>';
    h+='<div class="main">'+mainHtml()+'<p class="note">'+esc(t('note').replace('{d}',D.updated))+'</p></div></div>';
  }
  document.getElementById('root').innerHTML=h;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var v=b.getAttribute('data-v');
  switch(b.getAttribute('data-act')){
    case 'mode':prefs.mode=v;ui.slot=null;ui.q='';break;
    case 'lang':prefs.lang=v;break;
    case 'pick':prefs.sel[prefs.mode]=prefs.mode==='grade'?+v:v;ui.slot=null;break;
    case 'jump':prefs.mode=b.getAttribute('data-m');prefs.sel[prefs.mode]=v;ui.q='';
      if(!ui.slot)ui.slot=null;window.scrollTo(0,0);break;
    case 'slot':var d=+b.getAttribute('data-d'),p=+b.getAttribute('data-p');
      ui.slot=ui.slot&&ui.slot.d===d&&ui.slot.p===p?null:{d:d,p:p};break;
    case 'unslot':ui.slot=null;break;
    case 'gday':ui.gradeDay=+v;break;
    case 'gcell':prefs.mode='class';prefs.sel.class=b.getAttribute('data-k');ui.slot={d:ui.gradeDay,p:+b.getAttribute('data-p')};ui.q='';window.scrollTo(0,0);break;
    case 'retry':load();return;
    default:return;
  }
  save();render();
});
document.addEventListener('input',function(e){
  if(e.target.id!=='q')return;ui.q=e.target.value;
  var it=document.querySelector('.items');if(it)it.innerHTML=sideItems();
});

/* ---------- start ---------- */
var wd=new Date().getDay();ui.gradeDay=wd<5?wd:0;
load();
})();
</script>
</body>
