<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style id="app-css">
/* Skedy Admin: расписание всей школы (неделя класса / учителя / кабинета, обзор параллели). Палитра p2 («лайм») */
:root{--bg:#171717;--card:#101010;--cell:#1C1C1C;--line:rgba(255,255,255,.08);--ink:#F2F2F2;--muted:#A3A3A3;--acc:#C6FF00;--acc-ink:#171717}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
bdi{unicode-bidi:isolate}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:22px;font-weight:700;white-space:nowrap}.brand i{color:var(--acc);font-style:normal}
.brand small{color:var(--muted);font-weight:500;font-size:15px;margin-inline-start:6px}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{padding:8px 16px;border-radius:999px;min-height:40px;color:var(--muted);font-weight:500}
.tabs button.on{background:var(--acc);color:var(--acc-ink)}
.langs{margin-inline-start:auto;display:flex;gap:4px}
.langs button{padding:6px 10px;border-radius:10px;color:var(--muted);min-height:40px}.langs button.on{color:var(--acc);font-weight:600}
.app{display:flex;align-items:flex-start;gap:16px;padding:16px}
.side{width:260px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:sticky;top:12px}
.side input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#0D0D0D;border:0;border-bottom:1px solid var(--line);padding:12px 14px;outline:none}
.side input:focus{box-shadow:inset 0 -2px 0 var(--acc)}
.items{max-height:calc(100vh - 150px);overflow:auto}
.items button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:start;padding:10px 14px;border-bottom:1px solid var(--line);min-height:44px;align-items:center}
.items button:hover{background:#1a1a1a}.items button.on{background:var(--acc);color:var(--acc-ink)}
.items button small{color:var(--muted);font-size:13px;flex:none}.items button.on small{color:var(--acc-ink)}
.items .gh{padding:8px 14px 4px;color:var(--acc);font-size:13px;font-weight:600}
.main{flex:1;min-width:0}
h1{font-size:26px;margin:2px 0 4px}.sub{color:var(--muted);margin:0 0 12px;font-size:14px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table.grid{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
.grid th,.grid td{border:1px solid var(--line);vertical-align:top;padding:0}
.grid thead th{background:#0D0D0D;padding:8px;font-weight:600;font-size:14px;position:sticky;top:0;z-index:1}
.grid th.pn{width:64px;text-align:center;font-weight:600;padding:6px 4px;background:#0D0D0D}
.grid th.pn small{display:block;color:var(--muted);font-weight:400;font-size:11px;line-height:1.3}
.grid.wide{min-width:1100px}.grid.wide th.cn{width:70px}
.cellb{display:block;width:100%;height:100%;min-height:58px;text-align:start;padding:6px 7px;font-size:13px;line-height:1.3;cursor:pointer;outline:none}
.cellb:focus-visible{box-shadow:inset 0 0 0 2px var(--acc)}
.ls[draggable=true]{cursor:grab;border-radius:6px}.ls[draggable=true]:hover{background:#2a2a2a}
.cellb.drop{background:#22300a;box-shadow:inset 0 0 0 2px var(--acc)}
.ls.dragging{opacity:.4}
.cellb:hover{background:#202020}.cellb.sel{box-shadow:inset 0 0 0 2px var(--acc)}
.ls{margin-bottom:5px}.ls:last-child{margin-bottom:0}
.ls b{display:block;font-weight:600;color:var(--ink)}
.ls span{display:block;color:var(--muted)}
.ls .lk{color:var(--acc)}
.ls b .x{display:inline;color:var(--acc);font-weight:500}
.panel{margin:12px 0;background:var(--card);border:1px solid var(--acc);border-radius:18px;padding:12px 14px}
.panel h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.panel h3 button{color:var(--muted);font-size:22px;min-width:44px;min-height:40px}
.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.row:first-of-type{border-top:0}
.go{color:var(--acc);text-decoration:underline;text-underline-offset:3px;text-align:start;padding:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chips button{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);min-height:40px}
.chips button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.note{color:var(--muted);font-size:13px;margin:14px 2px;line-height:1.5}
.state{padding:60px 16px;text-align:center;color:var(--muted)}
:root{--bad:#FF5A5F}
.htab{width:100%;border-collapse:collapse;min-width:700px}
.htab th,.htab td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:start;font-size:14px;vertical-align:top}
.htab th{color:var(--muted);font-weight:500;white-space:nowrap;position:sticky;top:0;background:#0D0D0D}
.htab th button{color:inherit;font:inherit;min-height:32px}.htab th button.on{color:var(--acc);font-weight:600}
.htab td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.htab td.sj{color:var(--muted);font-size:13px;line-height:1.5}
.htab tr.hr{cursor:pointer}.htab tr.hr:hover td{background:#1a1a1a}
.htab .w{color:var(--bad);font-weight:600}
.hist .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.hist .row2 b{min-width:180px}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px;padding:10px 12px;border:1px dashed var(--line);border-radius:14px}
.bulk b{margin-inline-end:4px}.bulk .inp{width:auto}.bulk .sub{margin:0;width:100%}
.mtext{width:100%;min-height:80px;resize:vertical;font:inherit;font-size:15px;color:var(--ink);background:#0D0D0D;border:1px solid var(--line);border-radius:12px;padding:10px;outline:none}
.mtext:focus{border-color:var(--acc)}
.offrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px}
.offrow .when{font-weight:600;min-width:150px}.offrow .who{color:var(--muted);font-size:14px}
.offform{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:center;margin:0 0 16px;padding:12px;border:1px dashed var(--line);border-radius:14px}
.offform .full{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.offform .chips{margin:0}
.grid thead th .off{display:block;color:var(--bad);font-size:11px;font-weight:600}
@media (max-width:820px){.offform{grid-template-columns:1fr}}
.ai .act{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ai .act input{width:22px;height:22px;margin-top:2px;accent-color:var(--acc);flex:none}
.ai .act .d{flex:1}.ai .act .n{color:var(--muted);font-size:13px}.ai .act .n.w{color:var(--bad)}
.ai .say{background:#0D0D0D;border-radius:12px;padding:10px 12px;margin:10px 0;line-height:1.5}
.ai .ex{color:var(--muted);font-size:13px;line-height:1.6}
.tday{margin:16px 2px 6px;font-weight:600;color:var(--acc)}
.trow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:start;min-height:48px}
.trow:hover{border-color:var(--acc)}
.trow .pn{color:var(--muted);font-size:13px;min-width:62px}
.trow .mt{color:var(--muted);font-size:14px}
.trow .src{margin-inline-start:auto;color:var(--muted);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:1px 6px}
.wbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.wbar .lbl{color:var(--muted);font-size:14px;padding:0 6px}
.ls.cx b,.ls.cx span{text-decoration:line-through;opacity:.55}
.ls .tag,.tag{display:inline-block;border-radius:8px;padding:1px 7px;font-size:12px;font-weight:600;margin-top:2px;text-decoration:none!important;opacity:1!important}
.tag.cancel{background:var(--bad);color:#fff}.tag.room{background:#2b3a00;color:var(--acc)}.tag.test{background:var(--acc);color:var(--acc-ink)}
.grid thead th small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.crow{padding:10px 0;border-top:1px solid var(--line)}
.crow .what{font-size:15px;margin-bottom:6px}
.crow .btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crow .btns .on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.crow .inp{width:auto;flex:1;min-width:140px}
.cellb.bad{box-shadow:inset 0 0 0 2px var(--bad)}.cellb.bad.sel{box-shadow:inset 0 0 0 2px var(--acc),inset 0 0 0 4px var(--bad)}
.tabs .n{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}
.warn{border:1px solid var(--bad);border-radius:14px;padding:8px 12px;margin:0 0 10px;color:var(--ink);font-size:14px}
.warn b{color:var(--bad)}
.iss{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.iss.bad{border-color:var(--bad)}
.iss h3{margin:0 0 6px;font-size:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.iss h3 .k{color:var(--bad);font-size:14px;font-weight:600}
.iss .li{color:var(--muted);font-size:14px;padding:3px 0}
.iss .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
details.ign summary{cursor:pointer;color:var(--muted);padding:10px 2px;min-height:44px}
.ebtn{padding:8px 16px;border-radius:999px;border:1px solid var(--line);min-height:40px;white-space:nowrap}
.ebtn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.ebtn:disabled{opacity:.45;cursor:default}
.ebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#0D0D0D;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.ebar .msg{color:var(--muted);font-size:14px}.ebar .msg.bad{color:#FF5A5F}.ebar .msg.ok{color:var(--acc)}
.ebar .dirty{color:var(--acc);font-weight:600;font-size:14px}
.inp{font:inherit;font-size:15px;color:var(--ink);background:#0D0D0D;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%;outline:none}
.inp:focus{border-color:var(--acc)}
.ebar .inp{width:200px}
.erow{display:grid;grid-template-columns:110px 80px 1.4fr 1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.erow .cl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:#262626;border-radius:999px;padding:4px 6px 4px 10px;font-size:14px;min-height:34px}
.chip button{color:var(--muted);font-size:17px;min-width:28px;min-height:28px}
.chip button:disabled{opacity:.3}
.erow select.add{width:auto}
.erow .del{margin-inline-start:auto;color:#FF5A5F;border-color:rgba(255,90,95,.4)}
.elbl{display:grid;grid-template-columns:110px 80px 1.4fr 1fr 1fr;gap:6px;color:var(--muted);font-size:13px;padding-bottom:4px}
@media (max-width:820px){.erow,.elbl{grid-template-columns:1fr 1fr}.elbl{display:none}}
@media (max-width:820px){.app{flex-direction:column;align-items:stretch;padding:12px}.main{width:100%}.side{width:100%;position:static}.items{max-height:34vh}.langs{margin-inline-start:0}}
</style>
</head>

function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(x){var a=x.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(x,n){var d=parseD(x);d.setDate(d.getDate()+n);return iso(d);}
// воскресенье недели; в пятницу и субботу — уже следующая неделя
function weekOf(d){var w=d.getDay(),x=iso(d);return addDays(x,w>=5?7-w:-w);}

function bulkLessons(){var m=prefs.mode,k=prefs.sel[m];
  if(m==='teacher')return D.byT[k]||[];
  var keys=m==='class'?[k]:D.cls.filter(function(c){return +c.g===+(prefs.sel.grade||10);}).map(function(c){return c.k;});
  var set={},out=[];keys.forEach(function(x){set[x]=1;});
  D.les.forEach(function(L){if(L.c.length&&L.c.every(function(x){return set[x];}))out.push(L);});return out;}

    '<button class="ebtn pri" data-act="bulk" data-v="cancel">'+esc(t('doCancel'))+'</button><button class="ebtn" data-act="bulk" data-v="">'+esc(t('undoCancel'))+'</button>'+

// Сервер возвращает вызовы инструментов (cancel_lessons, room_change, add_test, clear_changes, move_lesson,
// add_day_off, message_teachers). Здесь они превращаются в уроки и изменения; в черновик — только отмеченные.
function aiCtx(){var subs={};D.les.forEach(function(L){if(L.s)subs[L.s]=1;});
  var srt=function(a){return a.sort(function(x,y){return x.localeCompare(y,'he');});};
  return {teachers:srt(Object.keys(D.byT)),classes:D.cls.map(function(c){return c.he;}),rooms:srt(Object.keys(D.byR).filter(function(r){return !SKIPR.test(r);})),
    subjects:srt(Object.keys(subs)),periods:D.periods.map(function(p){return p.n+' '+p.start+'-'+p.end;})};}
function aiWho(x){var w=String(x.who||'').trim();
  if(x.who_type==='teacher'){var k=nrmT(w),hit=null;Object.keys(D.byT).forEach(function(n){if(!hit&&nrmT(n)===k)hit=n;});return hit?{t:'teacher',k:hit,label:hit}:null;}
  if(x.who_type==='grade'){var g=+w.replace(/\D/g,'')||({'ז':7,'ח':8,'ט':9,'י':10,'יא':11,'יב':12})[w.replace(/[^א-ת]/g,'')];return g>=7&&g<=12?{t:'grade',k:g,label:gName(g)}:null;}
  var n=w.replace(/[\s׳״'"-]/g,''),c=null;D.cls.forEach(function(x2){if(!c&&(x2.he.replace(/[\s׳״'"-]/g,'')===n||x2.k===w))c=x2;});return c?{t:'class',k:c.k,label:c.he}:null;}
function aiLessons(W){if(W.t==='teacher')return D.byT[W.k]||[];
  var keys=W.t==='class'?[W.k]:D.cls.filter(function(c){return +c.g===W.k;}).map(function(c){return c.k;}),set={};keys.forEach(function(k){set[k]=1;});
  return D.les.filter(function(L){return L.c.length&&L.c.every(function(k){return set[k];});});}
function aiDay(date){return isoDay(date);}
function isoDay(date){return /^\d{4}-\d{2}-\d{2}$/.test(date||'')?parseD(date).getDay():-1;}
function aiSubj(L,s){if(!s)return true;var a=nrmT(s),b=nrmT(L.s);return b.indexOf(a)>=0||a.indexOf(b)>=0;}
function chOf(L,date){for(var i=0;i<D.ch.length;i++)if(chMatch(D.ch[i],L,date))return D.ch[i];return null;}
function chPut(L,date,type,room,note){var old=chOf(L,date);D.ch=D.ch.filter(function(c){return c!==old;});
  if(type){var c={id:old?old.id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:date,p:L.p,s:L.s,t:L.t,c:L.c.slice(),type:type};
    if(room)c.room=room;if(note)c.note=note;D.ch.push(c);}}
// одно предложение: описание, уроки, которых оно коснётся, и как его применить
// бесплатная модель бывает неаккуратной: числа строкой, нет полей — приводим к нужному виду
function aiNorm(x){var o={},num=function(v){var n=parseInt(v,10);return isNaN(n)?null:n;},str=function(v){return v==null?null:String(v).trim()||null;};
  Object.keys(x||{}).forEach(function(k){o[k]=x[k];});
  ['from_period','to_period','period','from_day','to_day'].forEach(function(k){if(k in o)o[k]=num(o[k]);});
  if(o.period!=null&&o.from_period==null)o.from_period=o.period;if(o.from_period!=null&&o.to_period==null)o.to_period=o.from_period;
  ['note','subject','to','room','text','who','date'].forEach(function(k){if(k in o)o[k]=str(o[k]);});
  o.grades=(Array.isArray(o.grades)?o.grades:[]).map(num).filter(function(g){return g>=7&&g<=12;});
  if(o.who_type)o.who_type=String(o.who_type).toLowerCase();return o;}
function aiPlan(a){var x=aiNorm(a.input),W=x.who!=null?aiWho(x):null,ls=[],d,lo,hi,desc='',kind='',apply=null;
  var when=function(){return esc(t('days')[aiDay(x.date)]||'')+' '+esc(fmtD(x.date||''));};
  var range=function(){lo=Math.min(x.from_period,x.to_period);hi=Math.max(x.from_period,x.to_period);return esc(t('period'))+' '+(lo===hi?lo:lo+'–'+hi);};
  if(a.name==='cancel_lessons'||a.name==='clear_changes'||a.name==='add_test'){d=aiDay(x.date);range();
    ls=W&&d>=0&&d<5?aiLessons(W).filter(function(L){return L.d===d&&L.p>=lo&&L.p<=hi&&(a.name!=='add_test'||aiSubj(L,x.subject));}):[];
    kind=a.name==='cancel_lessons'?'aCancel':a.name==='add_test'?'aTest':'aClear';
    desc=when()+' · '+range()+(x.subject?' · '+esc(x.subject):'')+(x.note?' · '+esc(x.note):'');
    apply=function(){ls.forEach(function(L){chPut(L,x.date,a.name==='cancel_lessons'?'cancel':a.name==='add_test'?'test':'',null,x.note);});chDraft();};}
  else if(a.name==='room_change'){d=aiDay(x.date);ls=W&&d>=0&&d<5?aiLessons(W).filter(function(L){return L.d===d&&L.p===x.period;}):[];kind='aRoom';
    desc=when()+' · '+esc(t('period'))+' '+x.period+' · → <bdi>'+esc(x.room)+'</bdi>'+(x.note?' · '+esc(x.note):'');
    apply=function(){ls.forEach(function(L){chPut(L,x.date,'room',x.room,x.note);});chDraft();};}
  else if(a.name==='move_lesson'){ls=W?aiLessons(W).filter(function(L){return L.d===x.from_day&&L.p===x.from_period&&aiSubj(L,x.subject);}):[];kind='aMove';
    desc=esc(t('days')[x.from_day]||'?')+' '+esc(t('period'))+' '+x.from_period+' → '+esc(t('days')[x.to_day]||'?')+' '+esc(t('period'))+' '+x.to_period+(x.subject?' · '+esc(x.subject):'');
    if(!(x.to_day>=0&&x.to_day<5&&x.to_period>=1))ls=[];
    apply=function(){ls.forEach(function(L){L.d=x.to_day;L.p=x.to_period;});reindex();saveDraft();};}
  else if(a.name==='add_day_off'){kind='aOff';var gs=(x.grades||[]).filter(function(g){return g>=7&&g<=12;});ls=null;
    desc=when()+(x.to&&x.to>x.date?' – '+esc(fmtD(x.to)):'')+' · <bdi>'+esc(x.text)+'</bdi> · '+esc(gs.length?gs.map(gName).join(', '):t('offAll'));
    apply=isoDay(x.date)<0||!x.text?null:function(){D.off.push({id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:x.date,to:x.to&&x.to>x.date?x.to:undefined,text:x.text,g:gs});chDraft();};}
  else if(a.name==='message_teachers'){kind='aMsg';ls=null;desc='<bdi>'+esc(x.text)+'</bdi>';
    apply=function(){ui.msgs={list:null,text:String(x.text||'').slice(0,300)};getJ(API+'/tmsg').then(function(j){if(ui.msgs){ui.msgs.list=j.msgs||[];render();}},function(){});};}
  if(a.name!=='message_teachers'&&a.name!=='move_lesson'&&a.name!=='add_day_off'&&!D.chOk)apply=null;
  if(ls&&!ls.length)apply=null;
  return {kind:kind,who:W?W.label:(x.who||''),desc:desc,n:ls?ls.length:null,apply:apply,on:!!apply};}
function aiView(){var A=ui.ai,h='<div class="panel hist ai"><h3><span>🤖 '+esc(t('aiBtn'))+'</span><button data-act="aiOff" aria-label="'+esc(t('close'))+'">×</button></h3><p class="sub">'+esc(t('aiNote'))+'</p>'+

function saveTT(){

  ui.busy=true;msg('saving');render();
  fetch(API+'/tt',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Code':encodeURIComponent(ED.code)},
    body:JSON.stringify({tt:ttForSave(),base:D.base})}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(j){
      ui.busy=false;
      if(r.ok&&j.updatedAt){D.base=j.updatedAt;D.updated=j.updatedAt.slice(0,10);D.src='sk';D.dirty=0;sDel('skedyA.draft');msg('saved','ok');}

  var q=ui.q.trim().toLowerCase(),cur=prefs.sel[prefs.mode],h='',keys;
  var item=function(k,label,n){if(q&&String(label).toLowerCase().indexOf(q)<0)return '';
    return '<button class="'+(k===cur?'on':'')+'" data-act="pick" data-v="'+esc(k)+'"><bdi>'+esc(label)+'</bdi><small>'+n+' '+esc(t('hrs'))+'</small></button>';};
  if(prefs.mode==='class'){var g=null;D.cls.forEach(function(c){var it=item(c.k,c.he,slots(D.byC[c.k]));
    if(it&&c.g!==g){g=c.g;h+='<div class="gh">'+esc(gName(g))+'</div>';}h+=it;});return h;}
  keys=Object.keys(prefs.mode==='teacher'?D.byT:D.byR).sort(function(a,b){return a.localeCompare(b,'he');});
  keys.forEach(function(k){h+=item(k,k,slots(listFor(prefs.mode,k)));});return h;
}
function lessonHtml(L,mode,full){
  var c=chFor(L),h='<div class="ls'+(c&&c.type==='cancel'?' cx':'')+'"'+dragAttr([L])+'><b>'+esc(trS(L.s))+'</b>';
  if(mode!=='teacher'&&L.t)h+='<span><bdi>'+esc(L.t)+'</bdi></span>';
  if(mode!=='class'||L.c.length>1)h+='<span class="'+(mode==='class'?'lk':'')+'"><bdi>'+esc(audLabel(L.c))+'</bdi></span>';
  if(mode!=='room'&&L.r)h+='<span><bdi>'+esc(L.r)+'</bdi></span>';
  if(c)h+=chTag(c);
  return h+'</div>';
}
// в клетке много групп (мегамот, הקבצות): по строке на предмет (×N — сколько групп) и общее число групп; подробности — по нажатию
function cellHtml(ls,mode){
  if(ls.length<=(mode==='grade'?1:2))return ls.map(function(L){return lessonHtml(L,mode);}).join('');
  var by={},order=[];ls.forEach(function(L){if(!by[L.s]){by[L.s]=0;order.push(L.s);}by[L.s]++;});
  var nc=ls.filter(function(L){return chFor(L);}).length;
  return '<div class="ls"'+dragAttr(ls)+'>'+order.map(function(s){return '<b>'+esc(trS(s))+(by[s]>1?' <span class="x">×'+by[s]+'</span>':'')+'</b>';}).join('')+
    '<span class="lk">'+ls.length+' '+esc(t('groups'))+'</span>'+(nc?'<span class="tag room">'+esc(t('groupsCh').replace('{n}',nc))+'</span>':'')+'</div>';
}
function weekGrid(list,mode){
  var h='<div class="scroll"><table class="grid"><thead><tr><th class="pn"></th>';
  for(var d=0;d<5;d++)h+='<th>'+esc(t('days')[d])+(ui.week?'<small>'+esc(fmtD(dateOf(d)))+'</small>'+offHead(dateOf(d)):'')+'</th>';
  h+='</tr></thead><tbody>';
  for(var p=1,mp=maxP();p<=mp;p++){var pr=per(p);
    h+='<tr><th class="pn">'+p+(pr?'<small>'+esc(pr.start)+'<br>'+esc(pr.end)+'</small>':'')+'</th>';
    for(d=0;d<5;d++){var ls=at(list,d,p),sel=ui.slot&&ui.slot.d===d&&ui.slot.p===p;
      h+='<td><div class="cellb'+(sel?' sel':'')+(lsBad(ls)?' bad':'')+'" role="button" tabindex="0" data-act="slot" data-d="'+d+'" data-p="'+p+'">'+cellHtml(ls,mode)+'</div></td>';}
    h+='</tr>';}
  return h+'</tbody></table></div>';
}
function opts(n,cur,lab){var h='';for(var i=0;i<n.length;i++)h+='<option value="'+esc(n[i][0])+'"'+(n[i][0]===cur?' selected':'')+'>'+esc(n[i][1])+'</option>';return h;}
function dl(id,o){var h='<datalist id="'+id+'">';Object.keys(o).sort(function(a,b){return a.localeCompare(b,'he');}).forEach(function(k){h+='<option value="'+esc(k)+'">';});return h+'</datalist>';}
// правка урока: день, урок, предмет, учитель, кабинет и классы; меняется сразу, на сервер — по «Сохранить»
function editPanel(list,mode){
  var ls=at(list,ui.slot.d,ui.slot.p).slice().sort(function(a,b){return a.s.localeCompare(b.s,'he')||a.t.localeCompare(b.t,'he');});
  var days=[],ps=[],subs={},cls=D.cls.map(function(c){return [c.k,c.he];});
  for(var d=0;d<5;d++)days.push([String(d),t('days')[d]]);
  for(var p=1,mp=Math.max(maxP(),11);p<=mp;p++)ps.push([String(p),String(p)]);
  D.les.forEach(function(L){if(L.s)subs[L.s]=1;});
  var h='<div class="panel"><h3><span>'+esc(t('days')[ui.slot.d])+' · '+esc(t('period'))+' '+ui.slot.p+'</span><button data-act="unslot" aria-label="'+esc(t('close'))+'">×</button></h3>'+
    slotWarn(list)+dl('dlS',subs)+dl('dlT',D.byT)+dl('dlR',D.byR)+
    '<div class="elbl"><span>'+esc(t('day'))+'</span><span>'+esc(t('period'))+'</span><span>'+esc(t('subject'))+'</span><span>'+esc(t('teacher'))+'</span><span>'+esc(t('room'))+'</span></div>';
  ls.forEach(function(L){var id=L.id;
    h+='<div class="erow" data-id="'+id+'"><select class="inp" data-f="d">'+opts(days,String(L.d))+'</select><select class="inp" data-f="p">'+opts(ps,String(L.p))+'</select>'+
      '<input class="inp" data-f="s" list="dlS" value="'+esc(L.s)+'" placeholder="'+esc(t('subject'))+'"><input class="inp" data-f="t" list="dlT" value="'+esc(L.t)+'" placeholder="'+esc(t('teacher'))+'">'+
      '<input class="inp" data-f="r" list="dlR" value="'+esc(L.r)+'" placeholder="'+esc(t('room'))+'"><div class="cl">';
    L.c.forEach(function(k){h+='<span class="chip"><bdi>'+esc(cName(k))+'</bdi><button data-act="rmc" data-id="'+id+'" data-v="'+esc(k)+'"'+(L.c.length<2&&prefs.mode==='class'?' disabled':'')+' aria-label="×">×</button></span>';});
    h+='<select class="inp add" data-f="addc"><option value="">'+esc(t('addCls'))+'</option>'+opts(cls.filter(function(c){return L.c.indexOf(c[0])<0;}),'')+'</select>'+
      '<button class="ebtn del" data-act="del" data-id="'+id+'">'+esc(t('del'))+'</button></div></div>';});
  return h+'<div style="padding-top:10px"><button class="ebtn pri" data-act="add">'+esc(t('addLesson'))+'</button></div></div>';
}
function panel(list,mode){
  if(!ui.slot)return '';if(ui.week)return chPanel(list);if(ED.code)return editPanel(list,mode);var ls=at(list,ui.slot.d,ui.slot.p);if(!ls.length)return '';
  ls=ls.slice().sort(function(a,b){return a.s.localeCompare(b.s,'he')||a.t.localeCompare(b.t,'he');});
  var h='<div class="panel"><h3><span>'+esc(t('days')[ui.slot.d])+' · '+esc(t('period'))+' '+ui.slot.p+'</span><button data-act="unslot" aria-label="'+esc(t('close'))+'">×</button></h3>';
  h+=slotWarn(list);
  h+='<div class="row muted"><b>'+esc(t('subject'))+'</b><b>'+esc(t('teacher'))+'</b><b>'+esc(t('room'))+'</b><b>'+esc(t('cls'))+'</b></div>';
  ls.forEach(function(L){
    h+='<div class="row"><span>'+esc(trS(L.s))+'</span>'+
      '<span>'+(L.t?'<button class="go" data-act="jump" data-m="teacher" data-v="'+esc(L.t)+'"><bdi>'+esc(L.t)+'</bdi></button>':'')+'</span>'+
      '<span>'+(L.r?'<button class="go" data-act="jump" data-m="room" data-v="'+esc(L.r)+'"><bdi>'+esc(L.r)+'</bdi></button>':'')+'</span><span>'+
      L.c.slice().sort(function(a,b){return a.split('-')[0]-b.split('-')[0]||a.split('-')[1]-b.split('-')[1];}).map(function(k){return '<button class="go" data-act="jump" data-m="class" data-v="'+esc(k)+'"><bdi>'+esc(cName(k))+'</bdi></button>';}).join(', ')+'</span></div>';});
  return h+'</div>';
}
function gradeView(){
  var g=prefs.sel.grade||10,h='<div class="chips">';
  Object.keys(GL).forEach(function(x){h+='<button class="'+(+x===+g?'on':'')+'" data-act="pick" data-v="'+x+'">'+esc(prefs.lang==='he'?GL[x]:x)+'</button>';});
  h+='</div><div class="chips">';
  for(var d=0;d<5;d++)h+='<button class="'+(d===ui.gradeDay?'on':'')+'" data-act="gday" data-v="'+d+'">'+esc(t('days')[d])+'</button>';
  h+='</div><div class="scroll"><table class="grid wide"><thead><tr><th class="pn cn"></th>';
  var mp=maxP();
  for(var p=1;p<=mp;p++){var pr=per(p);h+='<th class="pn">'+p+(pr?'<small>'+esc(pr.start)+'</small>':'')+'</th>';}
  h+='</tr></thead><tbody>';
  D.cls.filter(function(c){return +c.g===+g;}).forEach(function(c){
    h+='<tr><th class="pn"><button class="go" data-act="jump" data-m="class" data-v="'+esc(c.k)+'"><bdi>'+esc(c.he)+'</bdi></button></th>';
    for(p=1;p<=mp;p++){var ls=at(D.byC[c.k]||[],ui.gradeDay,p);
      h+='<td><div class="cellb'+(lsBad(ls)?' bad':'')+'" role="button" tabindex="0" data-act="gcell" data-d="'+ui.gradeDay+'" data-k="'+esc(c.k)+'" data-p="'+p+'">'+cellHtml(ls,'grade')+'</div></td>';}
    h+='</tr>';});
  return h+'</tbody></table></div>';
}
function mainHtml(){
  if(prefs.mode==='issues')return issuesView();
  if(prefs.mode==='tests')return testsView();
  if(prefs.mode==='hours')return hoursView();
  if(prefs.mode==='off')return offView();
  if(prefs.mode==='grade')return '<h1>'+esc(gName(prefs.sel.grade||10))+'</h1><p class="sub">'+esc(t('days')[ui.gradeDay])+(ui.week?' '+esc(fmtD(dateOf(ui.gradeDay))):'')+'</p>'+weekBar()+bulkBar()+bulkNote()+gradeView();
  var k=prefs.sel[prefs.mode],list=listFor(prefs.mode,k);
  if(!k||(!list.length&&!ED.code))return '<div class="state">'+esc(k?t('noLessons'):t('pick'))+'</div>';
  var title=prefs.mode==='class'?cName(k):k;
  return '<h1><bdi>'+esc(title)+'</bdi></h1><p class="sub">'+slots(list)+' '+esc(t('lessons'))+'</p>'+weekBar()+bulkBar()+bulkNote()+panel(list,prefs.mode)+weekGrid(list,prefs.mode);
}
function render(){
  var html=document.documentElement;html.lang=prefs.lang;html.dir=prefs.lang==='he'?'rtl':'ltr';
  document.title='Skedy Admin · '+t('title');
  var h=header();
  if(!D.ok)h+='<div class="state">'+esc(D.failed?t('failed'):t('loading'))+(D.failed?'<p><button class="go" data-act="retry">'+esc(t('retry'))+'</button></p>':'')+'</div>';
  else{
    h+='<div class="app">';
    if(['grade','issues','tests','hours','off'].indexOf(prefs.mode)<0)h+='<div class="side"><input id="q" type="search" placeholder="'+esc(t('search'))+'" value="'+esc(ui.q)+'" autocomplete="off"><div class="items">'+sideItems()+'</div></div>';
    h+='<div class="main">'+(ui.ai&&ED.code?aiView():'')+(ui.hist&&ED.code?histView():'')+(ui.msgs&&ED.code?msgsView():'')+mainHtml()+'<p class="note">'+esc(t('note').replace('{d}',D.updated).replace('{src}',t(D.src==='sk'?'srcSk':'srcSh')))+
      (ED.code||D.src==='sk'?'<br>'+esc(t('notLive')):'')+'</p></div></div>';
  }
  document.getElementById('root').innerHTML=h;
  var ci=document.getElementById('code');if(ci&&ui.login)ci.focus();
  if(ui.focus){var fi=document.querySelector('.erow[data-id="'+ui.focus+'"] [data-f=s]');ui.focus=0;if(fi)fi.focus();}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;var v=b.getAttribute('data-v');
  switch(b.getAttribute('data-act')){
    case 'mode':prefs.mode=v;ui.slot=null;ui.q='';ui.bulk=null;break;
    case 'lang':prefs.lang=v;break;
    case 'pick':prefs.sel[prefs.mode]=prefs.mode==='grade'||prefs.mode==='tests'?+v:v;ui.slot=null;break;
    case 'hsort':ui.hSort=v;break;
    case 'hrange':ui.hRange=v;break;
    case 'offg':var F=ui.offF;if(+v===0)F.g=[];else{var gi=F.g.indexOf(+v);if(gi>=0)F.g.splice(gi,1);else F.g.push(+v);F.g.sort(function(a,b){return a-b;});}break;
    case 'offAdd':var F2=ui.offF;if(!F2||!F2.date||!F2.text.trim()){msg('offNeed','bad');break;}
      D.off.push({id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:F2.date,to:F2.to&&F2.to>F2.date?F2.to:undefined,text:F2.text.trim(),g:F2.g.slice()});
      ui.offF={date:F2.date,to:'',text:'',g:[]};chDraft();msg('');break;
    case 'offDel':if(!confirm(t('del')+'?'))return;D.off=D.off.filter(function(o){return o.id!==v;});chDraft();msg('');break;
    case 'bulk':if(!ui.bulk||!ED.code)return;bulkApply(v);break;
    // контрольная → неделя этой даты у учителя (или у класса, если учителя нет), клетка открыта
    case 'tjump':var g0=+b.getAttribute('data-g'),tl=testsList().filter(function(x){return !g0||x.c.some(function(k){return +k.split('-')[0]===g0;});})[+b.getAttribute('data-i')];if(!tl)return;
      prefs.mode=tl.t?'teacher':'class';prefs.sel[prefs.mode]=tl.t||tl.c[0];ui.week=weekOf(parseD(tl.date));ui.slot={d:parseD(tl.date).getDay(),p:tl.p};ui.q='';window.scrollTo(0,0);break;
    case 'jump':prefs.mode=b.getAttribute('data-m');prefs.sel[prefs.mode]=v;ui.q='';
      ui.slot=b.hasAttribute('data-d')?{d:+b.getAttribute('data-d'),p:+b.getAttribute('data-p')}:(b.closest('.panel')?ui.slot:null);window.scrollTo(0,0);break;
    case 'okIss':if(!ED.code)return;var oi=D.okK.indexOf(v);if(oi>=0)D.okK.splice(oi,1);else D.okK.push(v);D.ver++;saveDraft();msg('');break;
    case 'slot':var d=+b.getAttribute('data-d'),p=+b.getAttribute('data-p');
      ui.slot=ui.slot&&ui.slot.d===d&&ui.slot.p===p?null:{d:d,p:p};break;
    case 'unslot':ui.slot=null;break;
    case 'gday':ui.gradeDay=+v;break;
    case 'gcell':prefs.mode='class';prefs.sel.class=b.getAttribute('data-k');ui.slot={d:ui.gradeDay,p:+b.getAttribute('data-p')};ui.q='';window.scrollTo(0,0);break;
    case 'retry':load();return;
    case 'editOn':ui.login=true;msg('');break;
    case 'editOff':if(nDirty()&&!confirm(t('discardQ')))return;ED.code='';ssSet('skedyA.code','');ui.login=false;msg('');
      if(nDirty()){sDel('skedyA.draft');sDel('skedyA.chdraft');D.dirty=0;D.chDirty=0;load();return;}break;
    case 'login':var ci=document.getElementById('code');if(ci&&ci.value)login(ci.value);return;
    case 'save':saveAll();return;
    case 'hist':if(ui.hist){ui.hist=null;break;}window.scrollTo(0,0);histLoad();return;
    case 'histOff':ui.hist=null;break;
    case 'msgs':if(ui.msgs){ui.msgs=null;break;}ui.hist=null;window.scrollTo(0,0);msgsLoad();return;
    case 'msgsOff':ui.msgs=null;break;
    case 'ai':if(ui.ai){ui.ai=null;break;}ui.hist=null;ui.msgs=null;ui.ai={text:'',busy:false,err:'',res:null};window.scrollTo(0,0);break;
    case 'aiOff':ui.ai=null;break;
    case 'aiRun':aiRun();return;
    case 'aiApply':aiApply();break;
    case 'msgSend':var mt=(ui.msgs&&ui.msgs.text||'').replace(/\s+/g,' ').trim();if(!mt||!confirm(t('msgQ')))return;msgsPost('/tmsg',{text:mt});return;
    case 'msgDel':if(!confirm(t('del')+'?'))return;msgsPost('/tmsg/delete',{id:v});return;
    case 'restore':if(!confirm(t('restoreQ').replace('{d}',fmtAt(b.getAttribute('data-at')))))return;histRestore(v);return;
    case 'discard':if(!confirm(t('discardQ')))return;sDel('skedyA.draft');sDel('skedyA.chdraft');D.dirty=0;D.chDirty=0;msg('');load();return;
    case 'week':ui.week=v===''?null:v==='now'?weekOf(new Date()):addDays(ui.week||weekOf(new Date()),+v);break;
    case 'chg':var Lc=byIdL(+b.getAttribute('data-id'));if(!Lc||!ui.week||!ED.code)return;chSet(Lc,v,'');msg('');break;
    case 'add':var L={id:++SEQ,d:ui.slot.d,p:ui.slot.p,s:'',t:'',r:'',c:[]},k0=prefs.sel[prefs.mode];
      if(prefs.mode==='class')L.c=[k0];else if(prefs.mode==='teacher')L.t=k0;else L.r=k0;
      D.les.push(L);reindex();saveDraft();msg('');ui.focus=L.id;break;
    case 'del':if(!confirm(t('delQ')))return;var id=+b.getAttribute('data-id');
      D.les=D.les.filter(function(x){return x.id!==id;});reindex();saveDraft();msg('');break;
    case 'rmc':var L2=byIdL(+b.getAttribute('data-id'));if(!L2||(L2.c.length<2&&prefs.mode==='class'))return;
      L2.c=L2.c.filter(function(x){return x!==v;});reindex();saveDraft();msg('');break;
    default:return;
  }
  save();render();
});
// правка поля урока: применяется сразу (в черновик); перенос на другой день/урок — панель едет за уроком
document.addEventListener('change',function(e){
  var f=e.target.getAttribute('data-f');
  if(e.target.hasAttribute('data-ai')&&ui.ai&&ui.ai.res){var P=ui.ai.res.plans[+e.target.getAttribute('data-ai')];if(P)P.on=e.target.checked;return;}
  if(ui.offF&&(f==='ofdate'||f==='ofto'||f==='oftext')){ui.offF[{ofdate:'date',ofto:'to',oftext:'text'}[f]]=e.target.value;return;}
  if(ui.bulk&&(f==='bd'||f==='bfrom'||f==='bto')){ui.bulk[{bd:'d',bfrom:'from',bto:'to'}[f]]=+e.target.value;return;}
  // изменения на дату: другой кабинет (пусто — убрать) и примечание
  var crow=e.target.closest('.crow');
  if(crow&&(f==='chroom'||f==='chnote')){var Lx=byIdL(+crow.getAttribute('data-id')),val=e.target.value.replace(/\s+/g,' ').trim();if(!Lx)return;
    if(f==='chroom'){var oc=chFor(Lx);if(val)chSet(Lx,'room',val);else if(oc&&oc.type==='room')chSet(Lx,'','');else return;}
    else{var cc=chFor(Lx);if(!cc)return;if(val)cc.note=val;else delete cc.note;chDraft();}
    msg('');render();return;}
  var row=e.target.closest('.erow');if(!f||!row)return;
  var L=byIdL(+row.getAttribute('data-id')),v=e.target.value;if(!L)return;
  if(f==='d'||f==='p'){L[f]=+v;ui.slot={d:L.d,p:L.p};}
  else if(f==='addc'){if(!v||L.c.indexOf(v)>=0)return;L.c.push(v);}
  else L[f]=v.replace(/\s+/g,' ').trim();
  reindex();saveDraft();msg('');render();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='code'&&e.target.value)login(e.target.value);});
document.addEventListener('input',function(e){
  if(e.target.id==='aitext'&&ui.ai){ui.ai.text=e.target.value;return;}
  if(e.target.id==='mtext'&&ui.msgs){ui.msgs.text=e.target.value;var mc=document.getElementById('mcount');if(mc)mc.textContent=e.target.value.length+'/300';return;}
  if(e.target.id==='hq'){ui.hq=e.target.value;var pos=e.target.selectionStart;render();var hq=document.getElementById('hq');if(hq){hq.focus();try{hq.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(e.target.id!=='q')return;ui.q=e.target.value;
  var it=document.querySelector('.items');if(it)it.innerHTML=sideItems();
});

/* ---------- start ---------- */
var wd=new Date().getDay();ui.gradeDay=wd<5?wd:0;
load();
})();
