// поэтому если уроки в этой клетке поменяются, проблема покажется снова.
var SKIPR=/חדר אוכל|אולם ספורט|חנ"ג|גן מקלט|יועצת|רכזת|פרטני|מרכז למידה/;
function hsh(x){var h=5381;for(var i=0;i<x.length;i++)h=((h<<5)+h+x.charCodeAt(i))|0;return (h>>>0).toString(36);}
function sig(L){return [L.d,L.p,L.s,L.r,L.t,L.c.join(',')].join('|');}
function issues(){
  if(issues.v===D.ver)return issues.r;var T={},R={},out=[],ids={};
  D.les.forEach(function(L){var k=L.d+'|'+L.p;
    if(L.t)(T[k+'|'+L.t]=T[k+'|'+L.t]||[]).push(L);
    if(L.r&&!SKIPR.test(L.r))(R[k+'|'+L.r]=R[k+'|'+L.r]||[]).push(L);});
  var add=function(type,key,ls,distinct){var seen={},n=0;ls.forEach(function(L){var v=L[distinct];if(v&&!seen[v]){seen[v]=1;n++;}});if(n<2)return;
    var pts=key.split('|'),it={type:type,d:+pts[0],p:+pts[1],name:pts.slice(2).join('|'),ls:ls};
    it.key=type+'|'+key+'|'+hsh(ls.map(sig).sort().join('#'));it.ok=D.okK.indexOf(it.key)>=0;out.push(it);
    if(!it.ok)ls.forEach(function(L){ids[L.id]=1;});};
  Object.keys(T).forEach(function(k){add('t',k,T[k],'r');});
  Object.keys(R).forEach(function(k){add('r',k,R[k],'t');});
  out.sort(function(a,b){return a.d-b.d||a.p-b.p||a.type.localeCompare(b.type)||a.name.localeCompare(b.name,'he');});
  issues.v=D.ver;issues.r={list:out,ids:ids,open:out.filter(function(x){return !x.ok;}).length};return issues.r;
}

/* ---------- изменения на даты (отмена, другой кабинет, контрольная) ---------- */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseD(x){var a=x.split('-');return new Date(+a[0],+a[1]-1,+a[2]);}
function addDays(x,n){var d=parseD(x);d.setDate(d.getDate()+n);return iso(d);}
// воскресенье недели; в пятницу и субботу — уже следующая неделя
function weekOf(d){var w=d.getDay(),x=iso(d);return addDays(x,w>=5?7-w:-w);}
function dateOf(day){return ui.week?addDays(ui.week,day):null;}
function fmtD(x){try{return new Intl.DateTimeFormat(prefs.lang==='he'?'he-IL':prefs.lang==='ru'?'ru-RU':'en-GB',{day:'numeric',month:'numeric'}).format(parseD(x));}catch(e){return x;}}
// урок узнаём по дате (дню), номеру урока, предмету, учителю и общим классам
function chMatch(c,L,date){if(c.date!==date||c.p!==L.p||c.s!==L.s||(c.t||'')!==L.t)return false;
  for(var i=0;i<c.c.length;i++)if(L.c.indexOf(c.c[i])>=0)return true;return !c.c.length;}
function chFor(L){var date=dateOf(L.d);if(!date)return null;for(var i=0;i<D.ch.length;i++)if(chMatch(D.ch[i],L,date))return D.ch[i];return null;}

function chSet(L,type,room,sub){var date=dateOf(L.d),old=chFor(L);
  D.ch=D.ch.filter(function(c){return c!==old;});
  if(type){var c={id:old?old.id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),date:date,p:L.p,s:L.s,t:L.t,c:L.c.slice(),type:type};
    if(type==='room')c.room=room;if(type==='sub'){c.sub=sub;if(old&&old.room)c.room=old.room;}if(old&&old.note)c.note=old.note;D.ch.push(c);}
  chDraft();}

function skId(list,id){for(var i=0;i<(list||[]).length;i++)if(list[i].id===id)return list[i];return null;}

/* ---------- часы: учителя и классы ---------- */
// уроков в неделю (клеток с уроком), дней, окон (пустые клетки между первым и последним уроком дня), предметы с числом клеток
function hoursOf(list){var days={},subj={},n=0,gaps=0;
  (list||[]).forEach(function(L){var d=days[L.d]=days[L.d]||{};if(!d[L.p]){d[L.p]=1;n++;}var sj=subj[L.s]=subj[L.s]||{};sj[L.d+'|'+L.p]=1;});
  Object.keys(days).forEach(function(d){var ps=Object.keys(days[d]).map(Number);gaps+=Math.max.apply(null,ps)-Math.min.apply(null,ps)+1-ps.length;});
  var ss=Object.keys(subj).map(function(s){return [s,Object.keys(subj[s]).length];}).sort(function(a,b){return b[1]-a[1]||a[0].localeCompare(b[0],'he');});
  return {n:n,days:Object.keys(days).length,gaps:gaps,subj:ss};}
// изменения у учителей за период: отмены, смены кабинета, контрольные (клетка дата|урок считается один раз)
function nrmT(x){return String(x||'').replace(/[״"'׳`\-–]/g,' ').replace(/\s+/g,' ').trim();}
function hRange(){var r=ui.hRange||'week',today=iso(new Date()),w=weekOf(new Date());
  if(r==='prev')return [addDays(w,-7),addDays(w,-3)];if(r==='30')return [addDays(today,-29),today];return [w,addDays(w,4)];}
function teacherChanges(a,b){var out={},put=function(name,type,key){var k=nrmT(name);if(!k)return;var o=out[k]=out[k]||{cancel:{},room:{},test:{},out:{},cover:{}};var b=o[type==='exam'?'test':type];if(b)b[key]=1;};
  // замена: у учителя урока — «отдал» (out), у заменяющего — «заменял» (cover)
  D.ch.forEach(function(c){if(c.date<a||c.date>b)return;var k=c.date+'|'+c.p;if(c.type==='sub'){put(c.t,'out',k);put(c.sub,'cover',k);}else put(c.t,c.type,k);});
  var st=D.sk;if(st)(st.changes||[]).forEach(function(c){if(c.date<a||c.date>b)return;var l=skId(st.lessons,c.lessonId);if(l)put(l.teacher,c.type,c.date+'|'+l.period);});

// уроков по расписанию за период: в каждый учебный день — число клеток учителя в этот день недели
// уроков по расписанию за период: в каждый учебный день — клетки учителя; дни без учёбы не считаются

    case 'roG':var RG=ui.roF,rgi=RG.g.indexOf(+v);if(rgi>=0)RG.g.splice(rgi,1);else RG.g.push(+v);RG.g.sort(function(a,b){return a-b;});break;
    case 'roAdd':var RF=ui.roF;if(!RF||!ED.code)return;ui.roNote='';var rt=RF.t.replace(/\s+/g,' ').trim(),ro={id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:rt,k:RF.k};
      if(RF.k==='hr'){var rk=qClsKeys(RF.c);if(rk.bad.length){ui.roNote=t('qBadCls').replace('{c}',rk.bad.join(', '));break;}ro.c=rk.keys;}
      else if(RF.k==='gc')ro.g=RF.g.slice();else if(RF.k==='x')ro.n=RF.n.replace(/\s+/g,' ').trim().slice(0,100);else ro.s=RF.s.replace(/\s+/g,' ').trim();
      if(!rt||(RF.k==='hr'&&!ro.c.length)||(RF.k==='gc'&&!ro.g.length)||(RF.k==='x'&&!ro.n)||((RF.k==='sc'||RF.k==='team')&&!ro.s)){ui.roNote=t('roNeed').replace('{w}',t('roW_'+RF.k));break;}
      D.ro.push(ro);ui.roF=roNewF(RF.k);if(RF.k==='team'||RF.k==='sc')ui.roF.s=RF.s;D.ver++;saveDraft();msg('');break;
    case 'roDel':if(!ED.code||!confirm(t('del')+'?'))return;D.ro=D.ro.filter(function(o){return o.id!==v;});D.ver++;saveDraft();msg('');break;
    case 'offDel':if(!confirm(t('del')+'?'))return;D.off=D.off.filter(function(o){return o.id!==v;});chDraft();msg('');break;
    case 'bulk':if(!ui.bulk||!ED.code)return;bulkApply(v);break;
    // контрольная → неделя этой даты у учителя (или у класса, если учителя нет), клетка открыта
    case 'tjump':var g0=+b.getAttribute('data-g'),tl=testsList().filter(function(x){return !g0||x.c.some(function(k){return +k.split('-')[0]===g0;});})[+b.getAttribute('data-i')];if(!tl)return;
      prefs.mode=tl.t?'teacher':'class';prefs.sel[prefs.mode]=tl.t||tl.c[0];ui.week=weekOf(parseD(tl.date));ui.slot={d:parseD(tl.date).getDay(),p:tl.p};ui.q='';window.scrollTo(0,0);break;
    case 'jump':prefs.mode=b.getAttribute('data-m');prefs.sel[prefs.mode]=v;ui.q='';
      ui.slot=b.hasAttribute('data-d')?{d:+b.getAttribute('data-d'),p:+b.getAttribute('data-p')}:(b.closest('.panel')?ui.slot:null);window.scrollTo(0,0);break;
    case 'okIss':if(!ED.code)return;var oi=D.okK.indexOf(v);if(oi>=0)D.okK.splice(oi,1);else D.okK.push(v);D.ver++;saveDraft();msg('');break;
    case 'slot':var d=+b.getAttribute('data-d'),p=+b.getAttribute('data-p');
      ui.slot=ui.slot&&ui.slot.d===d&&ui.slot.p===p?null:{d:d,p:p};break;
    case 'unslot':ui.slot=null;break;
    case 'gday':ui.gradeDay=+v;break;
    case 'gcell':prefs.mode='class';prefs.sel.class=b.getAttribute('data-k');ui.slot={d:ui.gradeDay,p:+b.getAttribute('data-p')};ui.q='';window.scrollTo(0,0);break;
    case 'retry':load();return;
    case 'editOn':ui.login=true;msg('');break;
    case 'editOff':if(nDirty()&&!confirm(t('discardQ')))return;ED.code='';ssSet('skedyA.code','');ui.login=false;msg('');
      if(nDirty()){sDel('skedyA.draft');sDel('skedyA.chdraft');D.dirty=0;D.chDirty=0;load();return;}break;
    case 'login':var ci=document.getElementById('code');if(ci&&ci.value)login(ci.value);return;
    case 'save':saveAll();return;
    case 'hist':if(ui.hist){ui.hist=null;break;}window.scrollTo(0,0);histLoad();return;
    case 'histOff':ui.hist=null;break;
    case 'msgs':if(ui.msgs){ui.msgs=null;break;}ui.hist=null;window.scrollTo(0,0);msgsLoad();return;
    case 'msgsOff':ui.msgs=null;break;
    case 'ai':if(ui.ai){ui.ai=null;break;}ui.hist=null;ui.msgs=null;ui.ai={text:'',busy:false,err:'',res:null};window.scrollTo(0,0);break;
    case 'aiOff':ui.ai=null;break;
    case 'aiRun':aiRun();return;
    case 'aiApply':aiApply();break;
    case 'msgSend':var mt=(ui.msgs&&ui.msgs.text||'').replace(/\s+/g,' ').trim();if(!mt||!confirm(t('msgQ')))return;msgsPost('/tmsg',{text:mt});return;
    case 'msgDel':if(!confirm(t('del')+'?'))return;msgsPost('/tmsg/delete',{id:v});return;
    case 'restore':if(!confirm(t('restoreQ').replace('{d}',fmtAt(b.getAttribute('data-at')))))return;histRestore(v);return;
    case 'discard':if(!confirm(t('discardQ')))return;sDel('skedyA.draft');sDel('skedyA.chdraft');D.dirty=0;D.chDirty=0;msg('');load();return;
    case 'week':ui.week=v===''?null:v==='now'?weekOf(new Date()):addDays(ui.week||weekOf(new Date()),+v);prefs.showCh=!!ui.week;break;
    case 'chg':var Lc=byIdL(+b.getAttribute('data-id'));if(!Lc||!ui.week||!ED.code)return;chSet(Lc,v,'');ui.subOpen=null;msg('');break;
    case 'subOpen':var Lo=+b.getAttribute('data-id');ui.subOpen=ui.subOpen===Lo?null:Lo;break;
    // замена: в панели клетки (дата недели) или в «Что если» (data-date)
    case 'subPick':var Ls=byIdL(+b.getAttribute('data-id')),ds=b.getAttribute('data-date')||dateOf(Ls?Ls.d:0);if(!Ls||!ds||!ED.code||!D.chOk||!v)return;
      subPut(Ls,ds,v);chDraft();ui.subOpen=null;msg('');break;
    case 'add':var L={id:++SEQ,d:ui.slot.d,p:ui.slot.p,s:'',t:'',r:'',c:[]},k0=prefs.sel[prefs.mode];
      if(prefs.mode==='class')L.c=[k0];else if(prefs.mode==='teacher')L.t=k0;else L.r=k0;
      D.les.push(L);reindex();saveDraft();msg('');ui.focus=L.id;break;
    case 'del':if(!confirm(t('delQ')))return;var id=+b.getAttribute('data-id');
      D.les=D.les.filter(function(x){return x.id!==id;});reindex();saveDraft();msg('');break;
    case 'rmc':var L2=byIdL(+b.getAttribute('data-id'));if(!L2||(L2.c.length<2&&prefs.mode==='class'))return;
      L2.c=L2.c.filter(function(x){return x!==v;});reindex();saveDraft();msg('');break;
    default:return;
  }
  save();render();
});
// правка поля урока: применяется сразу (в черновик); перенос на другой день/урок — панель едет за уроком
document.addEventListener('change',function(e){
  var f=e.target.getAttribute('data-f');
  if(e.target.hasAttribute('data-ai')&&ui.ai&&ui.ai.res){var P=ui.ai.res.plans[+e.target.getAttribute('data-ai')];if(P)P.on=e.target.checked;return;}
  if(ui.cov&&{cot:'t',cofrom:'from',coto:'to',cop:'p',cocls:'cls',cos:'s',con:'n'}[f]){ui.cov[{cot:'t',cofrom:'from',coto:'to',cop:'p',cocls:'cls',cos:'s',con:'n'}[f]]=e.target.value;return;}
  if(ui.thv&&(f==='thn'||f==='thh')){ui.thv.add[f==='thn'?'n':'h']=e.target.value;return;}
  if(f==='thv'&&ED.code){var tv=e.target.value.trim(),tk=e.target.getAttribute('data-id'),ti=parseInt(tv,10);
    if(tv==='')delete D.th[tk];else if(!isNaN(ti))D.th[tk]=Math.max(0,Math.min(60,ti));saveDraft();msg('');render();return;}
  if(ui.qv&&/^qa[stchnrk]$/.test(f||'')){ui.qv.add[f.slice(2)]=e.target.value;return;}
  if(f==='qbf'&&ui.qv){ui.qv.b=e.target.value;render();return;}
  if((f==='qn'||f==='qr'||f==='qk'||f==='qgn'||f==='qb')&&ED.code){var qv=e.target.value.replace(/\s+/g,' ').trim(),qid2=e.target.getAttribute('data-id');
    D.q.forEach(function(x){if(x.id!==qid2)return;if(f==='qn')x.n=qv.slice(0,100);else if(f==='qgn')x.gn=qv.slice(0,100);else if(f==='qb')x.b=qv.slice(0,100);else if(f==='qr')x.r=qv;else{var kn=parseInt(qv,10);x.k=qv===''||isNaN(kn)?null:Math.max(0,Math.min(300,kn));}});
    saveDraft();msg('');return;}
  if(f==='qh'&&ED.code){var qh=parseInt(e.target.value,10),qid=e.target.getAttribute('data-id');D.q.forEach(function(x){if(x.id===qid&&!isNaN(qh))x.h=Math.max(0,Math.min(40,qh));});D.ver++;saveDraft();msg('');render();return;}
  if(ui.rb&&(f==='rbcls'||f==='rbmax'||f==='rbone'||f==='rbreb')){var RB2=ui.rb;
    if(f==='rbcls')RB2.cls=e.target.value;else if(f==='rbmax')RB2.maxP=+e.target.value;else if(f==='rbone')RB2.one=e.target.checked;else RB2.rebuild=e.target.checked;
    RB2.res=null;render();return;}
  if(f==='wiwho'||f==='wifrom'||f==='wito'){var Ww=wiState();Ww[{wiwho:'who',wifrom:'from',wito:'to'}[f]]=e.target.value.trim();render();return;}
  if(ui.apF&&/^ap(date|title|due|c|note)$/.test(f||'')){ui.apF[f.slice(2)]=e.target.value;return;}
  if(ui.roF&&/^ro[tcsn]$/.test(f||'')){ui.roF[f.slice(2)]=e.target.value;return;}
  if(ui.pmF&&/^pm(date|from|to|title|c|t|room|note|slot)$/.test(f||'')){ui.pmF[f.slice(2)]=e.target.value;return;}
  if(ui.offF&&(f==='ofdate'||f==='ofto'||f==='oftext')){ui.offF[{ofdate:'date',ofto:'to',oftext:'text'}[f]]=e.target.value;return;}
  if(ui.bulk&&(f==='bd'||f==='bfrom'||f==='bto')){ui.bulk[{bd:'d',bfrom:'from',bto:'to'}[f]]=+e.target.value;return;}
  // замена — другой учитель по имени (не из списка свободных)
  if(f==='subname'){var Ln=byIdL(+e.target.getAttribute('data-id')),nv=e.target.value.replace(/\s+/g,' ').trim();if(!Ln||!nv||nv===Ln.t||!ui.week||!D.chOk)return;
    subPut(Ln,dateOf(Ln.d),nv);chDraft();ui.subOpen=null;msg('');render();return;}
  // изменения на дату: другой кабинет (пусто — убрать) и примечание
  var crow=e.target.closest('.crow');
  if(crow&&(f==='chroom'||f==='chnote')){var Lx=byIdL(+crow.getAttribute('data-id')),val=e.target.value.replace(/\s+/g,' ').trim();if(!Lx)return;
    if(f==='chroom'){var oc=chFor(Lx);if(oc&&oc.type==='sub'){if(val)oc.room=val;else delete oc.room;chDraft();}else if(val)chSet(Lx,'room',val);else if(oc&&oc.type==='room')chSet(Lx,'','');else return;}
    else{var cc=chFor(Lx);if(!cc)return;if(val)cc.note=val;else delete cc.note;chDraft();}
    msg('');render();return;}
  var row=e.target.closest('.erow');if(!f||!row)return;
  var L=byIdL(+row.getAttribute('data-id')),v=e.target.value;if(!L)return;
  if(f==='d'||f==='p'){L[f]=+v;ui.slot={d:L.d,p:L.p};}
  else if(f==='addc'){if(!v||L.c.indexOf(v)>=0)return;L.c.push(v);}
  else L[f]=v.replace(/\s+/g,' ').trim();
  reindex();saveDraft();msg('');render();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='code'&&e.target.value)login(e.target.value);});
document.addEventListener('input',function(e){
  if(e.target.id==='thf'&&ui.thv){ui.thv.f=e.target.value;var tp=e.target.selectionStart;render();var tf=document.getElementById('thf');if(tf){tf.focus();try{tf.setSelectionRange(tp,tp);}catch(x){}}return;}
  if(e.target.id==='qf'&&ui.qv){ui.qv.f=e.target.value;var pos=e.target.selectionStart;render();var qf=document.getElementById('qf');if(qf){qf.focus();try{qf.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(e.target.id==='aitext'&&ui.ai){ui.ai.text=e.target.value;return;}
  if(e.target.id==='mtext'&&ui.msgs){ui.msgs.text=e.target.value;var mc=document.getElementById('mcount');if(mc)mc.textContent=e.target.value.length+'/300';return;}
  if(e.target.id==='hq'){ui.hq=e.target.value;var pos=e.target.selectionStart;render();var hq=document.getElementById('hq');if(hq){hq.focus();try{hq.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(e.target.id!=='q')return;ui.q=e.target.value;
  var it=document.querySelector('.items');if(it)it.innerHTML=sideItems();
});

/* ---------- start ---------- */
var wd=new Date().getDay();ui.gradeDay=wd<5?wd:0;
if(prefs.showCh!==false)ui.week=weekOf(new Date()); // изменения на даты видны сразу, пока их не скрыли
load();
})();
