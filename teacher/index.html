<style id="app-css">
/* Skedy Teachers: та же палитра p2 («лайм»), что у ученического приложения */
:root{--bg:#171717;--card:#101010;--line:rgba(255,255,255,.08);--ink:#F2F2F2;--muted:#A3A3A3;--acc:#C6FF00;--acc-ink:#171717;--bad:#FF5A5F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#root{max-width:620px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);margin:0 -16px 8px;padding-inline:16px}
.top .logo{width:36px;height:36px;flex:none}
.top b{font-size:20px;font-weight:700}
.top .who{margin-inline-start:auto;color:var(--muted);font-size:14px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:30px;font-weight:700;margin:14px 0 4px}
.sub{color:var(--muted);margin:0 0 16px;line-height:1.45}
.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
.input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#0D0D0D;border:1px solid var(--line);border-radius:16px;padding:13px 16px;outline:none}
.input:focus{border-color:var(--acc)}
.list{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list button{display:block;width:100%;text-align:start;padding:14px 18px;font-size:17px;border-bottom:1px solid var(--line);min-height:50px}
.list button:last-child{border-bottom:0}
.list button:active{background:#1d1d1d}
.primary{background:var(--acc);color:var(--acc-ink);font-weight:600;border-radius:999px;padding:14px 22px;min-height:48px;width:100%;box-shadow:0 0 18px rgba(198,255,0,.25)}
.secondary{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:13px 20px;min-height:48px;width:100%;font-weight:600}
.link{color:var(--acc);text-decoration:underline;padding:10px;font-size:15px}
.dayhead{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.dayhead .t{flex:1}.dayhead .wd{font-size:30px;font-weight:700;margin:0}.dayhead .dt{color:var(--muted);font-size:15px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0D0D0D;border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:14px}
.chip{border-radius:14px;min-height:48px;font-weight:600;color:var(--muted)}
.chip.on{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc),0 0 12px rgba(198,255,0,.25)}
.chip.today b{text-decoration:underline;text-underline-offset:4px}
ul.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.lesson{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 15px}
.lesson .num{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);font-variant-numeric:tabular-nums;direction:ltr}
.lesson .body{flex:1;min-width:0}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.subj{font-weight:700;font-size:17px}
.time{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.r2{color:var(--muted);font-size:14px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.r2 .aud{color:var(--ink)}
.r2 s{opacity:.6}.r2 mark{background:none;color:var(--acc);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--acc);color:var(--acc-ink)}
.tag.cancel{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.tag.next{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.lesson.is-now{border-color:var(--acc);box-shadow:0 0 18px rgba(198,255,0,.22)}
.lesson.is-now .num{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.lesson.is-test .num,.lesson.is-exam .num,.lesson.is-room .num{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.lesson.is-cancel .subj{text-decoration:line-through;opacity:.7}
.lesson.free{background:none;border:0;padding:4px 15px;color:var(--muted)}
.lesson.free .num{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.left{color:var(--acc);font-size:14px;font-weight:600;margin-top:6px}
.notice{background:#1f2a00;border:1px solid rgba(198,255,0,.5);color:var(--acc);border-radius:16px;padding:11px 14px;margin-bottom:12px;font-weight:500}
.notice.plain{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:400}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.dhead{font-size:16px;color:var(--muted);margin:18px 4px 8px}
.field{margin:16px 0}.field>label{display:block;color:var(--muted);font-size:14px;margin:0 4px 6px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#0D0D0D;border:1px solid var(--line);border-radius:16px;padding:4px}
.langs button{border-radius:12px;min-height:44px;font-weight:600;color:var(--muted)}
.langs button.on{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:22px;line-height:1.5}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.welcome{text-align:center;padding-top:30px}
.welcome .logo{width:88px;height:88px}
.welcome h1{font-size:32px;margin:12px 0 4px}
.tabbar{position:fixed;inset-inline:0;bottom:0;padding:0 16px calc(10px + env(safe-area-inset-bottom));z-index:5;pointer-events:none}
.tabbar .in{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(16,16,16,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:6px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabbar button.on{color:var(--acc)}
.tabbar svg{width:24px;height:24px}
.tabbar .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);background:var(--acc);color:var(--acc-ink);border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.tabbar .badge:empty{display:none}
.pstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px 6px;padding-inline:16px;scrollbar-width:none}
.pstrip::-webkit-scrollbar{display:none}
.pstrip .chip{flex:none;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;background:#0D0D0D;border:1px solid var(--line)}
.pstrip .chip small{font-size:11px;font-weight:400;color:var(--muted);direction:ltr}
.pstrip .chip.on{border-color:transparent}
.bld{margin:14px 0}.bld>b{display:block;font-size:15px;color:var(--muted);margin:0 4px 8px}
.rooms{display:flex;flex-wrap:wrap;gap:8px}
.room{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
.seg2{grid-template-columns:repeat(2,1fr);margin-top:14px}
.g6{grid-template-columns:repeat(6,1fr)}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.nums button{border-radius:12px;min-height:44px;font-weight:600;background:#0D0D0D;border:1px solid var(--line);color:var(--muted)}
.nums button.on{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
#wl{margin-top:8px}#wl:not(:has(button:not([hidden]))){display:none}
/* ---------- анимации, как в ученическом Skedy ---------- */
/* переезжающая лаймовая рамка в переключателях (дни, уроки, языки, режимы, классы) и круг под вкладкой */
.sl{position:relative}.sl > :not(.slider){position:relative;z-index:1}
.sl > .on{box-shadow:none!important;background:transparent!important;border-color:transparent!important}
.slider{position:absolute;left:0;top:0;z-index:0;border-radius:12px;pointer-events:none;background:radial-gradient(circle,rgba(198,255,0,.2),rgba(198,255,0,.04) 75%);box-shadow:inset 0 0 0 1.5px var(--acc),0 0 14px rgba(198,255,0,.4);transition:transform .5s cubic-bezier(.34,1.3,.64,1),width .5s cubic-bezier(.34,1.3,.64,1),height .5s cubic-bezier(.34,1.3,.64,1)}
.strip .slider,.pstrip .slider{border-radius:14px}
.tabbar .slider{background:none;box-shadow:none;transition:transform .55s cubic-bezier(.34,1.35,.64,1)}
.tabbar .slider::before{content:'';position:absolute;top:-1px;left:50%;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:radial-gradient(circle,rgba(198,255,0,.28),rgba(198,255,0,.06) 70%);box-shadow:inset 0 0 0 1.5px var(--acc),0 0 14px rgba(198,255,0,.45)}
.tabbar svg.pop{animation:navpop .5s cubic-bezier(.34,1.5,.64,1)}
@keyframes navpop{0%{transform:none}40%{transform:translateY(-9px) scale(1.15)}100%{transform:none}}
/* новый экран, день или урок: карточки появляются по очереди с пружинкой */
.wrap.enter .lessons > li,.wrap.enter .room,.wrap.enter .list,.wrap.enter .stack,.wrap.enter .field,.wrap.enter .notice{animation:cardin .5s cubic-bezier(.34,1.25,.64,1) both}
.wrap.enter h2,.wrap.enter .sub,.wrap.enter .dhead,.wrap.enter .empty,.wrap.enter .foot,.wrap.enter .bld > b{animation:fadein .35s ease both}
.wrap.enter .lessons > li:nth-child(2),.wrap.enter .room:nth-child(2){animation-delay:30ms}
.wrap.enter .lessons > li:nth-child(3),.wrap.enter .room:nth-child(3){animation-delay:60ms}
.wrap.enter .lessons > li:nth-child(4),.wrap.enter .room:nth-child(4){animation-delay:90ms}
.wrap.enter .lessons > li:nth-child(5),.wrap.enter .room:nth-child(5){animation-delay:120ms}
.wrap.enter .lessons > li:nth-child(6),.wrap.enter .room:nth-child(6){animation-delay:150ms}
.wrap.enter .lessons > li:nth-child(7),.wrap.enter .room:nth-child(7){animation-delay:180ms}
.wrap.enter .lessons > li:nth-child(8),.wrap.enter .room:nth-child(8){animation-delay:210ms}
.wrap.enter .lessons > li:nth-child(9),.wrap.enter .room:nth-child(9){animation-delay:240ms}
.wrap.enter .lessons > li:nth-child(n+10),.wrap.enter .room:nth-child(n+10){animation-delay:270ms}
@keyframes cardin{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes wfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:no-preference){.welcome .logo{animation:wfloat 4s ease-in-out infinite}}
@media (prefers-reduced-motion:reduce){.slider,.tabbar .slider{transition:none}.tabbar svg.pop,.wrap.enter *{animation:none!important}}
.gtoggle{margin-top:8px;color:var(--acc);font-size:14px;font-weight:600;padding:8px 0;min-height:36px}
.glist{list-style:none;margin:4px 0 0;padding:0;border-top:1px solid var(--line)}
.glist li{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.glist li:last-child{border-bottom:0}
.glist li b{font-weight:600}
/* учитель и кабинет — отдельными кусками в ряд: порядок «учитель · кабинет» в любом направлении письма */
.glist .gm{display:flex;flex-wrap:wrap;gap:0 6px;color:var(--muted)}.glist .gm i{font-style:normal}
@media (prefers-reduced-motion:no-preference){.glist{animation:cardin .4s cubic-bezier(.34,1.25,.64,1) both}}
bdi{unicode-bidi:isolate}
[hidden]{display:none!important}
</style>

/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function wday(s){return parse(s).getDay();}
function todayISO(){return iso(new Date());}
function schoolDay(s){while(wday(s)>=5)s=addDays(s,1);return s;}
function stepDay(s,n){do{s=addDays(s,n);}while(wday(s)>=5);return s;}
function fmtDate(s){try{return new Intl.DateTimeFormat(LOC[prefs.lang],{day:'numeric',month:'long'}).format(parse(s));}catch(e){return s;}}
function fmtStamp(s){try{return new Intl.DateTimeFormat(LOC[prefs.lang],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(s));}catch(e){return s;}}
function mins(hm){var p=String(hm).split(':');return (+p[0])*60+(+p[1]);}
function nowMins(){var d=new Date();return d.getHours()*60+d.getMinutes();}

/* ---------- data helpers ---------- */
function byId(list,id){for(var i=0;i<(list||[]).length;i++)if(list[i].id===id)return list[i];return null;}
function per(n){var r=null;(STATE.periods||[]).forEach(function(p){if(p.n===n)r=p;});return r;}
function normT(s){return String(s||'').replace(/[״"'׳`\-–]/g,' ').replace(/\s+/g,' ').trim();}
function normQ(s){return normT(s).toLowerCase();}
// все учителя из расписания (по урокам), по алфавиту
// все учителя школы (teachers.json) и из данных Skedy, по алфавиту
function teachers(){var key=STATE.updatedAt+'|'+(WHO?WHO.updated:'');if(teachers.k===key)return teachers.v;var seen={},out=[];
  var add=function(n){var k=normT(n);if(k&&!seen[k]){seen[k]=1;out.push(n);}};
  if(WHO)Object.keys(WHO.t).forEach(add);STATE.lessons.forEach(function(l){add(l.teacher);});
  out.sort(function(a,b){return a.localeCompare(b,'he');});teachers.k=key;teachers.v=out;return out;}
function meOk(){return !!(STATE&&prefs.teacher&&teachers().some(function(n){return normT(n)===normT(prefs.teacher);}));}
// кому этот урок: класс или группа (у группы — её уровень или блок, у групп одного класса — и класс)
function audName(a,sname){
  if(a.type==='class')return nm(byId(STATE.classes,a.id));
  var g=byId(STATE.groups,a.id);if(!g)return '';var cat=byId(STATE.subjects,g.subjectId),gn=nm(g);
  // блок (אשכול) — его название; математика, английский, физкультура — уровень или название группы
  var lbl=cat&&cat.multi?nm(cat):(gn||nm(cat));
  if(lbl===sname)lbl=''; // «חנ״ג בנים» у урока «חנ״ג בנים» — лишнее
  return [g.classId?nm(byId(STATE.classes,g.classId)):'',lbl].filter(Boolean).join(' · ')||nm(cat);
}
function changesFor(date,lid){return (STATE.changes||[]).filter(function(c){return c.date===date&&c.lessonId===lid;});}
// мои уроки в этот день; одинаковые уроки у нескольких классов (тот же номер, предмет и кабинет) — одна карточка
// мои уроки: по расписанию всей школы (teachers.json), изменения — из Skedy, где они есть (уроки י׳)
function whoName(name){if(!WHO)return null;if(WHO.t[name])return name;var k=normT(name),r=null;Object.keys(WHO.t).forEach(function(n){if(!r&&normT(n)===k)r=n;});return r;}
function myLessons(date){
  var wn=whoName(prefs.teacher);if(!wn)return myLessonsSkedy(date);
  var wd=wday(date),me=normT(prefs.teacher),own=myLessonsSkedy(date);
  return WHO.t[wn].filter(function(x){return x[0]===wd;}).map(function(x){
    var sname=WHO.s[x[2]],m=null;own.forEach(function(o){if(!m&&o.l.period===x[1])m=o;});
    // урок есть и в Skedy — берём оттуда изменения и перевод предмета
    var l={id:m?m.l.id:'w'+x[1],period:x[1],room:WHO.r[x[3]],subjectName:sname,subjectId:m?m.l.subjectId:'w:'+sname};
    return {l:l,ch:m?m.ch:[],aud:[WHO.a[x[4]]]};
  }).sort(function(a,b){return a.l.period-b.l.period;});
}
function myLessonsSkedy(date){
  var wd=wday(date),me=normT(prefs.teacher),map={},out=[];
  STATE.lessons.forEach(function(l){if(l.day!==wd||normT(l.teacher)!==me)return;
    var k=l.period+'|'+l.subjectId+'|'+(l.room||''),ch=changesFor(date,l.id);
    if(map[k]){var x=map[k];var a=audName(l.aud,nm(byId(STATE.subjects,l.subjectId)));if(a&&x.aud.indexOf(a)<0)x.aud.push(a);ch.forEach(function(c){if(!x.ch.some(function(y){return y.type===c.type;}))x.ch.push(c);});return;}
    map[k]={l:l,ch:ch,aud:[audName(l.aud,nm(byId(STATE.subjects,l.subjectId)))].filter(Boolean)};out.push(map[k]);});
  return out.sort(function(a,b){return a.l.period-b.l.period;});
}
// мои классы (по урокам всего класса) — для событий отдельных классов
function myClasses(){var me=normT(prefs.teacher),s={};STATE.lessons.forEach(function(l){if(normT(l.teacher)===me&&l.aud.type==='class')s[l.aud.id]=1;});return s;}
function eventsFor(date){var mc=myClasses(),me=normT(prefs.teacher);
  return (STATE.events||[]).filter(function(e){if(e.date!==date)return false;if(e.teacher)return normT(e.teacher)===me;
    return !e.cls||e.cls.some(function(c){return mc[c];});});}
function dayOff(date){var e=eventsFor(date).filter(function(x){return x.off&&!x.from&&!x.cls;});return e.length?e[0]:null;}
function kind(x){var k='';x.ch.forEach(function(c){if(c.type==='test'||c.type==='exam')k=c.type;});return k;}
// контрольная одного предмета на несколько уроков подряд — одна карточка
function blocks(items){var out=[];items.forEach(function(x){var k=kind(x),b=out[out.length-1];
  if(b&&k&&b.k===k&&b.s===x.l.subjectId&&x.l.period>=b.last&&x.l.period<=b.last+1){b.last=x.l.period;}
  else out.push({k:k,s:x.l.subjectId,last:x.l.period,x:x});});return out;}
function upcomingTests(){var d=todayISO(),end=addDays(d,21),out=[];
  for(;d<=end;d=addDays(d,1)){if(wday(d)>=5||dayOff(d))continue;
    var its=myLessons(d).filter(function(x){return kind(x);});if(its.length)out.push({date:d,items:blocks(its)});}
  return out;}

/* ---------- data from server ---------- */
function load(){
  if(!API){ui.failed=!STATE;render();return;}
  ui.loading=!STATE;render();
  fetch(API+'/data',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    ui.loading=false;
    if(j&&Array.isArray(j.lessons)){if(!STATE||!STATE.updatedAt||!j.updatedAt||j.updatedAt>=STATE.updatedAt){STATE=j;sSet('skedyT.data',j);}ui.offline=false;ui.failed=false;}
    else{ui.offline=!!STATE;ui.failed=!STATE;}
    render();
  },function(){ui.loading=false;ui.offline=!!STATE;ui.failed=!STATE;render();});
  fetch('rooms.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.rooms){ROOMS=j;sSet('skedyT.rooms',j);if(ui.screen==='rooms')render();}},function(){});
  loadClass();
  fetch('teachers.json',{cache:'no-cache'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(j&&j.t){WHO=j;sSet('skedyT.who',j);render();}},function(){});
}

/* ---------- push ---------- */
// своя регистрация service worker на /teacher/ — значит своя подписка, отдельная от ученического Skedy
function standalone(){try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}catch(e){return false;}}
function isIOS(){var u=navigator.userAgent||'';return /iphone|ipad|ipod/i.test(u)||(/macintosh/i.test(u)&&navigator.maxTouchPoints>1);}
function pushOn(){try{return Notification.permission==='granted'&&!!sGet('skedyT.push');}catch(e){return false;}}
function b64uBytes(s){s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
function swReady(){return navigator.serviceWorker.register('../sw.js',{scope:'./'}).then(function(){return navigator.serviceWorker.ready;});}
function sendSub(sub,force){
  var sig=[sub.endpoint,normT(prefs.teacher),prefs.lang].join('|');if(!force&&sGet('skedyT.pushsig')===sig)return Promise.resolve();
  return fetch(API+'/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON?sub.toJSON():sub,teacher:prefs.teacher,lang:prefs.lang})})
  .then(function(r){if(!r.ok)throw new Error('subscribe');sSet('skedyT.pushsig',sig);});
}
function enablePush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window)){ui.msg=t(isIOS()&&!standalone()?'pushNeedInstall':'pushUnsupported');render();return;}
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){ui.msg=t('pushDenied');render();return;}
    return Promise.all([swReady(),fetch(API+'/vapid').then(function(r){return r.json();})]).then(function(a){
      var reg=a[0];return reg.pushManager.getSubscription().then(function(old){return old||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(a[1].key)});});
    }).then(function(sub){return sendSub(sub,true);}).then(function(){sSet('skedyT.push','on');ui.msg=t('pushOnMsg');render();});
  }).catch(function(){ui.msg=t('pushFailed');render();});
}
// сменили учителя или язык — сообщаем серверу
function syncPush(){
  if(!API||!pushOn()||!meOk()||!('serviceWorker' in navigator))return;
  navigator.serviceWorker.getRegistration('./').then(function(reg){return reg&&reg.pushManager.getSubscription();}).then(function(x){if(x)return sendSub(x);}).catch(function(){});
}

var BUILD=['גפן','זית','אלון','ארז','שקד','רימון','ברוש','אורן','תמר','ריושקה','בית רינה'];
function building(r){for(var i=0;i<BUILD.length;i++)if(r.indexOf(BUILD[i]+' ')===0)return BUILD[i];return '';}
function roomNum(r){var m=/\s(\d+)/.exec(r);return m?+m[1]:999;}
// текущий урок, а между уроками и до начала — следующий
function curP(){var n=nowMins(),best=null;(STATE.periods||[]).forEach(function(p){if(!best&&n<mins(p.end))best=p.n;});return best||((STATE.periods||[])[0]||{}).n||1;}
function freeRooms(date,p){
  var wd=wday(date),taken={};
  // изменения, которые знает Skedy: другой кабинет, событие в кабинете
  (STATE.changes||[]).forEach(function(c){if(c.date!==date||c.type!=='room'||!c.room)return;var l=byId(STATE.lessons,c.lessonId);if(l&&l.period===p)taken[c.room]=1;});
  (STATE.events||[]).forEach(function(e){if(e.date===date&&e.room&&e.from&&p>=e.from&&p<=e.to)taken[e.room]=1;});
  return Object.keys(ROOMS.rooms).filter(function(r){return !(ROOMS.rooms[r][wd]&(1<<p))&&!taken[r];});
}
// вкладка «Поиск»: свободные кабинеты или где учитель
function renderFind(){

}
function dayStrip(d,act){var today=todayISO(),sun=addDays(d,-wday(d)),h='<div class="strip">';

function classCid(){var m=/^10-(\d+)$/.exec(prefs.myClass||''),c=null;if(m)STATE.classes.forEach(function(x){if(x.letter==='י'&&x.num===+m[1])c=x.id;});return c;}

// уроки класса в этот день: один урок — предмет, учитель и кабинет; деление на группы — одна строка «N групп»
function classLessons(date){
  if(!CLS||CLS.k!==prefs.myClass)return null;
  var D=CLS.d,wd=wday(date),cid=classCid(),byP={};
  D.l.forEach(function(x){if(x[0]===wd)(byP[x[1]]=byP[x[1]]||[]).push(x);});
  return Object.keys(byP).map(Number).sort(function(a,b){return a-b;}).map(function(p){var xs=byP[p],ch=[];
    if(cid)STATE.lessons.forEach(function(l){if(l.day===wd&&l.period===p&&l.aud.type==='class'&&l.aud.id===cid)ch=ch.concat(changesFor(date,l.id));});
    if(xs.length===1){var x=xs[0];return {l:{id:'c'+p,period:p,room:D.r[x[3]],subjectName:D.s[x[2]]},ch:ch,aud:[D.t[x[4]]].filter(Boolean)};}
    var cnt={},seen={},gs=[];xs.forEach(function(x){var n=D.s[x[2]];cnt[n]=(cnt[n]||0)+1;
      var g={s:n,t:D.t[x[4]]||'',r:D.r[x[3]]||''},k=g.s+'|'+g.t+'|'+g.r;if(!seen[k]){seen[k]=1;gs.push(g);}});
    var names=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];});
    // все группы этого урока — раскрываются по нажатию: предмет, учитель, кабинет

  root.querySelectorAll(SLIDES).forEach(function(c){
    var on=c.querySelector(':scope > .on');if(!on)return;
    var k=slideKey(c),sl=document.createElement('span');sl.className='slider';sl.setAttribute('aria-hidden','true');c.classList.add('sl');c.insertBefore(sl,c.firstChild);
    var r={x:on.offsetLeft,y:on.offsetTop,w:on.offsetWidth,h:on.offsetHeight},p=SLIDE[k];
    var put=function(q){sl.style.transform='translate('+q.x+'px,'+q.y+'px)';sl.style.width=q.w+'px';sl.style.height=q.h+'px';};
    var go=p&&(k==='nav'||k===slideAll.only)&&(p.x!==r.x||p.y!==r.y||p.w!==r.w);
    sl.style.transition='none';
    if(go){put(p);void sl.offsetWidth;sl.style.transition='';}
    put(r);SLIDE[k]=r;
    if(!go){void sl.offsetWidth;sl.style.transition='';}
    // ряд уроков прокручивается: выбранный урок всегда на виду
    if(c.scrollWidth>c.clientWidth){var L=on.offsetLeft,R=L+on.offsetWidth;if(L<c.scrollLeft||R>c.scrollLeft+c.clientWidth)c.scrollLeft=L-(c.clientWidth-on.offsetWidth)/2;}
  });
}
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  var sc=el.parentNode&&el.parentNode.matches&&el.parentNode.matches(SLIDES)?el.parentNode:null;slideAll.only=sc?slideKey(sc):null;
  switch(a){
    case 'push':ui.msg='';enablePush();break;
    case 'me':prefs.teacher=id;savePrefs();syncPush();ui.screen='day';ui.q='';ui.date=schoolDay(todayISO());render();window.scrollTo(0,0);break;
    case 'change':ui.screen='pick';render();window.scrollTo(0,0);break;
    case 'lang':prefs.lang=id;savePrefs();syncPush();render();break;
    case 'tab':ui.msg='';if(id==='day'&&ui.screen==='day')ui.date=schoolDay(todayISO());ui.screen=id;render();window.scrollTo(0,0);break;
    case 'day':ui.date=stepDay(ui.date,+el.getAttribute('data-n'));ui.openG={};render();break;
    case 'goto':ui.date=id;ui.openG={};render();break;
    case 'rday':ui.rDate=id;render();break;
    case 'rmode':ui.rMode=id;render();break;
    case 'dmode':ui.dMode=id;render();break;
    case 'grp':ui.openG=ui.openG||{};ui.openG[id]=!ui.openG[id];render();break;
    case 'cg':ui.cg=+id;render();break;
    case 'cls':prefs.myClass=id||null;savePrefs();if(!id)ui.dMode='me';else{ui.dMode='class';if(!CLS||CLS.k!==id)loadClass();}render();break;
    case 'who':ui.who=id;ui.wq='';render();break;
    case 'rp':ui.rP=+id;render();break;
    case 'retry':load();break;
  }
});
// поиск учителя: фильтруем список без перерисовки, чтобы не прыгала клавиатура
// «где учитель»: показываем до 8 совпадений, пока ничего не выбрали
root.addEventListener('input',function(e){if(!e.target||e.target.id!=='wq')return;ui.wq=e.target.value;var q=normQ(ui.wq),n=0;
  root.querySelectorAll('#wl [data-key]').forEach(function(b){var ok=q&&b.getAttribute('data-key').indexOf(q)>=0&&n<8;b.hidden=!ok;if(ok)n++;});});
root.addEventListener('input',function(e){if(!e.target||e.target.id!=='q')return;ui.q=e.target.value;var q=normQ(ui.q),n=0;
  root.querySelectorAll('#tl [data-key]').forEach(function(b){var ok=!q||b.getAttribute('data-key').indexOf(q)>=0;b.hidden=!ok;if(ok)n++;});
  var nm_=document.getElementById('nomatch');if(nm_)nm_.hidden=!!n;});
// сменить день свайпом
var sx=null;root.addEventListener('touchstart',function(e){sx=ui.screen==='day'&&e.touches.length===1?e.touches[0].clientX:null;},{passive:true});
root.addEventListener('touchend',function(e){if(sx==null||!STATE||!meOk())return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)<70)return;
  var fwd=dx<0;if(document.documentElement.dir==='rtl')fwd=!fwd;ui.date=stepDay(ui.date,fwd?1:-1);render();},{passive:true});

/* ---------- start ---------- */
render();load();
// раз в минуту обновляем «сейчас» и «осталось», раз в 5 минут — данные
setInterval(function(){if(ui.screen==='day'&&STATE&&meOk())render();},60000);
setInterval(load,300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'./'}).then(syncPush,function(){});
})();
</script>
