/* Skedy для учителей: та же палитра p2 («лайм»), что у ученического приложения */
:root{--bg:#171717;--card:#101010;--line:rgba(255,255,255,.08);--ink:#F2F2F2;--muted:#A3A3A3;--acc:#C6FF00;--acc-ink:#171717;--bad:#FF5A5F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#root{max-width:620px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);margin:0 -16px 8px;padding-inline:16px}
.top .logo{width:36px;height:36px;flex:none}
.top b{font-size:20px;font-weight:700}
.top .who{margin-inline-start:auto;color:var(--muted);font-size:14px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:30px;font-weight:700;margin:14px 0 4px}
.sub{color:var(--muted);margin:0 0 16px;line-height:1.45}
.muted{color:var(--muted)}.small{font-size:14px}.center{text-align:center}
.input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#0D0D0D;border:1px solid var(--line);border-radius:16px;padding:13px 16px;outline:none}
.input:focus{border-color:var(--acc)}
.list{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.list button{display:block;width:100%;text-align:start;padding:14px 18px;font-size:17px;border-bottom:1px solid var(--line);min-height:50px}
.list button:last-child{border-bottom:0}
.list button:active{background:#1d1d1d}
.primary{background:var(--acc);color:var(--acc-ink);font-weight:600;border-radius:999px;padding:14px 22px;min-height:48px;width:100%;box-shadow:0 0 18px rgba(198,255,0,.25)}
.secondary{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:13px 20px;min-height:48px;width:100%;font-weight:600}
.link{color:var(--acc);text-decoration:underline;padding:10px;font-size:15px}
.dayhead{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.dayhead .t{flex:1}.dayhead .wd{font-size:30px;font-weight:700;margin:0}.dayhead .dt{color:var(--muted);font-size:15px}
.icon-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#0D0D0D;border:1px solid var(--line);border-radius:18px;padding:4px;margin-bottom:14px}
.chip{border-radius:14px;min-height:48px;font-weight:600;color:var(--muted)}
.chip.on{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc),0 0 12px rgba(198,255,0,.25)}
.chip.today b{text-decoration:underline;text-underline-offset:4px}
ul.lessons{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.lesson{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px 15px}
.lesson .num{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-weight:600;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);font-variant-numeric:tabular-nums;direction:ltr}
.lesson .body{flex:1;min-width:0}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.subj{font-weight:700;font-size:17px}
.time{color:var(--muted);font-variant-numeric:tabular-nums;direction:ltr;white-space:nowrap}
.r2{color:var(--muted);font-size:14px;margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.r2 .aud{color:var(--ink)}
.r2 s{opacity:.6}.r2 mark{background:none;color:var(--acc);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--acc);color:var(--acc-ink)}
.tag.cancel{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.tag.next{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.lesson.is-now{border-color:var(--acc);box-shadow:0 0 18px rgba(198,255,0,.22)}
.lesson.is-now .num{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.lesson.is-test .num,.lesson.is-exam .num,.lesson.is-room .num{background:var(--acc);color:var(--acc-ink);box-shadow:none}
.lesson.is-cancel .subj{text-decoration:line-through;opacity:.7}
.lesson.free{background:none;border:0;padding:4px 15px;color:var(--muted)}
.lesson.free .num{box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.left{color:var(--acc);font-size:14px;font-weight:600;margin-top:6px}
.notice{background:#1f2a00;border:1px solid rgba(198,255,0,.5);color:var(--acc);border-radius:16px;padding:11px 14px;margin-bottom:12px;font-weight:500}
.notice.plain{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:400}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.dhead{font-size:16px;color:var(--muted);margin:18px 4px 8px}
.field{margin:16px 0}.field>label{display:block;color:var(--muted);font-size:14px;margin:0 4px 6px}
.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#0D0D0D;border:1px solid var(--line);border-radius:16px;padding:4px}
.langs button{border-radius:12px;min-height:44px;font-weight:600;color:var(--muted)}
.langs button.on{color:var(--acc);box-shadow:inset 0 0 0 1.5px var(--acc)}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:22px;line-height:1.5}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.welcome{text-align:center;padding-top:30px}
.welcome .logo{width:88px;height:88px}
.welcome h1{font-size:32px;margin:12px 0 4px}
.tabbar{position:fixed;inset-inline:0;bottom:0;padding:0 16px calc(10px + env(safe-area-inset-bottom));z-index:5;pointer-events:none}
.tabbar .in{pointer-events:auto;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:rgba(16,16,16,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:28px;padding:6px}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;color:var(--muted);font-size:12px;font-weight:600;position:relative}
.tabbar button.on{color:var(--acc)}
.tabbar svg{width:24px;height:24px}
.tabbar .badge{position:absolute;top:2px;inset-inline-end:calc(50% - 22px);background:var(--acc);color:var(--acc-ink);border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.tabbar .badge:empty{display:none}
bdi{unicode-bidi:isolate}
[hidden]{display:none!important}
</style>
</head>

/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function wday(s){return parse(s).getDay();}
function todayISO(){return iso(new Date());}
function schoolDay(s){while(wday(s)>=5)s=addDays(s,1);return s;}
function stepDay(s,n){do{s=addDays(s,n);}while(wday(s)>=5);return s;}
function fmtDate(s){try{return new Intl.DateTimeFormat(LOC[prefs.lang],{day:'numeric',month:'long'}).format(parse(s));}catch(e){return s;}}
function fmtStamp(s){try{return new Intl.DateTimeFormat(LOC[prefs.lang],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(s));}catch(e){return s;}}
function mins(hm){var p=String(hm).split(':');return (+p[0])*60+(+p[1]);}
function nowMins(){var d=new Date();return d.getHours()*60+d.getMinutes();}

/* ---------- data helpers ---------- */
function byId(list,id){for(var i=0;i<(list||[]).length;i++)if(list[i].id===id)return list[i];return null;}
function per(n){var r=null;(STATE.periods||[]).forEach(function(p){if(p.n===n)r=p;});return r;}
function normT(s){return String(s||'').replace(/[״"'׳`\-–]/g,' ').replace(/\s+/g,' ').trim();}
function normQ(s){return normT(s).toLowerCase();}
// все учителя из расписания (по урокам), по алфавиту
function teachers(){if(teachers.k===STATE.updatedAt)return teachers.v;var seen={},out=[];
  STATE.lessons.forEach(function(l){var k=normT(l.teacher);if(k&&!seen[k]){seen[k]=1;out.push(l.teacher);}});
  out.sort(function(a,b){return a.localeCompare(b,'he');});teachers.k=STATE.updatedAt;teachers.v=out;return out;}
function meOk(){return !!(STATE&&prefs.teacher&&teachers().some(function(n){return normT(n)===normT(prefs.teacher);}));}
// кому этот урок: класс или группа (у группы — её уровень или блок, у групп одного класса — и класс)
function audName(a,sname){
  if(a.type==='class')return nm(byId(STATE.classes,a.id));
  var g=byId(STATE.groups,a.id);if(!g)return '';var cat=byId(STATE.subjects,g.subjectId),gn=nm(g);
  // блок (אשכול) — его название; математика, английский, физкультура — уровень или название группы
  var lbl=cat&&cat.multi?nm(cat):(gn||nm(cat));
  if(lbl===sname)lbl=''; // «חנ״ג בנים» у урока «חנ״ג בנים» — лишнее
  return [g.classId?nm(byId(STATE.classes,g.classId)):'',lbl].filter(Boolean).join(' · ')||nm(cat);
}
function changesFor(date,lid){return (STATE.changes||[]).filter(function(c){return c.date===date&&c.lessonId===lid;});}
// мои уроки в этот день; одинаковые уроки у нескольких классов (тот же номер, предмет и кабинет) — одна карточка
function myLessons(date){
  var wd=wday(date),me=normT(prefs.teacher),map={},out=[];
  STATE.lessons.forEach(function(l){if(l.day!==wd||normT(l.teacher)!==me)return;
    var k=l.period+'|'+l.subjectId+'|'+(l.room||''),ch=changesFor(date,l.id);
    if(map[k]){var x=map[k];var a=audName(l.aud,nm(byId(STATE.subjects,l.subjectId)));if(a&&x.aud.indexOf(a)<0)x.aud.push(a);ch.forEach(function(c){if(!x.ch.some(function(y){return y.type===c.type;}))x.ch.push(c);});return;}
    map[k]={l:l,ch:ch,aud:[audName(l.aud,nm(byId(STATE.subjects,l.subjectId)))].filter(Boolean)};out.push(map[k]);});
  return out.sort(function(a,b){return a.l.period-b.l.period;});
}
// мои классы (по урокам всего класса) — для событий отдельных классов
function myClasses(){var me=normT(prefs.teacher),s={};STATE.lessons.forEach(function(l){if(normT(l.teacher)===me&&l.aud.type==='class')s[l.aud.id]=1;});return s;}
function eventsFor(date){var mc=myClasses(),me=normT(prefs.teacher);
  return (STATE.events||[]).filter(function(e){if(e.date!==date)return false;if(e.teacher)return normT(e.teacher)===me;
    return !e.cls||e.cls.some(function(c){return mc[c];});});}
function dayOff(date){var e=eventsFor(date).filter(function(x){return x.off&&!x.from&&!x.cls;});return e.length?e[0]:null;}
function kind(x){var k='';x.ch.forEach(function(c){if(c.type==='test'||c.type==='exam')k=c.type;});return k;}
// контрольная одного предмета на несколько уроков подряд — одна карточка
function blocks(items){var out=[];items.forEach(function(x){var k=kind(x),b=out[out.length-1];
  if(b&&k&&b.k===k&&b.s===x.l.subjectId&&x.l.period>=b.last&&x.l.period<=b.last+1){b.last=x.l.period;}
  else out.push({k:k,s:x.l.subjectId,last:x.l.period,x:x});});return out;}
function upcomingTests(){var d=todayISO(),end=addDays(d,21),out=[];
  for(;d<=end;d=addDays(d,1)){if(wday(d)>=5||dayOff(d))continue;
    var its=myLessons(d).filter(function(x){return kind(x);});if(its.length)out.push({date:d,items:blocks(its)});}
  return out;}

/* ---------- data from server ---------- */
function load(){
  if(!API){ui.failed=!STATE;render();return;}
  ui.loading=!STATE;render();
  fetch(API+'/data',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    ui.loading=false;
    if(j&&Array.isArray(j.lessons)){if(!STATE||!STATE.updatedAt||!j.updatedAt||j.updatedAt>=STATE.updatedAt){STATE=j;sSet('skedyT.data',j);}ui.offline=false;ui.failed=false;}
    else{ui.offline=!!STATE;ui.failed=!STATE;}
    render();
  },function(){ui.loading=false;ui.offline=!!STATE;ui.failed=!STATE;render();});
}

/* ---------- screens ---------- */
function top(){return '<div class="top">'+LOGO+'<b>Skedy</b>'+(prefs.teacher&&meOk()?'<span class="who"><bdi>'+esc(prefs.teacher)+'</bdi></span>':'')+'</div>';}
function langSwitch(){var h='<div class="langs">';[['he','עב'],['en','EN'],['ru','RU']].forEach(function(x){h+='<button class="'+(prefs.lang===x[0]?'on':'')+'" data-act="lang" data-id="'+x[0]+'">'+x[1]+'</button>';});return h+'</div>';}
function chev(n){var r=(n<0)===(document.documentElement.dir==='rtl');return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(r?'M9 6l6 6-6 6':'M15 6l-6 6 6 6')+'"/></svg>';}
function renderPick(){
  var h='<div class="welcome">'+LOGO.replace('class="logo"','class="logo big"')+'<h1>'+esc(t('app'))+'</h1></div>';
  h+='<div class="field">'+langSwitch()+'</div>';
  h+='<h2>'+esc(t('pickTitle'))+'</h2><p class="sub">'+esc(t('pickSub'))+'</p>';
  h+='<input class="input" id="q" type="search" autocomplete="off" dir="auto" placeholder="'+esc(t('searchPh'))+'" value="'+esc(ui.q)+'">';
  var q=normQ(ui.q),n=0;h+='<div class="list" id="tl">';
  teachers().forEach(function(name){var k=normQ(name),ok=!q||k.indexOf(q)>=0;if(ok)n++;
    h+='<button data-act="me" data-id="'+esc(name)+'" data-key="'+esc(k)+'"'+(ok?'':' hidden')+'><bdi>'+esc(name)+'</bdi></button>';});
  h+='</div><p class="muted center" id="nomatch"'+(n?' hidden':'')+'>'+esc(t('noMatch'))+'</p>';
  return h+'<div class="center"><a class="link" href="../">'+esc(t('studentApp'))+'</a></div>';
}
function card(x,mark,after,toP){
  var l=x.l,s=byId(STATE.subjects,l.subjectId),cls=[],tags='',roomHtml=esc(l.room||'');
  if(mark){cls.push('is-'+mark);tags+='<span class="tag '+mark+'">'+esc(t(mark+'Tag'))+'</span>';}
  x.ch.forEach(function(c){cls.push('is-'+c.type);
    if(c.type==='room'){roomHtml=(l.room?'<s>'+esc(l.room)+'</s> ':'')+'<mark>'+esc(c.room||'')+'</mark>';tags+='<span class="tag">'+esc(t('roomChanged'))+'</span>';}
    else tags+='<span class="tag '+esc(c.type)+'">'+esc(t(c.type==='cancel'?'cancelled':c.type))+(c.note?': <bdi>'+esc(c.note)+'</bdi>':'')+'</span>';});
  var p=per(l.period),pe=toP&&toP>l.period?per(toP):null,time=p?(p.start+'–'+(pe||p).end):'';
  return '<li class="lesson '+esc(cls.join(' '))+'"><div class="num">'+esc(pe?l.period+'–'+toP:l.period)+'</div><div class="body">'+
    '<div class="r1"><span class="subj">'+esc(nm(s))+'</span><span class="time">'+esc(time)+'</span></div>'+
    '<div class="r2"><span class="aud"><bdi>'+esc(x.aud.join(', '))+'</bdi></span>'+(l.room||x.ch.some(function(c){return c.type==='room';})?'<span>'+(/^חדר/.test(l.room||'')?'':esc(t('room'))+' ')+'<bdi>'+roomHtml+'</bdi></span>':'')+'</div>'+
    (tags?'<div class="tags">'+tags+'</div>':'')+(after||'')+'</div></li>';
}
function renderDay(){
  var d=ui.date,today=todayISO(),wd=wday(d),h=top();
  if(ui.offline)h+='<div class="notice plain small">'+esc(t('offline'))+'</div>';
  h+='<div class="dayhead"><button class="icon-btn" data-act="day" data-n="-1" aria-label="'+esc(t('prevDay'))+'">'+chev(-1)+'</button><div class="t"><p class="wd">'+
    esc(d===today?t('today'):d===addDays(today,1)?t('tomorrow'):DAYS[prefs.lang][wd])+'</p><div class="dt">'+esc((d===today||d===addDays(today,1)?DAYS[prefs.lang][wd]+', ':'')+fmtDate(d))+'</div></div>'+
    '<button class="icon-btn" data-act="day" data-n="1" aria-label="'+esc(t('nextDay'))+'">'+chev(1)+'</button></div>';
  var sun=addDays(d,-wd);h+='<div class="strip">';
  for(var i=0;i<5;i++){var di=addDays(sun,i);h+='<button class="chip'+(di===d?' on':'')+(di===today?' today':'')+'" data-act="goto" data-id="'+di+'"><b>'+esc(DAYS_S[prefs.lang][i])+'</b></button>';}
  h+='</div>';
  if(schoolDay(today)!==d&&Math.abs(parse(d)-parse(schoolDay(today)))>6*864e5)h+='<div class="center"><button class="link" data-act="goto" data-id="'+schoolDay(today)+'">'+esc(t('backToday'))+'</button></div>';
  var off=dayOff(d);
  eventsFor(d).forEach(function(e){h+='<div class="notice">'+esc(e.text)+(e.from?' · '+esc(e.from===e.to?t('period')+' '+e.from:t('periods')+' '+e.from+'–'+e.to):'')+(e.room?' · <bdi>'+esc(e.room)+'</bdi>':'')+'</div>';});
  if(off)return h+'<div class="empty">'+esc(t('noSchool'))+'</div>';
  var ls=myLessons(d);
  if(!ls.length)return h+'<div class="empty">'+esc(t('noLessons'))+'</div>';
  // текущий и следующий урок — только сегодня
  var nowP=0,nextP=0,nm_=nowMins();
  if(d===today){ls.forEach(function(x){var p=per(x.l.period);if(!p||x.ch.some(function(c){return c.type==='cancel';}))return;
    if(nm_>=mins(p.start)&&nm_<mins(p.end))nowP=x.l.period;else if(!nextP&&mins(p.start)>nm_)nextP=x.l.period;});}
  var first=ls[0].l.period,last=ls[ls.length-1].l.period,by={};ls.forEach(function(x){(by[x.l.period]=by[x.l.period]||[]).push(x);});
  h+='<ul class="lessons">';
  for(var n=first;n<=last;n++){
    if(!by[n]){var fp=per(n);if(fp)h+='<li class="lesson free"><div class="num">'+n+'</div><div class="body"><div class="r1"><span>'+esc(t('free'))+'</span><span class="time">'+esc(fp.start+'–'+fp.end)+'</span></div></div></li>';continue;}
    by[n].forEach(function(x){var mark=x.l.period===nowP?'now':x.l.period===nextP?'next':'';
      var after='';if(mark==='now'){var p=per(n);after='<div class="left">'+esc(t('minLeft').replace('{n}',mins(p.end)-nm_))+'</div>';}
      h+=card(x,mark,after);});
  }
  return h+'</ul><div class="foot">'+(STATE.updatedAt?esc(t('updated'))+': '+esc(fmtStamp(STATE.updatedAt))+'<br>':'')+esc(t('notOfficial'))+'</div>';
}
function renderTests(){
  var h=top()+'<h2>'+esc(t('testsTitle'))+'</h2><p class="sub">'+esc(t('testsSub'))+'</p>',days=upcomingTests(),today=todayISO();
  if(!days.length)return h+'<div class="empty">'+esc(t('noTests'))+'</div>';
  days.forEach(function(x){var rel=x.date===today?t('today'):x.date===addDays(today,1)?t('tomorrow'):DAYS[prefs.lang][wday(x.date)];
    h+='<div class="dhead">'+esc(rel+', '+fmtDate(x.date))+'</div><ul class="lessons">';
    x.items.forEach(function(b){h+=card(b.x,'','',b.last);});h+='</ul>';});
  return h;
}
function renderMore(){
  var h=top()+'<h2>'+esc(t('navMore'))+'</h2><div class="field"><label>'+esc(t('language'))+'</label>'+langSwitch()+'</div>';
  h+='<div class="stack"><button class="secondary" data-act="change">'+esc(t('changeMe'))+'</button>';
  if(!(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)&&navigator.standalone!==true)h+='<div class="notice plain small"><b>'+esc(t('install'))+'</b><br>'+esc(t('installHint'))+'</div>';
  h+='</div><div class="center" style="margin-top:10px"><a class="link" href="../">'+esc(t('studentApp'))+'</a></div>';
  return h+'<div class="foot">'+(STATE.updatedAt?esc(t('updated'))+': '+esc(fmtStamp(STATE.updatedAt))+'<br>':'')+esc(t('notOfficial'))+'</div>';
}
var NAV=[['day','navDay','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'],
  ['tests','navTests','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 3.5h6v3H9zM9 13l2 2 4-4"/></svg>'],
  ['more','navMore','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>']];
function nav(){var nt=0;upcomingTests().forEach(function(x){nt+=x.items.length;});
  var h='<nav class="tabbar"><div class="in">';NAV.forEach(function(x){h+='<button class="'+(ui.screen===x[0]?'on':'')+'" data-act="tab" data-id="'+x[0]+'">'+x[2]+'<span>'+esc(t(x[1]))+'</span><span class="badge">'+(x[0]==='tests'&&nt?nt:'')+'</span></button>';});
  return h+'</div></nav>';}

/* ---------- render ---------- */
var root=document.getElementById('root');
function render(){
  document.documentElement.lang=prefs.lang;document.documentElement.dir=prefs.lang==='he'?'rtl':'ltr';document.title=t('app');
  var h;
  if(!STATE)h=top()+'<div class="empty">'+esc(ui.failed?t('loadFail'):t('loading'))+(ui.failed?'<div class="stack"><button class="primary" data-act="retry">'+esc(t('retry'))+'</button></div>':'')+'</div>';
  else if(!meOk()||ui.screen==='pick')h=renderPick();
  else{if(!ui.date)ui.date=schoolDay(todayISO());
    h=(ui.screen==='tests'?renderTests():ui.screen==='more'?renderMore():renderDay())+nav();}
  root.innerHTML=h;
}
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act'),id=el.getAttribute('data-id');
  switch(a){
    case 'me':prefs.teacher=id;savePrefs();ui.screen='day';ui.q='';ui.date=schoolDay(todayISO());render();window.scrollTo(0,0);break;
    case 'change':ui.screen='pick';render();window.scrollTo(0,0);break;
    case 'lang':prefs.lang=id;savePrefs();render();break;
    case 'tab':if(id==='day'&&ui.screen==='day')ui.date=schoolDay(todayISO());ui.screen=id;render();window.scrollTo(0,0);break;
    case 'day':ui.date=stepDay(ui.date,+el.getAttribute('data-n'));render();break;
    case 'goto':ui.date=id;render();break;
    case 'retry':load();break;
  }
});
// поиск учителя: фильтруем список без перерисовки, чтобы не прыгала клавиатура
root.addEventListener('input',function(e){if(!e.target||e.target.id!=='q')return;ui.q=e.target.value;var q=normQ(ui.q),n=0;
  root.querySelectorAll('#tl [data-key]').forEach(function(b){var ok=!q||b.getAttribute('data-key').indexOf(q)>=0;b.hidden=!ok;if(ok)n++;});
  var nm_=document.getElementById('nomatch');if(nm_)nm_.hidden=!!n;});
// сменить день свайпом
var sx=null;root.addEventListener('touchstart',function(e){sx=ui.screen==='day'&&e.touches.length===1?e.touches[0].clientX:null;},{passive:true});
root.addEventListener('touchend',function(e){if(sx==null||!STATE||!meOk())return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)<70)return;
  var fwd=dx<0;if(document.documentElement.dir==='rtl')fwd=!fwd;ui.date=stepDay(ui.date,fwd?1:-1);render();},{passive:true});

/* ---------- start ---------- */
render();load();
// раз в минуту обновляем «сейчас» и «осталось», раз в 5 минут — данные
setInterval(function(){if(ui.screen==='day'&&STATE&&meOk())render();},60000);
setInterval(load,300000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(function(){});
})();
</script>
