# Cloudflare Worker «hamaarechet» — сервер расписания (адрес в ../config.js).
# Скачано из аккаунта Cloudflare командой `wrangler init --from-dash hamaarechet`.
#
# Секретов здесь нет и быть не должно. Они хранятся в Cloudflare Secrets:
#   EDITOR_CODE — код редактора (wrangler secret put EDITOR_CODE)
# Для локального запуска (wrangler dev) секреты кладутся в worker/.dev.vars — он в .gitignore.
# Необязательные переменные: CONTACT (mailto:…), SHAHAF_URL — сейчас не заданы.

name = "hamaarechet"
main = "src/worker.js"
compatibility_date = "2026-10-05"
workers_dev = true
preview_urls = false

[triggers]
crons = ["*/15 * * * *"]

[[kv_namespaces]]
binding = "DB"
id = "f3a6798ded224574b51316a4f046d17e"

[[queues.producers]]
binding = "PUSHQ"
queue = "hamaarechet-push"

# Этот же Worker забирает задачи из очереди (по одной — см. комментарий в src/worker.js).
# Значения совпадают с текущими в Cloudflare (wrangler queues consumer list hamaarechet-push,
# 2026-10-21), чтобы deploy их не менял. max_concurrency не задан = автоматически, как сейчас.
[[queues.consumers]]
queue = "hamaarechet-push"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
retry_delay = 0

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Счётчики попыток входа и подписок по IP (класс Limiter в src/worker.js).
# SQLite-хранилище — единственное доступное на бесплатном тарифе.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

# Анонимный счётчик устройств (класс Stats в src/worker.js): POST /ping, GET /stats.
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
